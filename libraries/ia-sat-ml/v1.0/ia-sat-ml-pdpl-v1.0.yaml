    - urn: urn:intuitem:risk:req_node:ia-sat-ml-pdpl:30.1
      assessable: true
      depth: 2
      parent_urn: urn:intuitem:risk:req_node:ia-sat-ml-pdpl:root
      ref_id: '30.1'
      name: Without prejudice to the provisions of this Law and the powers of the Saudi C…
      description: 'Without prejudice to the provisions of this Law and the powers of the Saudi Central
        Bank pursuant to applicable legal provisions, the Competent Authority shall be the entity in charge
        of overseeing the implementation of this Law and the Regulations.


        **Implementation guide**


        Acknowledge SDAIA as Competent Authority for PDPL oversight and establish compliance monitoring
        processes and designated regulatory contacts


        **Verification method**


        Review SDAIA acknowledgment documents and compliance structure and verify monitoring processes
        and regulatory contact designation'
      typical_evidence: • Documentation of regulatory authority acknowledgment • Evidence of compliance
        monitoring structure
    - urn: urn:intuitem:risk:req_node:ia-sat-ml-pdpl:30.2
      assessable: true
      depth: 2
      parent_urn: urn:intuitem:risk:req_node:ia-sat-ml-pdpl:root
      ref_id: '30.2'
      name: The Regulations shall identify the situations where the Controller shall appo…
      description: 'The Regulations shall identify the situations where the Controller shall appoint one
        or more persons as personal data protection officer(s). and shall set the responsibilities of
        any such person in accordance with the provisions of this Law.


        **Implementation guide**


        Appoint a qualified Data Protection Officer (DPO) with clear responsibilities, reporting lines,
        and authority to oversee PDPL compliance.


        **Verification method**


        Review DPO appointment, responsibilities, and qualifications and verify DPO independence and authority'
      typical_evidence: • DPO appointment letter • DPO job description • Organizational chart showing
        DPO reporting line
    - urn: urn:intuitem:risk:req_node:ia-sat-ml-pdpl:30.3
      assessable: true
      depth: 2
      parent_urn: urn:intuitem:risk:req_node:ia-sat-ml-pdpl:root
      ref_id: '30.3'
      name: The Controller shall cooperate with the Competent Authority in performing its…
      description: 'The Controller shall cooperate with the Competent Authority in performing its duties
        to supervise the implementation of the provisions of this Law and the Regulations, and shall take
        such steps as necessary in connection with the related matters referred to the Controller by the
        Competent Authority.


        **Implementation guide**


        1. Develop formal procedures for engaging with SDAIA, including designated points of contact,
        response timelines, and escalation procedures. 2. Document all regulatory interactions.


        **Verification method**


        Review regulatory correspondence history and response timeliness'
      typical_evidence: • Documented cooperation procedures describing how requests are received, assessed,
        escalated, and fulfilled. • Competent Authority correspondence log (all SDAIA/NDMO communications
        and references). • Escalation and response timelines
    - urn: urn:intuitem:risk:req_node:ia-sat-ml-pdpl:30.4
      assessable: true
      depth: 2
      parent_urn: urn:intuitem:risk:req_node:ia-sat-ml-pdpl:root
      ref_id: '30.4'
      name: The Competent Authority, in order to carry out its duties related to supervis…
      description: 'The Competent Authority, in order to carry out its duties related to supervising the
        implementation of the provisions of the Law and Regulations, may: A. Request the necessary documents
        or information from the Controller to ensure its compliance with the provisions of the Law and
        Regulations. B. Request the cooperation of any other party for the purposes of support in accomplishing
        supervisory duties and enforcement of the provisions of the Law and Regulations. C. Specify the
        appropriate tools and mechanisms for monitoring Controllers’ compliance with the provisions of
        the Law and the Regulations, including maintaining a national register of Controllers for this
        purpose. D. Provide services related to Personal Data protection through the national registerreferred
        to in Subparagraph (c) of this Paragraph or through any other means deemed appropriate. The Competent
        Authority may collect a fee for the Personal Data protection services it may provide


        **Implementation guide**


        Ensure the Controller is duly enrolled in the national register (when in scope), maintain clear
        procedures to locate and supply any documents or information requested by the Competent Authority
        and to coordinate with other parties where required, and define in policy how internal teams will
        comply with monitoring mechanisms (such as prescribed reporting formats, portals, or registers)
        so supervisory and enforcement activities can be performed smoothly and on time.


        **Verification method**


        Check that the organization is registered (if required), can quickly evidence responses to document/
        information requests, and has a defined approach to comply with monitoring tools and reporting
        obligations'
      typical_evidence: • National Register enrollment evidence (registration on SDAIA’s National Data
        Governance Platform and valid certificate, where applicable). • Document retrieval and response
        procedures for handling Competent Authority document/information requests and cooperation requests
        involving other parties. • Compliance monitoring policy
    - urn: urn:intuitem:risk:req_node:ia-sat-ml-pdpl:30.5
      assessable: true
      depth: 2
      parent_urn: urn:intuitem:risk:req_node:ia-sat-ml-pdpl:root
      ref_id: '30.5'
      name: The Competent Authority may, at its discretion, delegate to other authorities…
      description: 'The Competent Authority may, at its discretion, delegate to other authorities the
        accomplishment of some of its duties that are related to supervision or enforcement of the provisions
        of the Law and Regulations


        **Implementation guide**


        Maintain an inventory of authorities that have delegated or sector‑specific supervisory and enforcement
        powers under the PDPL, document how their PDPL‑related rules and guidance map to the organization’s
        privacy and control framework, and design policies, reporting, and oversight activities so that
        both central PDPL requirements and additional sector‑specific expectations are consistently implemented
        and followed.


        **Verification method**


        Verify that an inventory of delegated or sectoral authorities exists, check that their PDPL‑related
        requirements are mapped into the organization’s controls and policies, and ensure that evidence
        of compliance with these requirements is available'
      typical_evidence: • Delegated authority awareness records ((list/guidance identifying authorities
        with delegated PDPL powers over the organization and their scope) • Evidence of compliance with
        sector‑specific PDPL requirements issued by delegated/sectoral authorities
    - urn: urn:intuitem:risk:req_node:ia-sat-ml-pdpl:12.0
      assessable: true
      depth: 2
      parent_urn: urn:intuitem:risk:req_node:ia-sat-ml-pdpl:root
      ref_id: '12.0'
      name: The Controller shall use a privacy policy and make it available to Data Subje…
      description: 'The Controller shall use a privacy policy and make it available to Data Subjects for
        their information prior to collecting their Personal Data. The policy shall specify the purpose
        of Collection, Personal Data to be collected, the means used for Collection, Processing, storage
        and Destruction, and information about the Data Subject rights and how to exercise such rights.


        **Implementation guide**


        Maintain a privacy policy that clearly describes purposes of collection, categories of Personal
        Data collected, means of collection, Processing, storage and destruction practices, and Data Subject
        rights and how to exercise them, approve and publish the policy in all relevant channels, and
        ensure it is presented or made accessible to Data Subjects before any Personal Data is collected.


        **Verification method**


        Verify that a current privacy policy exists and is publicly accessible, check that Data Subjects
        can see or access it before providing Personal Data, and ensure the content covers purposes, data
        categories, collection/processing/storage/destruction methods, and Data Subject rights'
      typical_evidence: • Published privacy policy • Evidence of policy availability before data collection
        • Policy version history
    - urn: urn:intuitem:risk:req_node:ia-sat-ml-pdpl:19.0
      assessable: true
      depth: 2
      parent_urn: urn:intuitem:risk:req_node:ia-sat-ml-pdpl:root
      ref_id: '19.0'
      name: The Controller shall implement all the necessary organizational, administrati…
      description: 'The Controller shall implement all the necessary organizational, administrative and
        technical measures to protect Personal Data, including during the Transfer of Personal Data, in
        accordance with the provisions and controls set out in the Regulations.


        **Implementation guide**


        Establish and maintain organizational, administrative, and technical security measures that are
        explicitly designed to protect Personal Data at rest, in use, and in transit, including documented
        information security policies, implemented technical controls (such as encryption, access control,
        logging, and secure transfer mechanisms), and procedures aligned with the PDPL Regulations. Ensure
        that Personal Data Transfers use appropriate protection mechanisms (for example, encrypted channels,
        secure file exchange, or vetted integrations), and regularly review and update these measures
        based on risk assessments, regulatory updates, and security testing results. make sure these requirements
        are mandated and documented in the related policy such as the data protection policy


        **Verification method**


        Verify that documented security policies and standards exist and explicitly cover Personal Data
        protection, check that technical controls (encryption, access controls, network security, monitoring)
        are implemented and aligned with those standards, and review audit or assessment reports to ensure
        effectiveness'
      typical_evidence: • Information security policies including the data protection policy or policy
        statement requiring the protection of personal data as mandated. • Technical controls documentation
        • Encryption standards • Access control matrices • Security audit reports
    - urn: urn:intuitem:risk:req_node:ia-sat-ml-pdpl:22
      assessable: true
      depth: 2
      parent_urn: urn:intuitem:risk:req_node:ia-sat-ml-pdpl:root
      ref_id: '22'
      name: The Controller shall conduct an impact assessment of Personal Data Processing…
      description: 'The Controller shall conduct an impact assessment of Personal Data Processing in relation
        to any product or service, based on the nature of the activity carried out by the Controller,
        in accordance with the relevant provisions of the Regulations.


        **Implementation guide**


        Establish DPIA methodology and conduct assessments for all processing activities, especially high-risk
        processing involving sensitive data or large-scale processing.


        **Verification method**


        Review DPIA reports ensuring assessments were conducted and verify risk mitigation actions'
      typical_evidence: • Data Protection Impact Assessment (DPIA) methodology • Completed DPIA reports
        • Risk assessment documentation • Mitigation action plans
    - urn: urn:intuitem:risk:req_node:ia-sat-ml-pdpl:2.1
      assessable: true
      depth: 2
      parent_urn: urn:intuitem:risk:req_node:ia-sat-ml-pdpl:root
      ref_id: '2.1'
      name: The Law applies to any Processing of Personal Data related to individuals tha…
      description: 'The Law applies to any Processing of Personal Data related to individuals that takes
        place in the Kingdom by any means, including the Processing of Personal Data related to individuals
        residing in the Kingdom by any means from any party outside the Kingdom. This includes the data
        of the deceased if it would lead to them or a member of their family being identified specifically.


        **Implementation guide**


        Define and document the applicability of the Law in the main privacy policy and any data‑protection
        policy / standard, explicitly listing in‑Kingdom Processing, Processing of Kingdom residents’
        data from abroad, and deceased‑person data that can identify them or their family. Make sure your
        processing inventory, onboarding of new systems/vendors, and templates all include a mandatory
        “PDPL in scope?” check based on these criteria, so nothing falling under this definition is left
        outside the Law’s controls.


        **Verification method**


        confirm that policies and registers reflect all three scope dimensions: Processing in KSA, Processing
        of individuals residing in KSA from outside KSA, and deceased‑person data that can identify them
        or their family. Sample several activities in each category to verify they are treated as in‑scope
        for PDPL (i.e., subject to PDPL controls, rights, and governance)'
      typical_evidence: '• Documented scope statement (policy/standard) stating the Law applies to: processing
        in the Kingdom; processing of individuals residing in the Kingdom from outside; and identifiable
        deceased‑person/family data. • Processing inventory/RoPA'
    - urn: urn:intuitem:risk:req_node:ia-sat-ml-pdpl:2.2
      assessable: true
      depth: 2
      parent_urn: urn:intuitem:risk:req_node:ia-sat-ml-pdpl:root
      ref_id: '2.2'
      name: The scope of applying the Law excludes the individual's Personal Data Process…
      description: 'The scope of applying the Law excludes the individual''s Personal Data Processing
        for purposes that do not go beyond personal or family use, as long as the Data Subject did not
        publish or disclose it to others. The Regulations shall define personal and family use provided
        in this Paragraph.


        **Implementation guide**


        Document any processing activities excluded from scope with clear justification based on personal/family
        use criteria.


        **Verification method**


        Review exclusion justifications and criteria application'
      typical_evidence: • Scope exclusion documentation / policy • Personal/family use assessment criteria
    - urn: urn:intuitem:risk:req_node:ia-sat-ml-pdpl:3
      assessable: true
      depth: 2
      parent_urn: urn:intuitem:risk:req_node:ia-sat-ml-pdpl:root
      ref_id: '3'
      name: The provisions and procedures stated in this Law shall not prejudice any prov…
      description: 'The provisions and procedures stated in this Law shall not prejudice any provision
        that grants a right to the Data Subject or confers better protection to Personal Data pursuant
        to any other law or an international agreement to which the Kingdom is a party.


        **Implementation guide**


        Map all applicable laws and international agreements against PDPL requirements. Where conflicts
        exist, apply the most protective standard


        **Verification method**


        Review regulatory mapping and compliance documentation and verify that identified higher-standard
        requirements are reflected in policies and controls'
      typical_evidence: • Regulatory mapping document covering applicable KSA laws and international agreements
        • Gap analysis identifying highest applicable protection standard
    - urn: urn:intuitem:risk:req_node:ia-sat-ml-pdpl:4
      assessable: true
      depth: 2
      parent_urn: urn:intuitem:risk:req_node:ia-sat-ml-pdpl:root
      ref_id: '4'
      name: Data Subject shall have the following rights pursuant to this Law and as set…
      description: 'Data Subject shall have the following rights pursuant to this Law and as set out in
        the Regulations:


        **Implementation guide**


        Maintain a Data Subject Rights Policy that lists all rights granted under the Law and Regulations,
        define clear procedures for how Data Subjects can submit requests and how the organization assesses,
        approves, rejects, and responds to them within legal timeframes, and operate intake and tracking
        mechanisms that log each request, record decisions and communications, and ensure consistent,
        auditable handling.


        **Verification method**


        Review rights management framework and procedures'
      typical_evidence: • Data Subject Rights Policy • Rights exercise procedures • Request handling (intake
        and tracking) mechanisms
    - urn: urn:intuitem:risk:req_node:ia-sat-ml-pdpl:4.1
      assessable: true
      depth: 2
      parent_urn: urn:intuitem:risk:req_node:ia-sat-ml-pdpl:root
      ref_id: '4.1'
      name: The right to be informed about the legal basis and the purpose of the Collect…
      description: 'The right to be informed about the legal basis and the purpose of the Collection of
        their Personal Data.


        **Implementation guide**


        Maintain privacy notices and collection‑point notifications that clearly state the legal basis
        and purposes of Personal Data collection, ensure these notices are presented or made accessible
        to Data Subjects before or at the time their data is collected, and retain records or technical
        logs that show when and how this information was provided or acknowledged.


        **Verification method**


        Verify that privacy notices and collection‑point messages explicitly include legal basis and purpose,
        check that they are visible or delivered before Personal Data is collected, and confirm that records
        or logs exist demonstrating provision or acknowledgment'
      typical_evidence: • Privacy notices • Collection point notifications • Information provision records
        • Records confirming notice delivery or acknowledgment
    - urn: urn:intuitem:risk:req_node:ia-sat-ml-pdpl:4.2
      assessable: true
      depth: 2
      parent_urn: urn:intuitem:risk:req_node:ia-sat-ml-pdpl:root
      ref_id: '4.2'
      name: The right to access their Personal Data held by the Controller, in accordance…
      description: 'The right to access their Personal Data held by the Controller, in accordance with
        the rules and procedures set out in the Regulations, and without prejudice to the provisions of
        Article (9) of this Law.


        **Implementation guide**


        Maintain a clear access‑request channel (such as a standardized form, portal, or dedicated contact
        point), define and implement procedures to verify the requester’s identity, locate and compile
        the Personal Data held by the Controller, apply any limitations or exemptions required by Article
        (9), and provide the response within the timeframes and format specified in the Regulations, recording
        each step taken.


        **Verification method**


        Verify that a functioning access‑request mechanism exists and is communicated to Data Subjects,
        check that identity verification is performed before disclosing Personal Data and that any Article
        (9) limitations are applied consistently, and confirm through the access‑request log that responses
        are timely, complete, and documented'
      typical_evidence: • Access request form/portal • Access request log with response timestamps • Identity
        verification procedures
    - urn: urn:intuitem:risk:req_node:ia-sat-ml-pdpl:4.3
      assessable: true
      depth: 2
      parent_urn: urn:intuitem:risk:req_node:ia-sat-ml-pdpl:root
      ref_id: '4.3'
      name: The right to request obtaining their Personal Data held by the Controller in…
      description: 'The right to request obtaining their Personal Data held by the Controller in a readable
        and clear format, in accordance with the controls and procedures specified by the Regulations.


        **Implementation guide**


        Maintain a defined process that allows Data Subjects to request a copy of their Personal Data,
        implement procedures to extract and provide that data in a structured, readable, and clear format
        consistent with the Regulations, and ensure that requests, identity verification, applied limitations,
        and delivery details are logged and handled within required timeframes.


        **Verification method**


        Verify that Data Subjects have a clear way to request a copy of their Personal Data, check sample
        requests and responses to confirm that data is provided in a readable and clear format within
        the required time, and ensure procedures are consistently followed'
      typical_evidence: • Data portability / data‑copy procedures (describing how the organization prepares
        and provides readable, clear exports of Personal Data). • Standard export formats and templates
        used to provide Personal Data to Data Subjects • Sample data exports
    - urn: urn:intuitem:risk:req_node:ia-sat-ml-pdpl:4.4
      assessable: true
      depth: 2
      parent_urn: urn:intuitem:risk:req_node:ia-sat-ml-pdpl:root
      ref_id: '4.4'
      name: The right to request correcting, completing, or updating their Personal Data…
      description: 'The right to request correcting, completing, or updating their Personal Data held
        by the Controller.


        **Implementation guide**


        Maintain a defined process that allows Data Subjects to submit requests to correct, complete,
        or update their Personal Data, implement procedures to assess and action these requests within
        required timeframes, update the underlying records in relevant systems, and send appropriate confirmations
        or responses to the Data Subject, keeping an auditable log of all steps taken.


        **Verification method**


        Verify that a functioning correction request channel exists, check that correction requests are
        logged with decisions and completion dates, and ensure that sample cases show that records were
        updated and Data Subjects were informed'
      typical_evidence: • Correction request form/portal • Correction request log • Sample updated confirmation
        records sent to data subject
    - urn: urn:intuitem:risk:req_node:ia-sat-ml-pdpl:4.5
      assessable: true
      depth: 2
      parent_urn: urn:intuitem:risk:req_node:ia-sat-ml-pdpl:root
      ref_id: '4.5'
      name: The right to request a Destruction of their Personal Data held by the Control…
      description: 'The right to request a Destruction of their Personal Data held by the Controller when
        such Personal Data is no longer needed by Data Subject, without prejudice to the provisions of
        Article (18) of this Law.


        **Implementation guide**


        Implement erasure request mechanism with verification of legal retention requirements before destruction
        and Issue destruction certificates upon completion and document any exceptions with justification.


        **Verification method**


        Verify that a functioning destruction request channel exists, check the destruction request log
        to confirm that requests are assessed against legal retention requirements and handled within
        required timeframes, and review sample records and certificates to ensure that data is securely
        destroyed or properly justified as retained'
      typical_evidence: • Destruction request form/portal • Destruction request log • Destruction certificates
        • Retention exception documentation
    - urn: urn:intuitem:risk:req_node:ia-sat-ml-pdpl:5.1
      assessable: true
      depth: 2
      parent_urn: urn:intuitem:risk:req_node:ia-sat-ml-pdpl:root
      ref_id: '5.1'
      name: Except for the cases stated in this Law, neither Personal Data may be process…
      description: 'Except for the cases stated in this Law, neither Personal Data may be processed nor
        the purpose of Personal Data Processing may be changed without the consent of the Data Subject.
        The Regulations Shall set out the conditions of the consent, the cases in which the consent must
        be explicit, and the terms and conditions related to obtaining the consent of the legal guardian
        if the Data Subject fully or partially lacks legal capacity.


        **Implementation guide**


        Define and implement a consent management framework that specifies when consent is required or
        may be relied on, when explicit consent is needed, and how consent is obtained, recorded, and
        withdrawn, including special rules for Data Subjects who lack full legal capacity. Configure collection
        channels and systems so that consent is captured before Processing or changes of purpose proceed,
        store consent records in a reliable system of record, and apply guardian consent procedures wherever
        applicable.


        **Verification method**


        Verify that a consent management policy and procedures exist and reflect PDPL conditions (including
        explicit and guardian consent), check that consent is actually collected through documented mechanisms
        before Processing or purpose change, and review consent records to ensure they are complete, traceable,
        and linked to specific purposes'
      typical_evidence: • Consent management policy defining when consent is required, when it must be
        explicit, and how it can be withdrawn. • Consent collection mechanisms • Consent records/database
        • Guardian consent procedures
    - urn: urn:intuitem:risk:req_node:ia-sat-ml-pdpl:5.2
      assessable: true
      depth: 2
      parent_urn: urn:intuitem:risk:req_node:ia-sat-ml-pdpl:root
      ref_id: '5.2'
      name: In all cases, Data Subject may withdraw the consent mentioned in Paragraph (1…
      description: 'In all cases, Data Subject may withdraw the consent mentioned in Paragraph (1) of
        this Article at any time; the Regulations determines the necessary controls for such case.


        **Implementation guide**


        Provide Data Subjects with a clear and accessible mechanism to withdraw consent at any time, define
        and implement procedures that record the withdrawal, identify and update all affected systems
        and Processing activities, and stop or restrict Processing in line with the Regulations and any
        other lawful bases. Ensure that all withdrawal events, decisions, and system updates are logged
        and, where appropriate, communicated to the Data Subject.


        **Verification method**


        Verify that a working consent‑withdrawal option exists and is clearly communicated to Data Subjects,
        check the withdrawal request log to confirm that withdrawals are recorded and acted on promptly,
        and ensure that sample cases show Processing being limited or stopped in line with defined procedures'
      typical_evidence: • Consent withdrawal mechanism • Withdrawal request log • Post-withdrawal processing
        procedures
    - urn: urn:intuitem:risk:req_node:ia-sat-ml-pdpl:6
      assessable: true
      depth: 2
      parent_urn: urn:intuitem:risk:req_node:ia-sat-ml-pdpl:root
      ref_id: '6'
      name: In the following cases, Processing of Personal Data shall not be subject to t…
      description: 'In the following cases, Processing of Personal Data shall not be subject to the consent
        referred to in Paragraph (1) of Article (5) herein:


        **Implementation guide**


        Define a policy that enumerates and explains all legal bases and exemption cases where consent
        is not required, linking them directly to the Law and future detailed subsections you will add.
        Integrate a legal‑basis assessment step into DPIAs, new processing approvals, and change requests
        so that, whenever consent is not used, the chosen exemption and rationale are captured, reviewed
        (e.g., by Legal/DPO), and stored centrally with traceability to the processing register.


        **Verification method**


        Check that a formal consent‑exemption or legal‑basis policy exists and aligns with the Law, then
        sample processing activities that do not rely on consent to confirm that each has a documented
        exemption, justification, and approval.'
      typical_evidence: • Consent exemption policy defining when Processing may proceed without consent
        under the Law and how each exemption is interpreted and approved. • Legal basis assessment records
        per exemption claimed, documenting which exemption was used instead of consent, the justification,
        approver, and validity period.
    - urn: urn:intuitem:risk:req_node:ia-sat-ml-pdpl:6.1
      assessable: true
      depth: 2
      parent_urn: urn:intuitem:risk:req_node:ia-sat-ml-pdpl:root
      ref_id: '6.1'
      name: If the Processing serves actual interests of the Data Subject, but communicat…
      description: 'If the Processing serves actual interests of the Data Subject, but communicating with
        the Data Subject is impossible or difficult.


        **Implementation guide**


        Define criteria and guidance describing what counts as serving the Data Subject’s actual interests
        and what “impossible or difficult” communication means, then integrate these into your legal‑basis/consent‑exemption
        workflow. For each processing activity that relies on this exemption, ensure staff document the
        attempts or obstacles to contacting the Data Subject, record the justification for relying on
        this legal basis, and obtain appropriate internal approval, keeping all records in a central,
        auditable repository.


        **Verification method**


        Check that documented criteria exist for using this exemption and that staff are aware of them,
        then sample processing records where this exemption is claimed to confirm that each includes:
        evidence of communication difficulty, a clear explanation of how the processing served the Data
        Subject’s actual interests, and formal approval.'
      typical_evidence: • Vital interest assessment criteria. • Sample evidence that contacting the Data
        Subject was impossible or difficult. - if any - • Records explaining why processing was done under
        this exemption.
    - urn: urn:intuitem:risk:req_node:ia-sat-ml-pdpl:6.2
      assessable: true
      depth: 2
      parent_urn: urn:intuitem:risk:req_node:ia-sat-ml-pdpl:root
      ref_id: '6.2'
      name: If the Processing is pursuant to another law or in implementation of a previo…
      description: 'If the Processing is pursuant to another law or in implementation of a previous agreement
        to which the Data Subject is a party.


        **Implementation guide**


        Maintain an inventory of processing activities that rely on this exemption, linking each to the
        specific law article or contract clause with the Data Subject. Ensure new or changed processing
        passes through a legal‑basis assessment step where “law or previous agreement” is selected only
        when supporting legal or contractual references are documented and, where needed, reviewed by
        Legal or Compliance.


        **Verification method**


        Verify that all processing activities marked as relying on “law or previous agreement” in your
        register include clear references to the relevant law articles or contract clauses. Sample a few
        activities and check that the described processing is actually covered by those legal or contractual
        provisions and that no consent is improperly used as the primary basis where this exemption is
        claimed.'
      typical_evidence: • Legal obligation inventory covering processing mandated or permitted by applicable
        laws or regulations. • Contract-based processing register with mapped provisions
    - urn: urn:intuitem:risk:req_node:ia-sat-ml-pdpl:6.3
      assessable: true
      depth: 2
      parent_urn: urn:intuitem:risk:req_node:ia-sat-ml-pdpl:root
      ref_id: '6.3'
      name: If the Controller is a Public Entity and the Processing is required for secur…
      description: 'If the Controller is a Public Entity and the Processing is required for security purposes
        or to satisfy judicial requirements.


        **Implementation guide**


        Maintain procedures for identifying processing activities that rely on this exemption and documenting
        the specific security or judicial requirement for each case. Ensure that such processing is reviewed
        and authorized through a defined internal approval path (e.g., senior management, Legal, or a
        designated authority) and that records of the justification and approvals are stored in the organization''s
        central legal‑basis or exemption register.


        **Verification method**


        Check that processing activities marked as relying on this public‑entity exemption have clear
        written justification referring to security or judicial requirements and evidence of appropriate
        internal authorization. Sample a set of these activities to confirm that the actual processing
        matches the documented justification and that consent is not requested where this exemption is
        used as the legal basis.'
      typical_evidence: • Security/judicial processing justification records • Public entity authorization
        (for example, internal approvals or official mandates) confirming that the Controller, as a Public
        Entity, may rely on this exemption.
    - urn: urn:intuitem:risk:req_node:ia-sat-ml-pdpl:6.4
      assessable: true
      depth: 2
      parent_urn: urn:intuitem:risk:req_node:ia-sat-ml-pdpl:root
      ref_id: '6.4'
      name: If the Processing is necessary for the purpose of legitimate interest of the…
      description: 'If the Processing is necessary for the purpose of legitimate interest of the Controller,
        without prejudice to the rights and interests of the Data Subject, and provided that no Sensitive
        Data is to be processed. Related provisions and controls are set out in the Regulations.


        **Implementation guide**


        Define and adopt a standard LIA process and template that must be completed before any processing
        relies on legitimate interest, including documenting the purpose, necessity, alternatives, and
        why consent is not used. For each LIA, perform and record a structured balancing test and Data
        Subject interest analysis, explicitly confirming that no Sensitive Data is processed and that
        safeguards (e.g., minimization, opt‑outs, transparency) are applied where needed.


        **Verification method**


        Review a sample of processing activities that rely on legitimate interest and confirm that a completed
        LIA, balancing test, and Data Subject interest analysis exist for each and that they explicitly
        exclude Sensitive Data. Check that the documented legitimate interest is specific, that the balancing
        test is reasonable, and that mitigating measures are implemented'
      typical_evidence: • Legitimate Interest Assessment (LIA) documenting the purpose, necessity, and
        why this basis is used instead of consent. • Balancing test documentation with samples (how the
        Controller’s interest was weighed against the Data Subject’s rights and interests.) • Data subject
        interest analysis
    - urn: urn:intuitem:risk:req_node:ia-sat-ml-pdpl:7
      assessable: true
      depth: 2
      parent_urn: urn:intuitem:risk:req_node:ia-sat-ml-pdpl:root
      ref_id: '7'
      name: The consent referred to in paragraph (1) of Article (5) of this Law may not f…
      description: 'The consent referred to in paragraph (1) of Article (5) of this Law may not form a
        condition of providing a service or a benefit, unless such service or benefit is directly related
        to the Processing of Personal Data for which the consent is given.


        **Implementation guide**


        Maintain an analysis of each service or benefit to identify which Processing activities are strictly
        necessary and which are optional or ancillary. Configure consent flows and forms so that consents
        related to non‑essential Processing (for example, marketing or analytics) are clearly unbundled
        from core service terms, and only mark consent as “required” where the service genuinely cannot
        be provided without that Processing


        **Verification method**


        Review service provision analysis and consent screens/contracts to confirm that optional Processing
        is not presented as mandatory and that separate choices are available for non‑essential Processing.
        Sample specific services where consent is marked as a condition and verify that the service or
        benefit cannot realistically be provided without that particular Processing, with supporting service
        dependency assessments'
      typical_evidence: • Service provision analysis showing which services/benefits can be delivered
        without the contested consent • Consent unbundling documentation demonstrating that non‑essential
        Processing consents are separated from core service terms • Service dependency assessment (when
        a service or benefit is directly dependent on the specific Processing for which consent is requested)
    - urn: urn:intuitem:risk:req_node:ia-sat-ml-pdpl:21
      assessable: true
      depth: 2
      parent_urn: urn:intuitem:risk:req_node:ia-sat-ml-pdpl:root
      ref_id: '21'
      name: The Controller shall respond to the requests of the Data Subject pertaining t…
      description: 'The Controller shall respond to the requests of the Data Subject pertaining to their
        rights under this Law within such period and in such method as set out in the Regulations


        **Implementation guide**


        Define formal SLAs and response methods for each type of Data Subject right request in line with
        the Regulations, and integrate them into procedures and workflows. Configure systems to log incoming
        requests, track handling steps and timestamps, and trigger escalation according to documented
        rules when deadlines are at risk.


        **Verification method**


        Review SLAs and procedures to confirm they match the timelines and methods required by the Regulations,
        then sample logs and reports to verify that actual responses meet these SLAs. Check that overdue
        or complex cases show evidence of escalation and resolution in line with the escalation procedure.'
      typical_evidence: • Request response SLAs • Response time tracking reports • Escalation procedure
        documentation
    - urn: urn:intuitem:risk:req_node:ia-sat-ml-pdpl:34
      assessable: true
      depth: 2
      parent_urn: urn:intuitem:risk:req_node:ia-sat-ml-pdpl:root
      ref_id: '34'
      name: A Data Subject may submit to the Competent Authority any complaint that may a…
      description: 'A Data Subject may submit to the Competent Authority any complaint that may arise
        out of the implementation of this Law and the Regulations. The Regulations shall set out the rules
        for processing the complaints that may arise from implementing this Law and the Regulations.


        **Implementation guide**


        Define and document procedures for receiving and managing complaints related to Personal Data
        Processing, including intake channels, evaluation steps, timeframes, and documentation requirements.
        Include clear steps on when to escalate matters internally and how to inform or assist Data Subjects
        in submitting complaints to the Competent Authority, and maintain a log that records the lifecycle
        of each complaint


        **Verification method**


        Review the complaint handling and escalation procedures to confirm they align with the Law and
        Regulations, including reference to the Competent Authority. Sample entries from the complaint
        log to verify that complaints are processed according to defined procedures, that outcomes are
        recorded, and that cases requiring escalation or guidance to the Competent Authority are handled
        and documented appropriately.'
      typical_evidence: • Complaint handling procedures • Escalation procedures • Complaint log capturing
        complaints, handling steps, outcomes, and any escalations
    - urn: urn:intuitem:risk:req_node:ia-sat-ml-pdpl:40
      assessable: true
      depth: 2
      parent_urn: urn:intuitem:risk:req_node:ia-sat-ml-pdpl:root
      ref_id: '40'
      name: Without prejudice to the penalties stated in this Law, any individual that su…
      description: 'Without prejudice to the penalties stated in this Law, any individual that suffers
        a damage as a result of any of the violations stated in this Law or the Regulations may apply
        to a competent court for proportionate compensation for the material or moral damage.


        **Implementation guide**


        Establish and maintain procedures for receiving, evaluating, and responding to damage claims related
        to Personal Data violations, including coordination between Legal, Risk, and relevant business
        units. Align damage assessment criteria with legal guidance and ensure any liability insurance
        or financial arrangements adequately cover potential compensation obligations arising from PDPL‑related
        cases.


        **Verification method**


        Review legal response procedures and damage assessment criteria to confirm they explicitly cover
        PDPL violations and court‑driven compensation claims. Sample past incidents or simulated scenarios
        (if no real cases exist) to verify that the organization can document damages, apply assessment
        criteria, and respond in line with procedures and any applicable insurance coverage.'
      typical_evidence: • Liability insurance policy • Legal response procedures for handling Data Subject
        damage claims • Damage assessment criteria describing how material and moral damages are evaluated
        and documented in the context of such claims.
    - urn: urn:intuitem:risk:req_node:ia-sat-ml-pdpl:9.1
      assessable: true
      depth: 2
      parent_urn: urn:intuitem:risk:req_node:ia-sat-ml-pdpl:root
      ref_id: '9.1'
      name: The Controller may set time frames for exercising the right to access Persona…
      description: 'The Controller may set time frames for exercising the right to access Personal Data
        stated in Paragraph (2) of Article (4) herein as stipulated in the Regulations. The Controller
        may limit the exercise of this right in the following cases: a) If this is necessary to protect
        the Data Subject or other parties from any harm, according to the provisions set forth the Regulations.
        b) If the Controller is a Public Entity and the restriction is required for security purposes,
        required by another law, or required to fulfill judicial requirements.


        **Implementation guide**


        Define an access limitation policy that sets time frames for responding to access requests and
        describes when and how access may be restricted under harm‑prevention or security/judicial grounds.
        Implement harm assessment procedures so that any restriction based on protecting the Data Subject
        or others is documented and approved, and ensure Public Entities record specific security, legal,
        or judicial reasons in justification records when restricting access.


        **Verification method**


        Review the access limitation policy and harm assessment procedures to confirm they align with
        the Law and Regulations and clearly reference this article and its sub‑cases. Sample access requests
        where access was delayed or restricted and verify that each has documented harm assessments or
        security/legal/judicial justifications, appropriate approvals, and that restrictions were no broader
        or longer than necessary.'
      typical_evidence: • Access limitation policy covering time frames and conditions for restricting
        access rights. • Harm assessment procedures for deciding when access must be limited to protect
        the Data Subject or others. • Security restriction justification records
    - urn: urn:intuitem:risk:req_node:ia-sat-ml-pdpl:9.2
      assessable: true
      depth: 2
      parent_urn: urn:intuitem:risk:req_node:ia-sat-ml-pdpl:root
      ref_id: '9.2'
      name: The Controller shall prevent the Data Subject from accessing Personal Data in…
      description: 'The Controller shall prevent the Data Subject from accessing Personal Data in any
        of the situations stated in Paragraphs (1, 2, 3, 4, 5) and (6) of Article (16) herein.


        **Implementation guide**


        Define clear procedures that map each Article (16) situation to concrete decision criteria and
        handling steps, including who can approve access prevention and how the decision is communicated
        to the Data Subject where appropriate. Require staff to record each prevention decision in a central
        log, referencing the applicable paragraph of Article (16), the justification, and the approver,
        and to review these decisions periodically for consistency.


        **Verification method**


        Review access prevention procedures to confirm they explicitly reference Paragraphs (1–6) of Article
        (16) and provide clear criteria for denial. Sample entries from the prevention decision log to
        verify that each denial is linked to a specific Article (16) paragraph, is properly justified
        and approved, and that preventions are not applied beyond the cases allowed by the Law.'
      typical_evidence: • Access prevention procedures describing when and how access must be denied under
        the situations listed in Article (16). • Prevention decision log with justifications
    - urn: urn:intuitem:risk:req_node:ia-sat-ml-pdpl:35.1
      assessable: true
      depth: 2
      parent_urn: urn:intuitem:risk:req_node:ia-sat-ml-pdpl:root
      ref_id: '35.1'
      name: Without prejudice to any harsher penalty stipulated in another law, any indiv…
      description: 'Without prejudice to any harsher penalty stipulated in another law, any individual
        discloses or publishes Sensitive Data, in violation of the provisions of the Law, with the intention
        of harming the Data Subject or achieving a personal benefit shall be punished with imprisonment
        for a period not exceeding (two years), or a fine not exceeding (three million) Riyals, or both.


        **Implementation guide**


        Maintain and enforce a Sensitive Data handling policy that clearly bans unauthorized disclosure
        or publication and references the legal penalties. Ensure employees acknowledge this policy and
        receive regular training, and operate technical and procedural controls (access management, monitoring,
        and incident response) that can detect and support investigation of suspected unlawful disclosures,
        including escalation to Legal and, where necessary, authorities.


        **Verification method**


        Review the Sensitive Data handling policy, training materials, and acknowledgment records to confirm
        penalties and legal consequences are communicated to staff. Sample Sensitive Data access logs
        and past incidents (if any) to verify that suspicious or unauthorized access is investigated under
        defined incident response procedures and that appropriate disciplinary/legal steps are taken where
        intentional harmful disclosure is identified.'
      typical_evidence: • Sensitive data handling policy defining rules for Processing, access, disclosure,
        and publication of Sensitive Data, including explicit prohibition of unlawful disclosure. • Employee
        acknowledgment of penalties • Incident response procedures covering investigation, containment,
        reporting, and disciplinary/legal follow‑up
    - urn: urn:intuitem:risk:req_node:ia-sat-ml-pdpl:35.2
      assessable: true
      depth: 2
      parent_urn: urn:intuitem:risk:req_node:ia-sat-ml-pdpl:root
      ref_id: '35.2'
      name: The Public Prosecution is responsible for investigating and prosecuting befor…
      description: 'The Public Prosecution is responsible for investigating and prosecuting before the
        competent court for the violation stipulated in Paragraph (1) of this Article.


        **Implementation guide**


        Establish a clear internal procedure that defines how potential criminal Sensitive Data disclosure
        cases are identified, assessed, and escalated to the Legal/Compliance function. Ensure the procedure
        states that, where the facts indicate a violation falling under Paragraph (1), Legal will consider
        engagement with the Public Prosecution and coordinate any required cooperation (evidence preservation,
        documentation, and responses). Integrate this step into the incident/breach management process
        so that high‑severity Sensitive Data incidents trigger an automatic check for possible criminal
        referral.


        **Verification method**


        Review the incident and legal‑coordination procedures to confirm they explicitly reference potential
        criminal Sensitive Data violations and the role of the Public Prosecution. Check a sample of high‑severity
        Sensitive Data incidents (if any) to verify that: escalation to Legal/Compliance is documented,
        decisions about referral to authorities are recorded, and evidence needed for potential investigation
        is preserved.'
      typical_evidence: • Legal coordination procedure describing how confirmed or suspected criminal‑level
        Sensitive Data violations are referred to/handled with the Public Prosecution through Legal/Compliance.
        • Incident records showing that, where required, cases were escalated to external authorities
        (without exposing details, just “regulatory/criminal referral made”).
    - urn: urn:intuitem:risk:req_node:ia-sat-ml-pdpl:35.3
      assessable: true
      depth: 2
      parent_urn: urn:intuitem:risk:req_node:ia-sat-ml-pdpl:root
      ref_id: '35.3'
      name: The competent court shall be in charge of lawsuits arising from the implement…
      description: 'The competent court shall be in charge of lawsuits arising from the implementation
        of this Article and issuing the prescribed penalties.


        **Implementation guide**


        Include in the legal/claims handling procedures a clear step for managing cases that proceed to
        the competent court under the PDPL (e.g., preserving evidence, coordinating representation, and
        tracking court outcomes). Align incident, claims, and legal workflows so that any PDPL‑related
        case that may reach court is properly documented and handed over to Legal for interaction with
        the competent court.


        **Verification method**


        Review legal procedures and case handling guidelines to confirm they recognize the possibility
        of PDPL‑related lawsuits before the competent court and describe how such cases are managed. Where
        any relevant cases exist, verify that documentation (case files, evidence bundles, court correspondence)
        is maintained and linked to the underlying incident/complaint records'
      typical_evidence: • Legal response procedures referencing court proceedings under the PDPL. • Case
        file documentation for any PDPL‑related court actions (if any).
    - urn: urn:intuitem:risk:req_node:ia-sat-ml-pdpl:35.4
      assessable: true
      depth: 2
      parent_urn: urn:intuitem:risk:req_node:ia-sat-ml-pdpl:root
      ref_id: '35.4'
      name: The competent court may double the fine penalty stipulated in Paragraph (1) o…
      description: 'The competent court may double the fine penalty stipulated in Paragraph (1) of this
        Article in the case of recidivism, even if it results in exceeding its maximum limit, provided
        that it does not exceed double this limit


        **Implementation guide**


        NA


        **Verification method**


        NA'
      typical_evidence: • No Evidence Required (mainly a judicial power)
    - urn: urn:intuitem:risk:req_node:ia-sat-ml-pdpl:36.1
      assessable: true
      depth: 2
      parent_urn: urn:intuitem:risk:req_node:ia-sat-ml-pdpl:root
      ref_id: '36.1'
      name: In cases that are not covered in Article (35) herein and without prejudice to…
      description: 'In cases that are not covered in Article (35) herein and without prejudice to any
        harsher penalty stipulated in another law, a warning or a fine not exceeding (five million) Riyals
        shall be imposed on every person with a special natural or legal capacity - covered by the provisions
        of the Law - who violates any of the provisions of the Law or the Regulations. The fine penalty
        may be doubled in the event of a repeat violation, even if it results in exceeding its maximum
        limit, provided that it does not exceed double this limit.


        **Implementation guide**


        NA


        **Verification method**


        NA'
      typical_evidence: • No Evidence Required (mainly a judicial power)
    - urn: urn:intuitem:risk:req_node:ia-sat-ml-pdpl:36.2
      assessable: true
      depth: 2
      parent_urn: urn:intuitem:risk:req_node:ia-sat-ml-pdpl:root
      ref_id: '36.2'
      name: A committee (or more) shall be formed by a decision of the president of the C…
      description: 'A committee (or more) shall be formed by a decision of the president of the Competent
        Authority. The number of its members shall not be less than (three), and one of them shall be
        appointed as the committee head, and there shall be a technical specialist and a legal advisor
        among them. The committee is to examine violations and issue warnings or impose fines as stipulated
        in Paragraph (1) of this Article, considering the type of violation committed, its seriousness
        and the extent of its impact; provided that the decision of the committee is approved by the president
        of the Competent Authority or whomever they delegate. The president of the Competent Authority
        shall issue, by their decision, the rules of work of the committee, and the remunerations of its
        members shall be determined therein.


        **Implementation guide**


        Define a process for receiving and managing communications, warnings, and fines from the Competent
        Authority’s committee, assigning clear internal ownership (e.g., DPO/Privacy Office, Legal, Compliance).
        Ensure that each enforcement decision is logged, analyzed for root causes, and translated into
        remediation, control enhancements, and, where needed, internal disciplinary measures, taking into
        account the seriousness and impact highlighted by the committee.


        **Verification method**


        Review regulatory interaction and enforcement‑handling procedures to confirm they cover decisions
        issued by the Competent Authority’s committee under this article. Check a sample of any available
        enforcement actions (warnings, fines) to verify that such decisions are logged, escalated to appropriate
        governance bodies, and that corresponding corrective actions and control improvements are documented
        and tracked to closure.'
      typical_evidence: • Regulatory interaction procedures describing how your organization responds
        to investigations, warnings, or fines issued by the committee under this article.
    - urn: urn:intuitem:risk:req_node:ia-sat-ml-pdpl:36.3
      assessable: true
      depth: 2
      parent_urn: urn:intuitem:risk:req_node:ia-sat-ml-pdpl:root
      ref_id: '36.3'
      name: Anyone against whom a decision has been issued by the committee mentioned in…
      description: 'Anyone against whom a decision has been issued by the committee mentioned in Paragraph
        (2) of this Article has the right to appeal against them before the competent court.


        **Implementation guide**


        Define in your legal and regulatory‑interaction procedures how enforcement decisions from the
        committee are reviewed (e.g., by Legal, Compliance, senior management) and under what criteria
        an appeal will be considered. Where a decision is to be appealed, ensure responsibilities are
        clear for preparing the appeal, preserving evidence, managing deadlines, and coordinating representation
        before the competent court.


        **Verification method**


        Review legal procedures to confirm they explicitly cover the possibility of appealing committee
        decisions to the competent court.'
      typical_evidence: • Legal appeal procedures describing how the organization evaluates decisions
        issued by the committee and, where appropriate, files appeals before the competent court.
    - urn: urn:intuitem:risk:req_node:ia-sat-ml-pdpl:39
      assessable: true
      depth: 2
      parent_urn: urn:intuitem:risk:req_node:ia-sat-ml-pdpl:root
      ref_id: '39'
      name: Without prejudice to the provisions of Article (35) and Paragraph (1) of Arti…
      description: 'Without prejudice to the provisions of Article (35) and Paragraph (1) of Article (36)
        of this Law, the Public Entity shall discipline any of its employees who violate any of the provisions
        of this Law and Regulations, in accordance with the disciplinary provisions and procedures prescribed
        by law


        **Implementation guide**


        Update the organization’s data‑sharing and cooperation procedures with public entities so that
        any sharing of customer/claims data with ministries, regulators, or government schemes is governed
        by written agreements or MoUs that clearly state each public entity is responsible for disciplining
        its own employees under PDPL. Enforces strong access controls, least‑privilege, NDAs, and detailed
        logging on all disclosures to public‑entity staff, so it can demonstrate it did not enable or
        ignore misuse of personal data by those employees.


        **Verification method**


        Sample and check that MoUs, procedures, logs, and training records are present, current, and consistently
        applied in a few real public‑entity data‑sharing cases.'
      typical_evidence: • Signed MoUs/data‑sharing agreements with public entities including PDPL compliance/accountability
        clauses. • A documented procedure for handling data requests from public entities (validation,
        approval, logging, minimum‑necessary). • One awareness slide/email to legal/compliance/business
        owners explaining roles when sharing data with public entities.
    - urn: urn:intuitem:risk:req_node:ia-sat-ml-pdpl:41
      assessable: true
      depth: 2
      parent_urn: urn:intuitem:risk:req_node:ia-sat-ml-pdpl:root
      ref_id: '41'
      name: Any person that engages in the Processing of Personal Data shall protect the…
      description: 'Any person that engages in the Processing of Personal Data shall protect the confidentiality
        of the Personal Data even after the end of such person’s occupational or contractual relationship.


        **Implementation guide**


        Integrate PDPL obligations and violations into the organization’s HR and disciplinary framework,
        classifying PDPL breaches as specific forms of misconduct. Align Privacy/Legal, Compliance, and
        HR so that confirmed PDPL violations by employees are referred to HR for disciplinary action consistent
        with the public‑sector disciplinary rules, and ensure outcomes are documented. Make sure employees
        are fully aware of the confedentiality clauses thorugh their contracts and signed NDAs


        **Verification method**


        Review HR/disciplinary policies to confirm they explicitly cover PDPL violations and reference
        the applicable disciplinary framework for public employees and verify sample contracts or NDAs
        to check if they clearly state the confedentiality clauses.'
      typical_evidence: • Sample post-employment confidentiality clauses in contracts/NDAs • Disciplinary
        policy referencing PDPL violations as misconduct.
    - urn: urn:intuitem:risk:req_node:ia-sat-ml-pdpl:42
      assessable: true
      depth: 2
      parent_urn: urn:intuitem:risk:req_node:ia-sat-ml-pdpl:root
      ref_id: '42'
      name: The president of the Competent Authority shall issue the Regulations within a…
      description: 'The president of the Competent Authority shall issue the Regulations within a period
        not exceeding (seven hundred and twenty) days commencing on the date of publishing the Law provided
        that the president must coordinate before issuing the Law with: (Ministry of Communications and
        Information Technology, Ministry of Foreign Affairs, Communications, Space & Technology Commission,
        Digital Government Authority, National Cybersecurity Authority, Saudi Health Council, and Saudi
        Central Bank), each in its own jurisdiction


        **Implementation guide**


        Track, analyze, and implement changes from PDPL Regulations and related sector authorities.


        **Verification method**


        Review regulatory monitoring and compliance proceduresto ensure they mandate the tracking, analyzing
        and implement the required changes form the regulator'
      typical_evidence: • Regulatory monitoring and compliance
    - urn: urn:intuitem:risk:req_node:ia-sat-ml-pdpl:33.1
      assessable: true
      depth: 2
      parent_urn: urn:intuitem:risk:req_node:ia-sat-ml-pdpl:root
      ref_id: '33.1'
      name: The Competent Authority shall set the requirements for practicing commercial,…
      description: 'The Competent Authority shall set the requirements for practicing commercial, professional
        or non-profit activities related to Personal Data protection in the Kingdom, in coordination with
        the competent authorities, and without prejudice to the other requirements set by those authorities
        in their domain of competence.


        **Implementation guide**


        Maintain a register of applicable regulatory requirements for privacy‑related activities your
        organization conducts (for example, acting as a service provider, processor, or offering privacy
        services), including any licenses, registrations, or competency criteria defined by the Competent
        Authority and sector regulators. Assign responsibility (e.g., Legal/Compliance or Privacy Office)
        to monitor updates to these requirements and to verify that relevant business lines (consulting,
        SaaS, processing services, etc.) meet and maintain them.


        **Verification method**


        Confirm that all relevant activities are covered and mapped to the applicable requirements issued
        by the Competent Authority and sector bodies.'
      typical_evidence: • Compliance procedures showing how the organization ensures it meets any such
        practice requirements.
    - urn: urn:intuitem:risk:req_node:ia-sat-ml-pdpl:33.2
      assessable: true
      depth: 2
      parent_urn: urn:intuitem:risk:req_node:ia-sat-ml-pdpl:root
      ref_id: '33.2'
      name: The Competent Authority may grant licenses to entities that issue accreditati…
      description: 'The Competent Authority may grant licenses to entities that issue accreditation certificates
        to Controllers and Processors. The Competent Authority shall set the rules to regulate the issuance
        of such certificates.


        **Implementation guide**


        Maintain a list of all PDPL‑relevant accreditations or certifications that the organization holds
        as a Controller/Processor, or that the organizaiton require from third‑party Processors and service
        providers. For each certificate, document the issuing body and confirm (via public information
        or guidance) that it is licensed or recognized under the Competent Authority’s rules once such
        schemes are active, and factor this into vendor onboarding and periodic review.


        **Verification method**


        Review the certification/accreditation register to ensure each listed certificate is current and
        mapped to its issuing body. For a sample of certificates, verify that the issuing entity is licensed
        or recognized under the Competent Authority’s scheme (where such licensing exists) and that your
        due‑diligence procedure requires re‑checking this status during renewals or vendor re‑assessments.'
      typical_evidence: • Certification/accreditation register for Controllers/Processors.(if any)
    - urn: urn:intuitem:risk:req_node:ia-sat-ml-pdpl:33.3
      assessable: true
      depth: 2
      parent_urn: urn:intuitem:risk:req_node:ia-sat-ml-pdpl:root
      ref_id: '33.3'
      name: The Competent Authority may grant licenses to entities that conduct audits or…
      description: 'The Competent Authority may grant licenses to entities that conduct audits or checks
        of Personal Data Processing activities related to the Controller’s activity, in accordance with
        the provisions stipulated in the Regulations. The Competent Authority shall set the conditions
        and criteria to grant such licenses, and the rules regulating them.


        **Implementation guide**


        Identify which audits/checks of Personal Data Processing are ourtsourced (e.g., privacy audits,
        PDPL readiness reviews, Processor assessments) and maintain a register of the providers performing
        them. For each such provider, perform due diligence to confirm that, where the Competent Authority
        operates a licensing regime, the provider holds the appropriate license or meets the Authority’s
        specified conditions and criteria, and embed this check into the organization''s vendor onboarding
        and periodic re‑assessment.


        **Verification method**


        Review the register of PDPL‑related audit providers and confirm that each entry includes information
        on licensing/authorization or documented rationale where licensing is not yet applicable. Sample
        one or two engagements to verify that before contracting, the orgaization has assessed the provider
        against the Competent Authority’s conditions and criteria (once defined) and that this due diligence
        is periodically revisited for renewals.'
      typical_evidence: • Register of external audit/assessment providers used for PDPL‑related Processing
        checks, indicating their licensing/authorization status where such a regime exists. •Due‑diligence
        procedure for engaging PDPL audit/check providers.
    - urn: urn:intuitem:risk:req_node:ia-sat-ml-pdpl:33.4
      assessable: true
      depth: 2
      parent_urn: urn:intuitem:risk:req_node:ia-sat-ml-pdpl:root
      ref_id: '33.4'
      name: The Competent Authority shall specify the appropriate tools and mechanisms to…
      description: 'The Competent Authority shall specify the appropriate tools and mechanisms to monitor
        compliance of Controllers and Processors outside the Kingdom in regard with their obligations
        as stated in the Law and the Regulations when Processing personal data related to individuals
        residing in the Kingdom by any means, and shall define procedures to enforce the provisions of
        the Law and the Regulations outside the Kingdom.


        **Implementation guide**


        1. Identify all processors outside KSA handling data of KSA residents. 2. Embed PDPL compliance
        obligations in contracts and implement monitoring mechanisms to verify adherence.


        **Verification method**


        Review foreign processor register and contract compliance clauses'
      typical_evidence: • Foreign processor compliance clauses in contracts. • Cross-border processing
        register • Extraterritorial compliance assessment
    - urn: urn:intuitem:risk:req_node:ia-sat-ml-pdpl:37.1
      assessable: true
      depth: 2
      parent_urn: urn:intuitem:risk:req_node:ia-sat-ml-pdpl:root
      ref_id: '37.1'
      name: Employees and workers appointed by a decision of the president of the Compete…
      description: 'Employees and workers appointed by a decision of the president of the Competent Authority
        shall have the powers to control and inspect the violations stated in this Law or the Regulations.
        The president of the Competent Authority shall issue the rules and procedures in regard to the
        work of those employees and workers in accordance with the applicable laws.


        **Implementation guide**


        1. Establish inspection readiness procedures including document accessibility, designated contact
        persons, and cooperation protocols. 2. Conduct periodic readiness reviews.


        **Verification method**


        Review inspection readiness procedure'
      typical_evidence: • Inspection readiness procedures • Inspector cooperation protocols • Documentation
        accessibility plan
    - urn: urn:intuitem:risk:req_node:ia-sat-ml-pdpl:37.2
      assessable: true
      depth: 2
      parent_urn: urn:intuitem:risk:req_node:ia-sat-ml-pdpl:root
      ref_id: '37.2'
      name: The employees and workers referred to in Paragraph (1) of this Article may se…
      description: 'The employees and workers referred to in Paragraph (1) of this Article may seek assistance
        from criminal investigations authorities or other competent authorities to carry out their duties
        concerning control and inspection of violations stipulated in the Law or Regulations


        **Implementation guide**


        Establish a documented procedure for responding to PDPL matters escalated to criminal investigation
        authorities, including internal escalation,and evidence preservation protocols


        **Verification method**


        Review investigation cooperation procedures'
      typical_evidence: • Criminal investigation cooperation procedures
    - urn: urn:intuitem:risk:req_node:ia-sat-ml-pdpl:37.3
      assessable: true
      depth: 2
      parent_urn: urn:intuitem:risk:req_node:ia-sat-ml-pdpl:root
      ref_id: '37.3'
      name: The Competent Authority has the right to seize the means or tools used in com…
      description: 'The Competent Authority has the right to seize the means or tools used in committing
        the violation until a decision is made on it.


        **Implementation guide**


        define clear requirements in the incident‑response procedures for handling formal requests or
        orders from the Competent Authority, including identification/ isolation/ seizing of means/tools
        allegedly used in violations and preservation of their data and logs.


        **Verification method**


        Review documentation to confirm that Authority investigations and possible seizure of systems
        are explicitly addressed, with responsibilities and steps clearly defined. continuity plans for
        explicit coverage of seizure scenarios'
      typical_evidence: • governance or incident‑response procedure
    - urn: urn:intuitem:risk:req_node:ia-sat-ml-pdpl:38.1
      assessable: true
      depth: 2
      parent_urn: urn:intuitem:risk:req_node:ia-sat-ml-pdpl:root
      ref_id: '38.1'
      name: Without prejudice to the rights of bona fide third parties, the competent cou…
      description: 'Without prejudice to the rights of bona fide third parties, the competent court may
        order the confiscation of funds obtained as a result of committing the violations stipulated in
        the Law


        **Implementation guide**


        Align PDPL incident‑response with financial controls so that when a serious violation is identified,
        the entity can trace revenues or savings obtained from the unlawful processing and support court‑ordered
        confiscation while respecting bona fide third‑party rights. Update training for senior management,
        finance, and compliance to cover potential confiscation outcomes and the need to document financial
        flows related to unlawful processing.


        **Verification method**


        1. Review PDPL and compliance documentation to confirm that potential financial sanctions, including
        confiscation of funds obtained through violations, are recognised and linked to clear responsibilities
        and processes. 2. Check whether finance and compliance have mechanisms to identify and document
        revenues, cost savings, or other benefits arising from non‑compliant Personal Data Processing
        that might be subject to confiscation.'
      typical_evidence: • policy sanctions or legal/compliance guideline explaining potential court‑ordered
        confiscation of funds derived from violations and how the entity cooperates with such decisions.
    - urn: urn:intuitem:risk:req_node:ia-sat-ml-pdpl:38.2
      assessable: true
      depth: 2
      parent_urn: urn:intuitem:risk:req_node:ia-sat-ml-pdpl:root
      ref_id: '38.2'
      name: The competent court, or the committee referred to in paragraph (2) of Article…
      description: 'The competent court, or the committee referred to in paragraph (2) of Article (36),
        as the case may be, may include in their penalty judgment or decision a provision that a summary
        of such judgment or decision shall be published at the expense of the violator in one (or more)
        local newspapers distributed in their area of residence, or using any other proper means. This
        is based on the type, seriousness and impact of the violation; provided that the publishing shall
        be after the judgment becomes final, the lapse of the deadline for appeals, or the issuance of
        a final ruling dismissing the appeal against the judgement.


        **Implementation guide**


        1. Integrate this sanction into PDPL and enterprise risk management, ensuring legal/compliance
        track enforcement actions and trigger communications and remediation plans when a judgment may
        be published. 2. Define a process in incident and crisis communication plans for handling court‑ordered
        publication, including reviewing the summary for accuracy (where permitted), preparing public
        statements, and informing customers, partners, and staff as appropriate.


        **Verification method**


        1. Review PDPL governance and crisis communication documents to confirm they explicitly address
        potential publication of final judgments or decisions and assign responsibilities for handling
        such events. 2. Interview legal, compliance, and communications teams to verify awareness of this
        sanction and check whether they have coordinated plans for public notices, customer queries, and
        remediation messaging.'
      typical_evidence: • PDPL governance or compliance policy acknowledging possible publication of final
        judgments/decisions and outlining how the entity manages regulatory and court‑ordered public disclosure
        of violations. • Crisis communication and reputational‑risk playbook
    - urn: urn:intuitem:risk:req_node:ia-sat-ml-pdpl:24
      assessable: true
      depth: 2
      parent_urn: urn:intuitem:risk:req_node:ia-sat-ml-pdpl:root
      ref_id: '24'
      name: Without prejudice to this Law, the Regulations shall set out additional contr…
      description: 'Without prejudice to this Law, the Regulations shall set out additional controls and
        procedures for the Processing of Credit Data in a manner that ensures the privacy of the Data
        Subject and protects their rights under this Law and the Credit Information Law. Such controls
        and procedures shall include the following:


        **Implementation guide**


        Identify and explicitly flag all processing activities where Credit Data is involved, define a
        Credit Data–specific handling procedure or policy that sets stricter rules for purposes, sharing,
        retention, and access, and ensure these rules are reflected in business processes, systems, and
        contracts with credit bureaus or other credit information providers.


        **Verification method**


        Verify that the organization can clearly point to which processing activities involve Credit Data
        and that these are covered by a Credit Data–specific policy or procedure referencing PDPL.'
      typical_evidence: • Register of Credit Data use cases (if any) • Policy/procedure for handling Credit
        Data in line with PDPL and Credit Information Law.
    - urn: urn:intuitem:risk:req_node:ia-sat-ml-pdpl:24.1
      assessable: true
      depth: 2
      parent_urn: urn:intuitem:risk:req_node:ia-sat-ml-pdpl:root
      ref_id: '24.1'
      name: Implementing appropriate measures to verify that the Data Subject has given t…
      description: 'Implementing appropriate measures to verify that the Data Subject has given their
        explicit consent to the Collection of the Personal Data, changing the purpose of the Collection,
        or Disclosure or Publishing of the Personal Data in accordance with the provisions of this Law
        and the Credit Information Law.


        **Implementation guide**


        Define explicit consent criteria (clear, specific, unambiguous statement and an affirmative action)
        and specify which processing activities require it: collection of certain data, purpose change,
        disclosure, and publishing, especially for Credit Data. Implement consent‑capture and verification
        mechanisms across all channels that authenticate the Data Subject, log consent details (who, when,
        what purpose, which data, channel), and prevent processing until explicit consent is confirmed.


        **Verification method**


        Review policies and consent flows to confirm explicit‑consent requirements are defined for collection,
        purpose change, disclosure, and publishing.'
      typical_evidence: '• Explicit consent requirements and verification mechanisms for: initial collection,
        change of purpose, disclosure, and publishing of Personal Data, specifically referencing PDPL
        and the Credit Information Law. • Samples of consent records • Purpose change documentation'
    - urn: urn:intuitem:risk:req_node:ia-sat-ml-pdpl:24.2
      assessable: true
      depth: 2
      parent_urn: urn:intuitem:risk:req_node:ia-sat-ml-pdpl:root
      ref_id: '24.2'
      name: Requiring that the Data Subject be notified when a request for Disclosure of…
      description: 'Requiring that the Data Subject be notified when a request for Disclosure of their
        Credit Data is received from any entity.


        **Implementation guide**


        define a clear process for data subjects notification, Implement automated notification system
        for credit data disclosure requests with delivery confirmation.


        **Verification method**


        Review notification procedure/ policy and delivery records'
      typical_evidence: • Documented procedure or policy stating that Data Subjects will be notified whenever
        any entity submits a request to disclose their Credit Data, including timing, channel, and minimum
        content of the notice. • Notification templates and sample records • Notification delivery confirmation
    - urn: urn:intuitem:risk:req_node:ia-sat-ml-pdpl:27
      assessable: true
      depth: 2
      parent_urn: urn:intuitem:risk:req_node:ia-sat-ml-pdpl:root
      ref_id: '27'
      name: Personal data may be collected or processed for scientific, research, or stat…
      description: 'Personal data may be collected or processed for scientific, research, or statistical
        purposes without the consent of the Data Subject in the following situations: The Regulations
        shall set out the controls required by the provisions of this Article.


        **Implementation guide**


        Define clear rules for research/statistical Processing that specify the limited situations where
        consent is not required under PDPL, require documented assessment against these conditions (e.g.,
        anonymisation, minimal risk, safeguards), and mandate formal approval before data is used without
        consent.


        **Verification method**


        Review research processing policy for coverage of all PDPL-permitted conditions'
      typical_evidence: • Research data processing policy
    - urn: urn:intuitem:risk:req_node:ia-sat-ml-pdpl:27.1
      assessable: true
      depth: 2
      parent_urn: urn:intuitem:risk:req_node:ia-sat-ml-pdpl:root
      ref_id: '27.1'
      name: If it does not specifically identify the Data Subject.
      description: 'If it does not specifically identify the Data Subject.


        **Implementation guide**


        Require teams to de‑identify or aggregate Personal Data so that individuals cannot be specifically
        identified before using it for research or statistics without consent, and document the techniques
        used (e.g., anonymisation, pseudonym removal, aggregation levels).


        **Verification method**


        Review anonymization procedures to validate that the process aggregated personal data so that
        individuals cannot be identified, ensure its being implemted by testing the samples obtained'
      typical_evidence: • Anonymization procedures • Sample dataset or project documentation evidencing
        de‑identification measures
    - urn: urn:intuitem:risk:req_node:ia-sat-ml-pdpl:27.2
      assessable: true
      depth: 2
      parent_urn: urn:intuitem:risk:req_node:ia-sat-ml-pdpl:root
      ref_id: '27.2'
      name: If evidence of the Data Subject’s identity will be destroyed during the Proce…
      description: 'If evidence of the Data Subject’s identity will be destroyed during the Processing
        and prior to Disclosure of such data to any other entity, if it is not Sensitive Data.


        **Implementation guide**


        Require any research/statistical use of non‑sensitive Personal Data without consent to include
        a documented de‑identification step that destroys all evidence of the Data Subject’s identity
        before any Disclosure, and ensure this step is embedded in standard data‑processing workflows
        and approvals.


        **Verification method**


        Review policies and a sample of research/statistical projects to confirm that identity‑destroying
        de‑identification occurs before Disclosure and that resulting datasets no longer allow specific
        Data Subjects to be identified'
      typical_evidence: • Policy or procedure for research/statistical Processing stating that, where
        non‑sensitive Personal Data is used without consent, all evidence of the Data Subject’s identity
        is destroyed during Processing and before Disclosure to any other entity. • Technical or process
        records showing identifiers are destroyed before disclosure (e.g., logs, job configs, data‑export
        specs). • Sample anonymization tests or validation reports
    - urn: urn:intuitem:risk:req_node:ia-sat-ml-pdpl:27.3
      assessable: true
      depth: 2
      parent_urn: urn:intuitem:risk:req_node:ia-sat-ml-pdpl:root
      ref_id: '27.3'
      name: If personal data is collected or processed for these purposes is required by…
      description: 'If personal data is collected or processed for these purposes is required by another
        law or in implementation of a previous agreement to which the Data Subject is a party.


        **Implementation guide**


        Require teams to document the exact legal provision or prior agreement clause whenever they rely
        on this basis, and only allow research/statistical Processing without consent if it is clearly
        mandated by that law or agreement and recorded in the project approval.


        **Verification method**


        review related policy / procedure to confirm the mandate, check sample projects to confirm that
        each use of this basis cites a concrete law or agreement clause and that Processing matches what
        is required'
      typical_evidence: •Policy or procedure stating that Personal Data may be used for scientific, research,
        or statistical purposes without consent when such Processing is explicitly required by another
        law or by a prior agreement with the Data Subject. • Research/statistics legal basis register
        indicating which projects rely on “other law or previous agreement” instead of consent.
    - urn: urn:intuitem:risk:req_node:ia-sat-ml-pdpl:28
      assessable: true
      depth: 2
      parent_urn: urn:intuitem:risk:req_node:ia-sat-ml-pdpl:root
      ref_id: '28'
      name: It is not permissible to copy official documents where Data Subjects are iden…
      description: 'It is not permissible to copy official documents where Data Subjects are identifiable,
        except where it is required by law, or when a competent public authority requests copying such
        documents pursuant to the Regulations.


        **Implementation guide**


        Configure procedures so staff may only copy official documents with identifiable Data Subjects
        when there is a clear legal requirement or a documented request from a competent public authority,
        and require recording of the justification and request reference for each copying action.


        **Verification method**


        Review policies and a sample of copied official‑document cases to confirm each has a recorded
        legal requirement or formal authority request'
      typical_evidence: • Policy or procedure stating that copying official documents containing identifiable
        Data Subjects is prohibited, except when required by law or upon a request from a competent public
        authority as defined in the Regulations. • Copying restriction controls • Sample records (e.g.,
        log, ticket, or request file)
    - urn: urn:intuitem:risk:req_node:ia-sat-ml-pdpl:10
      assessable: true
      depth: 2
      parent_urn: urn:intuitem:risk:req_node:ia-sat-ml-pdpl:root
      ref_id: '10'
      name: The Controller may only collect Personal Data directly from the Data Subject…
      description: 'The Controller may only collect Personal Data directly from the Data Subject and may
        only process Personal Data for the purposes for which they have been collected. However, the Controller
        may collect Personal Data from a source other that the Data Subject and may process Personal Data
        for purposes other than the ones for which they have been collected in the following situations:
        The Regulations shall set out the provisions, controls and procedures related to what is stated
        in paragraphs (2) to (7) of this Article.


        **Implementation guide**


        Establish a policy that sets the default rule of direct collection from the Data Subject and strict
        purpose limitation, and explicitly references that any indirect collection or change of purpose
        is only allowed under the specific situations listed in this Article and detailed in the Regulations.
        Embed this into processing design and approval process (e.g., RoPA/DPIA or new‑process onboarding),
        so that each activity records its data source and purposes, and any reliance on paragraphs (2)–(7)
        is clearly flagged and justified, then controlled through the relevant sub‑controls.


        **Verification method**


        Review policies and design/approval procedures to confirm they set direct collection and purpose
        limitation as the default and route any exceptions through checks based on paragraphs (2)–(7).
        Sample processing activities from RoPA and verify that, where data is collected from third parties
        or used for new purposes, there is clear documentation tying those activities to a valid exception
        sub‑control'
      typical_evidence: '•Data collection and purpose‑limitation policy (stating default: collect from
        Data Subject, use only for original purposes; and referring to exceptions in this Article).'
    - urn: urn:intuitem:risk:req_node:ia-sat-ml-pdpl:10.1
      assessable: true
      depth: 2
      parent_urn: urn:intuitem:risk:req_node:ia-sat-ml-pdpl:root
      ref_id: '10.1'
      name: The Data Subject gives their consent in accordance with the provisions of thi…
      description: 'The Data Subject gives their consent in accordance with the provisions of this Law.


        **Implementation guide**


        Ensure that whenever data is collected from a third‑party source or want to use existing data
        for a new purpose, the organization must have a consent flow that clearly explains this and captures
        the Data Subject’s agreement in line with PDPL conditions (including explicit consent where required).
        Configure systems and RoPA so that such processing activities are tagged as “based on consent
        for indirect collection / new purpose,” with consent records stored and linked to the relevant
        processing.


        **Verification method**


        Sample processing activities where data is obtained from other sources or used for new purposes
        and verify that valid consent records exist and match the described source/purpose. Check that
        consent language clearly informed Data Subjects about indirect collection and/or additional purposes
        and that processing does not go beyond what was consented to'
      typical_evidence: • Consent records showing that the Data Subject consented to indirect collection
        and/or new purposes.
    - urn: urn:intuitem:risk:req_node:ia-sat-ml-pdpl:10.2
      assessable: true
      depth: 2
      parent_urn: urn:intuitem:risk:req_node:ia-sat-ml-pdpl:root
      ref_id: '10.2'
      name: Personal Data is publicly available or was collected from a publicly availabl…
      description: 'Personal Data is publicly available or was collected from a publicly available source.


        **Implementation guide**


        Document criteria for determining public availability and verify source legitimacy before collection.


        **Verification method**


        Review public source documentation and verification records'
      typical_evidence: • Public source documentation • Source verification records
    - urn: urn:intuitem:risk:req_node:ia-sat-ml-pdpl:10.3
      assessable: true
      depth: 2
      parent_urn: urn:intuitem:risk:req_node:ia-sat-ml-pdpl:root
      ref_id: '10.3'
      name: The Controller is a Public Entity, and the Collection or Processing of the Pe…
      description: 'The Controller is a Public Entity, and the Collection or Processing of the Personal
        Data is required for public interest or security purposes, or to implement another law, or to
        fulfill judicial requirements.


        **Implementation guide**


        Document public interest, security, or legal/judicial requirements for indirect collection with
        appropriate authorizations.


        **Verification method**


        Review public entity exception documentation'
      typical_evidence: • Public interest or security justification records • Legal/judicial requirement
        records - if any -
    - urn: urn:intuitem:risk:req_node:ia-sat-ml-pdpl:10.4
      assessable: true
      depth: 2
      parent_urn: urn:intuitem:risk:req_node:ia-sat-ml-pdpl:root
      ref_id: '10.4'
      name: Complying with this may harm the Data Subject or affect their vital interests
      description: 'Complying with this may harm the Data Subject or affect their vital interests


        **Implementation guide**


        Document assessments where direct collection would harm data subject, with vital interest analysis.


        **Verification method**


        Review harm prevention and vital interest assessments'
      typical_evidence: • Harm prevention assessment records • Vital interest assessment • Alternative
        method analysis
    - urn: urn:intuitem:risk:req_node:ia-sat-ml-pdpl:10.5
      assessable: true
      depth: 2
      parent_urn: urn:intuitem:risk:req_node:ia-sat-ml-pdpl:root
      ref_id: '10.5'
      name: Personal Data Collection or Processing is necessary to protect public health,…
      description: 'Personal Data Collection or Processing is necessary to protect public health, public
        safety, or to protect the life or health of specific individuals.


        **Implementation guide**


        Document public health, safety, or life protection requirements for indirect collection with necessity
        assessments. Conduct and record a necessity assessment confirming no less intrusive alternative
        was available


        **Verification method**


        Review emergency/safety processing documentation and make sure nessesary assessments were conducted.'
      typical_evidence: • Public health/safety necessity assessment • Emergency processing records
    - urn: urn:intuitem:risk:req_node:ia-sat-ml-pdpl:10.6
      assessable: true
      depth: 2
      parent_urn: urn:intuitem:risk:req_node:ia-sat-ml-pdpl:root
      ref_id: '10.6'
      name: Personal Data is not to be recorded or stored in a form that makes it possibl…
      description: 'Personal Data is not to be recorded or stored in a form that makes it possible to
        directly or indirectly identify the Data Subject.


        **Implementation guide**


        Define a policy / procedure that clearliny defines personal data storage requirements, and make
        sure anonymization is applied before storage where this exception is invoked. Implement technical
        controls preventing re-identification and document storage format standards confirming no direct
        or indirect identification is possible.


        **Verification method**


        verify that there is an approved policy / procedure that defines personal data storage requiremts
        as mentioned in the control and verify anonymization effectiveness'
      typical_evidence: • data handeling policy / procedure • Anonymization procedures • Storage format
        documentation • Re-identification prevention controls
    - urn: urn:intuitem:risk:req_node:ia-sat-ml-pdpl:10.7
      assessable: true
      depth: 2
      parent_urn: urn:intuitem:risk:req_node:ia-sat-ml-pdpl:root
      ref_id: '10.7'
      name: Personal Data Collection is necessary to achieve legitimate interests of the…
      description: 'Personal Data Collection is necessary to achieve legitimate interests of the Controller,
        without prejudice to the rights and interests of the Data Subject, and provided that no Sensitive
        Data is to be processed.


        **Implementation guide**


        Define a personal data collection policy that clearly defines these requirements, Conduct LIA
        for indirect collection based on legitimate interest, ensuring sensitive data exclusion and rights
        protection.


        **Verification method**


        Review Legitimate Interest Assessment (LIA) and policy statement'
      typical_evidence: • Personal data collection policy • Legitimate Interest Assessment (LIA) for indirect
        collection • Sensitive data exclusion verification
    - urn: urn:intuitem:risk:req_node:ia-sat-ml-pdpl:11.1
      assessable: true
      depth: 2
      parent_urn: urn:intuitem:risk:req_node:ia-sat-ml-pdpl:root
      ref_id: '11.1'
      name: The purpose for which Personal Data is collected shall be directly related to…
      description: 'The purpose for which Personal Data is collected shall be directly related to the
        Controller’s purposes, and shall not contravene any legal provisions.


        **Implementation guide**


        Document clear relationship between collection purposes and organizational activities with legal
        compliance verification and maintain a purpose register reviewed for currency.


        **Verification method**


        Review purpose specification register'
      typical_evidence: • Purpose specification documentation • Business purpose mapping with legal compliance
        verification
    - urn: urn:intuitem:risk:req_node:ia-sat-ml-pdpl:11.2
      assessable: true
      depth: 2
      parent_urn: urn:intuitem:risk:req_node:ia-sat-ml-pdpl:root
      ref_id: '11.2'
      name: The methods and means of Personal Data Collection shall not conflict with any…
      description: 'The methods and means of Personal Data Collection shall not conflict with any legal
        provisions, shall be appropriate for the circumstances of the Data Subject, shall be direct, clear
        and secure, and shall not involve any deception, misleading or extortion.


        **Implementation guide**


        Implement transparent, secure collection policy / procedure that is appropriate to data subject
        circumstances without deceptive misleading, or coercive collection practices.


        **Verification method**


        Review collection method documentation'
      typical_evidence: • personal data colloction policy / procedure • Security controls for collection
        • Transparency verification
    - urn: urn:intuitem:risk:req_node:ia-sat-ml-pdpl:11.3
      assessable: true
      depth: 2
      parent_urn: urn:intuitem:risk:req_node:ia-sat-ml-pdpl:root
      ref_id: '11.3'
      name: The content of the Personal Data shall be appropriate and limited to the mini…
      description: 'The content of the Personal Data shall be appropriate and limited to the minimum amount
        necessary to achieve the purpose of the Collection. Content that may lead to specifically identifying
        Data Subject once the purpose of Collection is achieved shall be avoided. The Regulations shall
        set out the necessary controls in this regard.


        **Implementation guide**


        Implement data minimization at the design stage of each collection activity with documented necessity
        assessments and controls to avoid identification after purpose completion, document these requirements
        in the related personal data collection policy / procedure


        **Verification method**


        Review data collection minimization implementation and related policy / procedure'
      typical_evidence: • personal data colloction policy / procedure • Collection necessity assessment
    - urn: urn:intuitem:risk:req_node:ia-sat-ml-pdpl:11.4
      assessable: true
      depth: 2
      parent_urn: urn:intuitem:risk:req_node:ia-sat-ml-pdpl:root
      ref_id: '11.4'
      name: If the Personal Data collected is no longer necessary for the purpose for whi…
      description: 'If the Personal Data collected is no longer necessary for the purpose for which it
        has been collected, the Controller shall, without undue delay, cease their Collection and destroy
        previously collected Personal Data.


        **Implementation guide**


        Define triggers for collection cessation tied to purpose fulfillment and Implement automated or
        procedural controls to cease collection and destroy data when purpose is fulfilled.


        **Verification method**


        Review collection cessation procedure and destruction records'
      typical_evidence: • Collection cessation procedures • Destruction trigger criteria and timeline
        • Destruction records
    - urn: urn:intuitem:risk:req_node:ia-sat-ml-pdpl:13
      assessable: true
      depth: 2
      parent_urn: urn:intuitem:risk:req_node:ia-sat-ml-pdpl:root
      ref_id: '13'
      name: When collecting Personal Data directly from the Data Subject, the Controller…
      description: 'When collecting Personal Data directly from the Data Subject, the Controller shall
        take appropriate measures to inform the Data Subject of the following upon Collection:


        **Implementation guide**


        Implement comprehensive information provision at all collection points covering all required disclosure
        elements, clearly define it in the personal data collection policy / procedure Apply at every
        collection point and maintain records confirming compliance at each channel.


        **Verification method**


        Review information provision at collection points ensuring it provides the required amount of
        information'
      typical_evidence: • Data collection/notice policy or standard listing the information that must
        be provided to Data Subjects at the time of direct collection
    - urn: urn:intuitem:risk:req_node:ia-sat-ml-pdpl:13.1
      assessable: true
      depth: 2
      parent_urn: urn:intuitem:risk:req_node:ia-sat-ml-pdpl:root
      ref_id: '13.1'
      name: The legal basis for collecting their Personal Data.
      description: 'The legal basis for collecting their Personal Data.


        **Implementation guide**


        Include clear legal basis statement in all privacy notices and collection point disclosures.


        **Verification method**


        Review privacy notices across all collection channels and verify legal basis disclosure by reviewing
        samples.'
      typical_evidence: • Privacy notice content confirming legal basis disclosure. • Sample screenshots
        or scripts from actual collection channels (web/app/branch/call‑centre) where the legal basis
        is clearly stated to the Data Subject.
    - urn: urn:intuitem:risk:req_node:ia-sat-ml-pdpl:13.2
      assessable: true
      depth: 2
      parent_urn: urn:intuitem:risk:req_node:ia-sat-ml-pdpl:root
      ref_id: '13.2'
      name: The purpose of the Collection, and shall specify the Personal Data whose Coll…
      description: 'The purpose of the Collection, and shall specify the Personal Data whose Collection
        is mandatory and the Personal Data whose Collection is optional. The Data Subject shall be informed
        that the Personal Data will not be subsequently processed in a manner inconsistent with the Collection
        purpose or in cases other than those stated in Article (10) of this Law.


        **Implementation guide**


        Design and maintain collection notices (web/app forms, call scripts, paper forms) that explicitly
        state the purpose of collecting Personal Data and clearly mark mandatory versus optional fields
        next to each data element or in a clear legend. Embed a statement in these notices confirming
        that the data will not later be processed for purposes inconsistent with the stated purpose, except
        in the situations permitted by Article (10), and ensure product/UX teams cannot publish new collection
        flows without this information.


        **Verification method**


        Review collection interfaces and privacy notices for mandatory/optional field distinction'
      typical_evidence: • Privacy notices distinguishing mandatory/optional fields • Purpose limitation
        commitment
    - urn: urn:intuitem:risk:req_node:ia-sat-ml-pdpl:13.3
      assessable: true
      depth: 2
      parent_urn: urn:intuitem:risk:req_node:ia-sat-ml-pdpl:root
      ref_id: '13.3'
      name: Unless the Collection is for security purposes, the identity of the person co…
      description: 'Unless the Collection is for security purposes, the identity of the person collecting
        the Personal Data and the address of its representative, if necessary.


        **Implementation guide**


        Ensure all non‑security‑purpose collection points include clear text identifying the controller
        (or person collecting on its behalf) and, where relevant, the representative’s address, using
        a consistent template across channels. Make legal/compliance responsible for approving these details
        and updating them whenever corporate or contact information changes.


        **Verification method**


        Review a sample of active collection points (excluding those explicitly designated as security‑purpose
        collection) to confirm that each clearly states the Controller’s identity and, where necessary,
        the representative’s address or contact details. Where security‑purpose collections exist, verify
        they are correctly classified and that the omission of identity details is limited to those justified
        cases'
      typical_evidence: • Collection notice templates showing the identity of the Controller (and representative
        address, where used), with a carve‑out for security‑purpose collections. • Sample collection channels
        (screenshots/forms/scripts) demonstrating that the Controller’s identity and contact/address details
        are shown at the point of collection, where applicable.
    - urn: urn:intuitem:risk:req_node:ia-sat-ml-pdpl:13.4
      assessable: true
      depth: 2
      parent_urn: urn:intuitem:risk:req_node:ia-sat-ml-pdpl:root
      ref_id: '13.4'
      name: The entities to which the Personal Data will be disclosed, the capacity of su…
      description: 'The entities to which the Personal Data will be disclosed, the capacity of such entities,
        and whether the Personal Data will be transferred, disclosed or processed outside the Kingdom.


        **Implementation guide**


        Update all PDPL notices and collection journeys so they clearly state who the Personal Data will
        be disclosed to (or categories of recipients), in what capacity those entities act (processor,
        controller, etc.), and whether any transfer, disclosure, or processing will occur outside KSA,
        using consistent PDPL‑compliant wording. Ensure legal/compliance maintains an up‑to‑date list
        of recipient types and cross‑border flows and embeds this into the standard notice template used
        across all channels.


        **Verification method**


        Review a sample of active collection points (web, app, paper, call scripts) to confirm they clearly
        identify the entities or categories receiving Personal Data, describe their capacity, and state
        whether data will be processed or stored outside the Kingdom. Cross‑check these notices against
        the organization''s RoPA and cross‑border transfer inventory to verify consistency'
      typical_evidence: • privacy notice / collection template that lists categories or names of recipient
        entities, their capacity, and clearly states whether Personal Data will be transferred, disclosed,
        or processed outside the Kingdom. • Sample live forms/screens/scripts showing this information
        presented to Data Subjects at the time of collection.
    - urn: urn:intuitem:risk:req_node:ia-sat-ml-pdpl:13.5
      assessable: true
      depth: 2
      parent_urn: urn:intuitem:risk:req_node:ia-sat-ml-pdpl:root
      ref_id: '13.5'
      name: The potential consequences and risks that may result from not collecting the…
      description: 'The potential consequences and risks that may result from not collecting the Personal
        Data.


        **Implementation guide**


        Clearly communicate consequences of not providing data without coercion or manipulation, make
        sure they are well defined in the privacy notice in addition to having them clearly deonstrated
        and accessable for the clients.


        **Verification method**


        Review collection interfaces and privacy notices for consequence disclosure, make sure the privacy
        notice is covering all requested aspects, published and easily accessable for clients before signing
        .'
      typical_evidence: • Consequence disclosure in privacy notices
    - urn: urn:intuitem:risk:req_node:ia-sat-ml-pdpl:13.6
      assessable: true
      depth: 2
      parent_urn: urn:intuitem:risk:req_node:ia-sat-ml-pdpl:root
      ref_id: '13.6'
      name: The rights of the Data Subject pursuant to Article (4) herein.
      description: 'The rights of the Data Subject pursuant to Article (4) herein.


        **Implementation guide**


        Ensure all collection and privacy notices include a clear section summarizing the Data Subject’s
        rights under Article (4) (for example, access, correction, destruction, objection, etc.), written
        in simple language and, where needed, supported by a link to a more detailed rights page. Make
        this rights section a mandatory component in your standard templates and require Legal/Privacy
        review to check that it stays updated when the Regulations or internal processes change.


        **Verification method**


        Review a sample of collection points (web/app forms, paper forms, call scripts) to confirm they
        inform Data Subjects about their Article (4) rights or prominently link to an up‑to‑date rights
        notice. Cross‑check that the rights described match your actual internal processes and SLAs (for
        handling access, correction, destruction, etc.)'
      typical_evidence: • Privacy / collection notice templates listing the Data Subject rights under
        Article (4) (e.g., access, correction, destruction, restriction, etc.). • Sample live collection
        channels (screenshots/forms) where these rights are clearly communicated.
    - urn: urn:intuitem:risk:req_node:ia-sat-ml-pdpl:13.7
      assessable: true
      depth: 2
      parent_urn: urn:intuitem:risk:req_node:ia-sat-ml-pdpl:root
      ref_id: '13.7'
      name: Such other elements as set out in the Regulations based on the nature of the…
      description: 'Such other elements as set out in the Regulations based on the nature of the activity
        done by the Controller.


        **Implementation guide**


        Monitor and implement sector-specific disclosure requirements as issued by SDAIA and sector regulators.
        Update privacy notices and collection point disclosures promptly upon identification of new requirements


        **Verification method**


        Review monitoring log for sector-specific disclosure updates, ensure they are mentioned in the
        collection notice policy.'
      typical_evidence: • Sector-specific disclosure requirements in the privacy/collection notice policy
    - urn: urn:intuitem:risk:req_node:ia-sat-ml-pdpl:14
      assessable: true
      depth: 2
      parent_urn: urn:intuitem:risk:req_node:ia-sat-ml-pdpl:root
      ref_id: '14'
      name: The Controller may not process Personal Data without taking sufficient steps…
      description: 'The Controller may not process Personal Data without taking sufficient steps to verify
        the Personal Data accuracy, completeness, timeliness and relevance to the purpose for which it
        is collected in accordance with the provisions of the Law.


        **Implementation guide**


        Implement data quality management framework / policy covering accuracy, completeness, timeliness,
        and relevance verification before and during processing. Define quality checks at collection,
        update, and processing stages with periodic audits.


        **Verification method**


        Review data quality controls and review reports making sure clear controls are approved, implemented
        and reviewed.'
      typical_evidence: • Data quality/validation policy or standard • Data quality controls in key systems
        (e.g., validation rules, mandatory fields, update workflows) documented in procedures or configuration
        specs. • Periodic data quality/audit reports
    - urn: urn:intuitem:risk:req_node:ia-sat-ml-pdpl:15
      assessable: true
      depth: 2
      parent_urn: urn:intuitem:risk:req_node:ia-sat-ml-pdpl:root
      ref_id: '15'
      name: The Controller may not Disclose Personal Data except in the following situati…
      description: 'The Controller may not Disclose Personal Data except in the following situations:
        The Regulations shall set out the provisions, controls and procedures related to what is stated
        in paragraphs (2) to (6) of this Article.


        **Implementation guide**


        Set “no disclosure unless an allowed PDPL situation applies” as a hard rule in policy and processes,
        and require each disclosure type to be mapped to one of the specific situations defined in the
        Regulations with documented safeguards and approvals. Embed checks into systems and workflows
        (e.g., templates, approval steps, logging) so staff must select the applicable situation and confirm
        conditions are met before disclosing Personal Data.


        **Verification method**


        Review disclosure policy and sample disclosure logs ensuring a clear policy is defined, approved
        and implemented.'
      typical_evidence: • Disclosure policy (defining all cases defined in this control) • Disclosure
        authorization procedures • Sample disclosure logs
    - urn: urn:intuitem:risk:req_node:ia-sat-ml-pdpl:15.1
      assessable: true
      depth: 2
      parent_urn: urn:intuitem:risk:req_node:ia-sat-ml-pdpl:root
      ref_id: '15.1'
      name: Data Subject consents to the Disclosure in accordance with the provisions of…
      description: 'Data Subject consents to the Disclosure in accordance with the provisions of the Law.


        **Implementation guide**


        Obtain and record explicit consent before disclosure, capturing the specific recipient, purpose,
        and scope and implement withdrawal tracking to cease disclosure immediately upon consent withdrawal.


        **Verification method**


        Review disclosure consent records to ensure they are in line with the law.'
      typical_evidence: • Disclosure consent records with scope and timestamps • Consent withdrawal tracking
        records
    - urn: urn:intuitem:risk:req_node:ia-sat-ml-pdpl:15.2
      assessable: true
      depth: 2
      parent_urn: urn:intuitem:risk:req_node:ia-sat-ml-pdpl:root
      ref_id: '15.2'
      name: Personal Data has been collected from a publicly available source.
      description: 'Personal Data has been collected from a publicly available source.


        **Implementation guide**


        Before disclosing data collected from public sources, verify and document the source''s public
        availability status at the time of collection and maintain source records per disclosure instance


        **Verification method**


        Review public source verification records'
      typical_evidence: • Public source verification records per disclosure instance
    - urn: urn:intuitem:risk:req_node:ia-sat-ml-pdpl:15.3
      assessable: true
      depth: 2
      parent_urn: urn:intuitem:risk:req_node:ia-sat-ml-pdpl:root
      ref_id: '15.3'
      name: The entity requesting Disclosure is a Public Entity, and the Collection or Pr…
      description: 'The entity requesting Disclosure is a Public Entity, and the Collection or Processing
        of the Personal Data is required for public interest or security purposes, or to implement another
        law, to fulfill judicial requirements.


        **Implementation guide**


        Implement a formal procedure for handling public entity disclosure requests and verify the requesting
        entity''s public status, the stated legal basis, and proportionality of the request before disclosure.


        **Verification method**


        Review a sample of Public Entity disclosure cases to confirm each includes verification of Public
        Entity status, a concrete legal/judicial basis, and documented approval'
      typical_evidence: • Public entity disclosure request log • Request authorization and legal requirement
        verification records
    - urn: urn:intuitem:risk:req_node:ia-sat-ml-pdpl:15.4
      assessable: true
      depth: 2
      parent_urn: urn:intuitem:risk:req_node:ia-sat-ml-pdpl:root
      ref_id: '15.4'
      name: The Disclosure is necessary to protect public health, public safety, or to pr…
      description: 'The Disclosure is necessary to protect public health, public safety, or to protect
        the lives or health of specific individuals.


        **Implementation guide**


        Document necessity assessments for each emergency or safety-based disclosure confirming no less
        intrusive alternative existed and obtain appropriate internal authorization before disclosure
        and retain records per instance. make sure an emergency disclosure procedure or a process is in
        place, approved and implemented covering the cases defined by this control.


        **Verification method**


        Review emergency disclosure records and case assessments to assure they were disclosed for a valid
        reason, verify the exiestance of a procedure or process to handle emergency or urgent disclosures'
      typical_evidence: • Emergency disclosure procedures • Necessity assessment records per disclosure
        instance
    - urn: urn:intuitem:risk:req_node:ia-sat-ml-pdpl:15.5
      assessable: true
      depth: 2
      parent_urn: urn:intuitem:risk:req_node:ia-sat-ml-pdpl:root
      ref_id: '15.5'
      name: The Disclosure will only involve subsequent Processing in a form that makes i…
      description: 'The Disclosure will only involve subsequent Processing in a form that makes it impossible
        to directly or indirectly identify the Data Subject.


        **Implementation guide**


        Require any disclosure under this basis to include a documented transformation step that converts
        Personal Data into a form where Data Subjects cannot be directly or indirectly identified before
        it is shared. Build this step into data‑export workflows and approvals so legal/compliance and
        data owners confirm the de‑identification method is sufficient before each Disclosure.


        **Verification method**


        Review policies, sample disclosures, and the actual datasets shared to confirm that only de‑identified/aggregated
        data is disclosed and that no combination of fields allows re‑identification'
      typical_evidence: • Anonymization policy / procedure • Sample disclosure record with anonymized
        data
    - urn: urn:intuitem:risk:req_node:ia-sat-ml-pdpl:15.6
      assessable: true
      depth: 2
      parent_urn: urn:intuitem:risk:req_node:ia-sat-ml-pdpl:root
      ref_id: '15.6'
      name: The Disclosure is necessary to achieve legitimate interests of the Controller…
      description: 'The Disclosure is necessary to achieve legitimate interests of the Controller, without
        prejudice to the rights and interests of the Data Subject, and provided that no Sensitive Data
        is to be processed. The Regulations shall set out the provisions, controls and procedures related
        to what is stated in paragraphs (2) to (6) of this Article.


        **Implementation guide**


        Define “legitimate interests” for Disclosure in policy and restrict use of this basis to clearly
        documented cases where the Disclosure is necessary for a concrete controller interest, excludes
        Sensitive Data, and passes a recorded balancing test against Data Subjects’ rights and interests
        in line with the Regulations. Require completion and approval of a brief legitimate‑interest assessment
        before such Disclosures and record the outcome, legal basis, and safeguards in the disclosure
        register.


        **Verification method**


        Review samples of disclosures marked as “legitimate interests” to confirm each has a completed
        the legitimate use assessment with documents necessity and safeguards make sure all cases are
        logged and documented in a regester.'
      typical_evidence: • Legitimate‑interest disclosure assessment template or completed samples showing
        that no sensitive data is included. • Disclosure log or register entries indicating which disclosures
        rely on legitimate interests, with links to the completed assessment/approval. (if any)
    - urn: urn:intuitem:risk:req_node:ia-sat-ml-pdpl:16
      assessable: true
      depth: 2
      parent_urn: urn:intuitem:risk:req_node:ia-sat-ml-pdpl:root
      ref_id: '16'
      name: The Controller shall not disclose Personal Data in the situations stated in P…
      description: 'The Controller shall not disclose Personal Data in the situations stated in Paragraphs
        (1, 2, 5) and (6) of Article (15) if the Disclosure:


        **Implementation guide**


        Implement a mandatory pre-disclosure checklist verifying none of the Article 15 restriction conditions
        apply before any disclosure proceeds then document assessment outcomes and retain per disclosure
        event. Document these requirements in an approved policy / procedure making sure its approved
        by management and being implemented and reviewed regularly.


        **Verification method**


        Review the non‑disclosure/disclosure‑restriction procedure to confirm it explicitly references
        Article (15)(1,2,5,6) and the related Article (16) prohibition conditions, and that it is integrated
        into the disclosure approval process. Sample Disclosures that were allowed under Article (15)(1,2,5,6)
        and check that a documented assessment was done against the Article (16) conditions; also sample
        cases where Disclosures were refused or restricted to confirm that justifications were recorded
        in the disclosure decision log'
      typical_evidence: • Disclosure policy / disclosure restriction policy / procedure (covering all
        cases defined by this control) • Disclosure decision log capturing cases where Disclosure under
        Article (15)(1,2,5,6) was refused or restricted
    - urn: urn:intuitem:risk:req_node:ia-sat-ml-pdpl:16.1
      assessable: true
      depth: 2
      parent_urn: urn:intuitem:risk:req_node:ia-sat-ml-pdpl:root
      ref_id: '16.1'
      name: Represents a threat to security, harms the reputation of the Kingdom, or conf…
      description: 'Represents a threat to security, harms the reputation of the Kingdom, or conflicts
        with the interests of the Kingdom.


        **Implementation guide**


        Define evaluation criteria for identifying disclosures that may threaten national security, harm
        the Kingdom''s reputation, or conflict with its interests, make sure assessment are conducted
        before any disclosure involving sensitive relevant data.


        **Verification method**


        Review national interest assessment records and verify that the disclosure/transfer approval procedure
        exists and clearly requires assessing national‑interest risks (security, reputation, interests
        of the Kingdom) before approving relevant disclosures. Check a sample of entries in the disclosure
        decision log—both approved and refused—to confirm that this assessment was performed and that
        disclosures presenting such risks were blocked or restricted with justification.'
      typical_evidence: • Disclosure risk assessment criteria covering threats to security, harm to the
        Kingdom’s reputation, or conflicts with the Kingdom’s interests. • Disclosure restriction policy
        / procedure • Sample disclosure decision log entries
    - urn: urn:intuitem:risk:req_node:ia-sat-ml-pdpl:16.2
      assessable: true
      depth: 2
      parent_urn: urn:intuitem:risk:req_node:ia-sat-ml-pdpl:root
      ref_id: '16.2'
      name: Affects the Kingdom’s relations with any other state.
      description: 'Affects the Kingdom’s relations with any other state.


        **Implementation guide**


        Add explicit criteria with in the disclosure restriction policy / procedurefor assessing whether
        a contemplated disclosure could negatively impact the Kingdom’s relations with another state (for
        example, disclosures involving foreign public authorities, politically sensitive topics, or sanctioned
        jurisdictions). Require escalation to Legal/Compliance and, where necessary, higher governance
        bodies before approving such disclosures, and mandate that refusals or restrictions based on foreign‑relations
        concerns are documented in the disclosure decision log with clear rationale.


        **Verification method**


        Review the disclosure restriction policy / procedure to confirm it explicitly mentions potential
        impact on the Kingdom’s relations with other states as a factor in disclosure approval. Sample
        entries in the disclosure decision log, especially for cross‑border disclosures or those involving
        foreign public bodies, to verify that foreign‑relations risks were considered and that any disclosure
        raising such concerns was blocked or suitably restricted with recorded justification'
      typical_evidence: • Disclosure restriction policy / procedure • Foreign‑relations / other states
        impact assessment template and sample assessments - if any - • Disclosure decision log with justifications
    - urn: urn:intuitem:risk:req_node:ia-sat-ml-pdpl:16.3
      assessable: true
      depth: 2
      parent_urn: urn:intuitem:risk:req_node:ia-sat-ml-pdpl:root
      ref_id: '16.3'
      name: Prevents the detection of a crime, affects the rights of an accused to a fair…
      description: 'Prevents the detection of a crime, affects the rights of an accused to a fair trial,
        or affects the integrity of existing criminal procedures.


        **Implementation guide**


        Embed a mandatory legal/compliance review step for all disclosures under Article 15(1,2,5,6) to
        assess whether the disclosure could hinder crime detection, affect fair‑trial rights, or compromise
        ongoing criminal procedures, and require documented decisions (approve, limit, or deny disclosure)
        with justification. Ensure staff know they must escalate such requests and cannot proceed with
        disclosure until legal/compliance confirms there is no such adverse impact.


        **Verification method**


        Review decision assessment template and a sample of relevant disclosure cases to confirm each
        includes an explicit legal/compliance assessment of these criminal‑justice risks and that disclosures
        were limited or refused where risks were identified'
      typical_evidence: • Decision/assessment template used to evaluate potential impact on crime detection,
        fair‑trial rights, and integrity of criminal procedures. • Sample disclosure request files showing
        recorded assessment
    - urn: urn:intuitem:risk:req_node:ia-sat-ml-pdpl:16.4
      assessable: true
      depth: 2
      parent_urn: urn:intuitem:risk:req_node:ia-sat-ml-pdpl:root
      ref_id: '16.4'
      name: Compromises the safety of an individual.
      description: 'Compromises the safety of an individual.


        **Implementation guide**


        Require all disclosures under Article 15(1,2,5,6) to undergo a documented review by legal/compliance
        (or a designated committee) that explicitly considers whether the disclosure could compromise
        any individual’s safety make sure its documented and approved in the disclousre or related policy,
        and only allow the disclosure if the assessment confirms no such risk or appropriate safeguards
        can mitigate it. Train relevant staff to flag and escalate requests where there is any indication
        of potential harm, and to follow the documented decision and conditions strictly.


        **Verification method**


        Review policy and a sample of disclosure cases to confirm each includes an explicit safety‑impact
        assessment and that disclosures were refused, limited, or safeguarded where safety risks were
        identified'
      typical_evidence: • Disclosure policy • Risk‑assessment or decision template (with completed samples)
        used by legal/compliance to evaluate potential impact of a disclosure on the safety of individuals
        before approval.
    - urn: urn:intuitem:risk:req_node:ia-sat-ml-pdpl:16.5
      assessable: true
      depth: 2
      parent_urn: urn:intuitem:risk:req_node:ia-sat-ml-pdpl:root
      ref_id: '16.5'
      name: Results in violating the privacy of an individual other than the Data Subject…
      description: 'Results in violating the privacy of an individual other than the Data Subject, as
        set out in the Regulations.


        **Implementation guide**


        Require all disclosures under Article 15(1,2,5,6) to undergo a documented legal/compliance review
        that explicitly checks for potential violations of other individuals’ privacy (e.g., family members,
        witnesses, third parties) and mandates redaction, minimisation, or refusal where such risks exist
        per the Regulations. Ensure operational teams know they must not disclose until this review is
        completed and must follow any conditions (such as masking or partial disclosure) imposed by the
        decision.


        **Verification method**


        Review policies and a sample of disclosure cases to confirm that third‑party privacy impact is
        explicitly assessed and that disclosures were adjusted or denied where other individuals’ privacy
        could be violated'
      typical_evidence: • Third-party privacy impact assessment records • Disclosure policy • Sample Impact
        Assessment records
    - urn: urn:intuitem:risk:req_node:ia-sat-ml-pdpl:16.6
      assessable: true
      depth: 2
      parent_urn: urn:intuitem:risk:req_node:ia-sat-ml-pdpl:root
      ref_id: '16.6'
      name: Conflicts with the interests of a person that fully or partially lacks legal…
      description: 'Conflicts with the interests of a person that fully or partially lacks legal capacity.


        **Implementation guide**


        Require all disclosures under Article 15(1,2,5,6) to go through a documented legal/compliance
        review that explicitly checks whether the disclosure might conflict with the interests of anyone
        who fully or partially lacks legal capacity (e.g., minors, certain vulnerable adults), and mandate
        refusal, redaction, or strict safeguards where such conflict exists. Ensure frontline and back‑office
        teams are trained to flag cases involving these individuals and to follow the legal/compliance
        decision before releasing any data.


        **Verification method**


        Review policies and a sample of disclosure cases to confirm that potential conflicts with the
        interests of persons lacking full legal capacity are assessed and that disclosures were limited
        or denied where such conflicts exist'
      typical_evidence: • Disclosure policy • Iinterest assessment records for persons who fully or partially
        lack legal capacity • Guardian consultation procedures where applicable • Sample disclosure request
        showing that the presence and interests of persons lacking full legal capacity were assessed,
        and that disclosures were refused, limited, or conditioned where a conflict was identified.
    - urn: urn:intuitem:risk:req_node:ia-sat-ml-pdpl:16.7
      assessable: true
      depth: 2
      parent_urn: urn:intuitem:risk:req_node:ia-sat-ml-pdpl:root
      ref_id: '16.7'
      name: Violates legally established professional obligations.
      description: 'Violates legally established professional obligations.


        **Implementation guide**


        Require all disclosures under Article 15(1,2,5,6) to undergo a documented legal/compliance review
        that explicitly identifies any applicable professional obligations (such as sectoral secrecy or
        privilege) and prohibits disclosure where those duties would be violated, unless a clear legal
        exception applies. Embed this check into standard disclosure workflows so staff must escalate
        and obtain written legal/compliance approval, including any required redactions or conditions,
        before releasing data.


        **Verification method**


        Review policies and a sample of disclosure cases to confirm that professional‑obligation checks
        are documented and that disclosures were refused, limited, or redacted where such obligations
        apply'
      typical_evidence: • Disclosure policy • Assessment/decision template (and sample completed assessments)
        where legal/compliance check for applicable professional obligations before authorising disclosure
        and record their conclusion.
    - urn: urn:intuitem:risk:req_node:ia-sat-ml-pdpl:16.8
      assessable: true
      depth: 2
      parent_urn: urn:intuitem:risk:req_node:ia-sat-ml-pdpl:root
      ref_id: '16.8'
      name: Involves a violation of an obligation, procedure, or judicial decision.
      description: 'Involves a violation of an obligation, procedure, or judicial decision.


        **Implementation guide**


        Require all disclosures under Article 15(1,2,5,6) to go through legal/compliance review that verifies
        there is no conflict with applicable obligations (contractual, regulatory, professional), internal
        procedures, or binding judicial decisions before any data is released, and mandate written approval
        that records this confirmation. Embed this step in the disclosure workflow so staff cannot proceed
        without documented sign‑off and any required conditions (e.g., partial/redacted disclosure or
        deferral).


        **Verification method**


        Review policies and a sample of disclosure cases to confirm that checks against relevant obligations,
        procedures, and judicial decisions are documented and that disclosures were limited or refused
        where conflicts exist'
      typical_evidence: • Disclosure policy • Assessment/decision template (and sample completed assessments)
        used by legal/compliance to confirm that a proposed disclosure does not conflict with existing
        obligations, procedures, or court/tribunal decisions.
    - urn: urn:intuitem:risk:req_node:ia-sat-ml-pdpl:16.9
      assessable: true
      depth: 2
      parent_urn: urn:intuitem:risk:req_node:ia-sat-ml-pdpl:root
      ref_id: '16.9'
      name: Exposes the identity of a confidential source of information in a manner detr…
      description: 'Exposes the identity of a confidential source of information in a manner detrimental
        to the public interest.


        **Implementation guide**


        Require all disclosures under Article 15(1,2,5,6) to undergo legal/compliance review that explicitly
        checks whether any confidential source might be identified and, if so, either blocks the disclosure
        or ensures sufficient redaction/aggregation to protect the source and the public interest. Train
        staff to flag cases involving whistleblowers, informants, or similar confidential sources and
        to follow the documented legal/compliance decision before releasing any data.


        **Verification method**


        Review policies and a sample of disclosure cases to confirm that confidential‑source exposure
        is explicitly assessed and that disclosures were blocked or suitably redacted where this risk
        exists'
      typical_evidence: • Disclosure policy • Assessment/decision template (and sample completed assessments)
        where legal/compliance evaluate whether a proposed disclosure could reveal a confidential source’s
        identity and document their conclusion.
    - urn: urn:intuitem:risk:req_node:ia-sat-ml-pdpl:17.1
      assessable: true
      depth: 2
      parent_urn: urn:intuitem:risk:req_node:ia-sat-ml-pdpl:root
      ref_id: '17.1'
      name: If Personal Data is corrected, completed or updated, the Controller shall not…
      description: 'If Personal Data is corrected, completed or updated, the Controller shall notify such
        amendment to all the other entities to which such Personal Data has been transferred and make
        the amendment available to such entities.


        **Implementation guide**


        maintain and follow a documented rectification process that, for every approved correction, completion,
        or update of Personal Data, all entities to which the data was previously transferred are identified
        and promptly notified, making the updated data available through defined channels (e.g., secure
        emails, system interfaces, or batch updates) in line with agreed SLAs and contractual obligations.


        **Verification method**


        review the related policy, rectification procedure, transfer/register records, and a sample of
        rectification cases to confirm that relevant recipients are traceable and have been notified of
        corrections within the defined timelines, supported by evidence of notifications or update transactions,
        and validates through interviews or walkthroughs with owners that the process operates as documented
        in practice.'
      typical_evidence: • Related personal data management policy / procedure (describing the obligation
        to inform all prior recipients when Personal Data is corrected, completed or updated) • Records
        of rectification requests and actions (e.g., tickets, case files) • Register or log of Personal
        Data transfers • Notification confirmation records
    - urn: urn:intuitem:risk:req_node:ia-sat-ml-pdpl:17.2
      assessable: true
      depth: 2
      parent_urn: urn:intuitem:risk:req_node:ia-sat-ml-pdpl:root
      ref_id: '17.2'
      name: The Regulations shall set out the time frames for correction and updating of…
      description: 'The Regulations shall set out the time frames for correction and updating of Personal
        Data, types of correction, and the procedures required to avoid the consequences of Processing
        incorrect, inaccurate or outdated Personal Data.


        **Implementation guide**


        Define correction timeframes per PDPL Regulations for each correction type and Implement processing
        suspension controls for data under active correction to prevent consequences of processing inaccurate
        or outdated data.


        **Verification method**


        Review correction policy for regulatory alignment and timeframe compliance'
      typical_evidence: • Correction timeframe policy aligned with PDPL regulations • Correction type
        classification
    - urn: urn:intuitem:risk:req_node:ia-sat-ml-pdpl:18.1
      assessable: true
      depth: 2
      parent_urn: urn:intuitem:risk:req_node:ia-sat-ml-pdpl:root
      ref_id: '18.1'
      name: The Controller shall, without undue delay, Destroy the Personal Data when no…
      description: 'The Controller shall, without undue delay, Destroy the Personal Data when no longer
        necessary for the purpose for which they were collected. However, the Controller may retain data
        after the purpose of the Collection ceases to exist; provided that it does not contain anything
        that may lead to specifically identifying Data Subject pursuant to the controls stipulated in
        the Regulations.


        **Implementation guide**


        Implement automated retention management process with destruction triggers making sure its clearly
        defined and mandated in the data retention policy and in cases where retention beyond purpose
        is required, apply anonymization before retention and verify no identifying elements remain. makesure
        destruction certificates are issued per destruction event


        **Verification method**


        Review retention policy , schedules and destruction certificates'
      typical_evidence: • Data retention policy and schedule • Destruction procedures • Destruction certificates
        • Anonymization records for retained data
    - urn: urn:intuitem:risk:req_node:ia-sat-ml-pdpl:18.2
      assessable: true
      depth: 2
      parent_urn: urn:intuitem:risk:req_node:ia-sat-ml-pdpl:root
      ref_id: '18.2'
      name: In the following cases, the Controller shall retain the Personal Data after t…
      description: 'In the following cases, the Controller shall retain the Personal Data after the purpose
        of the Collection ceases to exist: a) If there is a legal basis for retaining the Personal Data
        for a specific period, in which case the Personal Data shall be destroyed upon the lapse of that
        period or when the purpose of the Collection is satisfied, whichever longer b) If the Personal
        Data is closely related to a case under consideration before a judicial authority and the retention
        of the Personal Data is required for that purpose, in which case the Personal Data shall be destroyed
        once the judicial procedures are concluded.


        **Implementation guide**


        Implement a retention schedule that sets default destruction when the collection purpose ends,
        with explicit exceptions only for legally mandated periods and ongoing judicial cases, and configure
        systems/processes to flag and review such exceptions. Ensure data owners and legal/compliance
        approve any extended retention, record the legal or judicial basis, and trigger destruction when
        the legal period or case conclusion is reached.


        **Verification method**


        Review the retention policy/schedule and a sample of datasets where the original purpose has ended
        to confirm that any continued retention is supported by documented legal or judicial reasons and
        that destruction occurs when those reasons lapse'
      typical_evidence: • Data retention policy • Retention schedule or register mapping key data categories
        to legal retention periods and indicating where extended retention applies due to specific laws
        or ongoing judicial cases. • Sample records (e.g., case files, retention exceptions log) showing
        documented legal/judicial reasons for extended retention
    - urn: urn:intuitem:risk:req_node:ia-sat-ml-pdpl:23
      assessable: true
      depth: 2
      parent_urn: urn:intuitem:risk:req_node:ia-sat-ml-pdpl:root
      ref_id: '23'
      name: Without prejudice to this Law, the Regulations shall set out additional contr…
      description: 'Without prejudice to this Law, the Regulations shall set out additional controls and
        procedures for the Processing of Health Data in a manner that ensures the privacy of the Data
        Subject and protects their rights under this Law. Such additional controls and procedures shall
        include the following:


        **Implementation guide**


        Implement enhanced stricter controls for health data processing including additional security
        measures and sector-specific compliance requirements and align with sector-specific requirements
        from the Saudi Health Council and any applicable health sector cybersecurity controls.


        **Verification method**


        Review health data processing policy, processes and protection procedures to ensure that suffecient
        security measures are being implemented.'
      typical_evidence: • Health data processing policy • Enhanced security controls for health data •
        Health sector compliance assessment
    - urn: urn:intuitem:risk:req_node:ia-sat-ml-pdpl:23.1
      assessable: true
      depth: 2
      parent_urn: urn:intuitem:risk:req_node:ia-sat-ml-pdpl:root
      ref_id: '23.1'
      name: Restricting the right to access Health Data, including medical files, to the…
      description: 'Restricting the right to access Health Data, including medical files, to the minimum
        number of employees or workers and only to the extent necessary to provide the required Health
        Services.


        **Implementation guide**


        Define and enforce role‑based access rules for Health Data so that only the minimum number of
        employees and workers required to deliver Health Services are granted access, and configure systems
        and processes to restrict their permissions strictly to what is necessary for their duties.


        **Verification method**


        Review and validate that documented access rules for Health Data are implemented and enforced
        in systems and processes, by sampling user access and reviewing periodic access reviews, to confirm
        that only the minimum necessary personnel have access aligned with their roles.'
      typical_evidence: • Policy or procedure defining role‑based access to Health Data, including “minimum
        necessary” principles and restrictions • Role/permission matrix or access model. • Periodic access
        review reports
    - urn: urn:intuitem:risk:req_node:ia-sat-ml-pdpl:23.2
      assessable: true
      depth: 2
      parent_urn: urn:intuitem:risk:req_node:ia-sat-ml-pdpl:root
      ref_id: '23.2'
      name: Restricting Health Data Processing procedures and operations to the minimum e…
      description: 'Restricting Health Data Processing procedures and operations to the minimum extent
        possible of employees and workers as necessary to provide Health Services or offer health insurance
        programs.


        **Implementation guide**


        Document and limit health data processing to minimum necessary staff with specific authorization
        for health service delivery.


        **Verification method**


        Review staff authorization records against active processing roles'
      typical_evidence: • Health data processing procedures • Staff authorization records • Processing
        limitation documentation
    - urn: urn:intuitem:risk:req_node:ia-sat-ml-pdpl:25
      assessable: true
      depth: 2
      parent_urn: urn:intuitem:risk:req_node:ia-sat-ml-pdpl:root
      ref_id: '25'
      name: With the exception of the awareness-raising materials sent by Public Entities…
      description: 'With the exception of the awareness-raising materials sent by Public Entities, Controller
        may not use personal means of communication, including the post and email, of the Data Subject
        to send advertising or awareness-raising materials, unless:


        **Implementation guide**


        Establish a marketing communications policy distinguishing advertising from service communications
        and ensure advertising is only sent to recipients with valid prior consent and that sensitive
        data is excluded from all marketing activities.


        **Verification method**


        Review marketing policy for PDPL alignment and review marketing communication controls'
      typical_evidence: • Marketing communication policy • Consent management records for marketing •
        Opt-out mechanism documentation
    - urn: urn:intuitem:risk:req_node:ia-sat-ml-pdpl:25.1
      assessable: true
      depth: 2
      parent_urn: urn:intuitem:risk:req_node:ia-sat-ml-pdpl:root
      ref_id: '25.1'
      name: Obtaining the prior consent of the targeted recipient for such materials.
      description: 'Obtaining the prior consent of the targeted recipient for such materials.


        **Implementation guide**


        Define in policy that no marketing or similar targeted materials may be sent unless the Data Subject
        has provided prior, informed, and verifiable consent for that type of communication and channel.
        Implement consent‑capture and storage in CRM and campaign tools (with purpose, channel, date/time,
        and source), and configure campaigns to include only recipients with active, relevant consent
        and to exclude those who have not consented or have opted out.


        **Verification method**


        Review the marketing/communications and privacy policies to confirm the requirement for prior
        consent of targeted recipients and how it is to be recorded and honoured.'
      typical_evidence: • Documented marketing/communications policy stating that targeted recipients
        must give prior consent before receiving such materials, and describing acceptable consent channels
        and records. • sample consent records showing marketing consent request
    - urn: urn:intuitem:risk:req_node:ia-sat-ml-pdpl:25.2
      assessable: true
      depth: 2
      parent_urn: urn:intuitem:risk:req_node:ia-sat-ml-pdpl:root
      ref_id: '25.2'
      name: The sender of the material shall provide a clear mechanism, as set out in the…
      description: 'The sender of the material shall provide a clear mechanism, as set out in the Regulations,
        that enables the targeted recipient to request stopping receiving such materials if they desire
        so.


        **Implementation guide**


        Implement clear, easy-to-use unsubscribe mechanism in all marketing communications with timely
        processing of opt-out requests.


        **Verification method**


        Test unsubscribe mechanism end-to-end functionality'
      typical_evidence: • Unsubscribe mechanism documentation • Opt-out request log
    - urn: urn:intuitem:risk:req_node:ia-sat-ml-pdpl:25.3
      assessable: true
      depth: 2
      parent_urn: urn:intuitem:risk:req_node:ia-sat-ml-pdpl:root
      ref_id: '25.3'
      name: The Regulations shall set out the provisions concerning the aforementioned ad…
      description: 'The Regulations shall set out the provisions concerning the aforementioned advertising
        and awareness-raising materials, as well as the conditions and situations concerning the consent
        of the recipient to receive aforementioned materials.


        **Implementation guide**


        Document the PDPL Regulatory rules on advertising and awareness materials in a clear internal
        policy that specifies when consent is mandatory, acceptable consent channels, and any permitted
        exceptions (e.g., certain awareness notices). Embed these rules into marketing and communication
        approval workflows so every campaign records its legal basis and verifies eligible recipients
        before launch. Ensure CRM and campaign tools store consent and preference data accurately and
        enforce exclusions for recipients without valid consent or who have opted out.


        **Verification method**


        Check that the policy aligns with PDPL Regulatory provisions and that sampled campaigns have documented
        consent basis and matching consent records for targeted recipients.'
      typical_evidence: • Approved policy/standard for advertising and awareness materials • Recent campaign
        documentation (recipient list + consent/opt‑in extract)
    - urn: urn:intuitem:risk:req_node:ia-sat-ml-pdpl:26
      assessable: true
      depth: 2
      parent_urn: urn:intuitem:risk:req_node:ia-sat-ml-pdpl:root
      ref_id: '26'
      name: With the exception of Sensitive Data, Personal Data may be processed for mark…
      description: 'With the exception of Sensitive Data, Personal Data may be processed for marketing
        purposes, if it is collected directly from the Data Subject and their consent is given in accordance
        with the provisions of Law; the Regulations shall set out the controls in such regard.


        **Implementation guide**


        Configure policies and systems so marketing uses only non‑sensitive Personal Data that was collected
        directly from the Data Subject with valid marketing consent, and technically block Sensitive Data
        from marketing use.


        **Verification method**


        Configure policies and systems so marketing uses only non‑sensitive Personal Data that was collected
        directly from the Data Subject with valid marketing consent, and technically block Sensitive Data
        from marketing use.'
      typical_evidence: • Approved marketing/communications policy • Sample of recent marketing campaign
        records (recipient list + consent log)
    - urn: urn:intuitem:risk:req_node:ia-sat-ml-pdpl:31
      assessable: true
      depth: 2
      parent_urn: urn:intuitem:risk:req_node:ia-sat-ml-pdpl:root
      ref_id: '31'
      name: Without prejudice to Article (18) herein, the Controller shall maintain recor…
      description: 'Without prejudice to Article (18) herein, the Controller shall maintain records, for
        such a period as required under the Regulations, of the Personal Data Processing activities, based
        on the nature of the activity carried out by the Controller. Such records are to be available
        whenever requested by the Competent Authority. The records shall contain the following information
        at a minimum:


        **Implementation guide**


        Establish and maintain a central Processing register that captures all required PDPL fields for
        each activity based on the business nature, and set procedures to retain these records for at
        least the Regulatory minimum. Make a specific function (e.g., privacy/compliance) responsible
        for keeping the register up to date and for promptly providing it to the Competent Authority when
        requested. document these requirements the personal data management policy make sure it gets reviewed
        by legal / compliance department and approved by top management / board.


        **Verification method**


        Check the policy and Processing register to confirm it exists, covers all in‑scope activities,
        is retained for the required period, and can be readily produced to the Competent Authority'
      typical_evidence: • Personal data management policy (with defined mandates covering the control
        requirements) • Central Processing register (or RoPA) extract showing Processing activities recorded
        by activity type/business line, retained for the required period. • Evidence that the register
        can be produced to the Competent Authority (e.g., export capability, prior mock‑request or internal
        audit showing timely retrieval).
    - urn: urn:intuitem:risk:req_node:ia-sat-ml-pdpl:31.1
      assessable: true
      depth: 2
      parent_urn: urn:intuitem:risk:req_node:ia-sat-ml-pdpl:root
      ref_id: '31.1'
      name: Contact details of the Controller.
      description: 'Contact details of the Controller.


        **Implementation guide**


        Include current controller contact details in the RoPA and define a procedure for updating them
        promptly upon any change and asign ownership for contact accuracy verification during periodic
        RoPA reviews.


        **Verification method**


        Verify controller contact details in ROPA are current and accurate. Confirm update procedure is
        documented and contact information is reviewed as part of the regular ROPA maintenance cycle.'
      typical_evidence: • Controller contact information in RoPA • Contact update procedures
    - urn: urn:intuitem:risk:req_node:ia-sat-ml-pdpl:31.2
      assessable: true
      depth: 2
      parent_urn: urn:intuitem:risk:req_node:ia-sat-ml-pdpl:root
      ref_id: '31.2'
      name: The purpose of the Personal Data Processing.
      description: 'The purpose of the Personal Data Processing.


        **Implementation guide**


        Document all processing purposes in the RoPA with explicit mapping to the specific activities
        they relate to and the corresponding legal basis under PDPL (purposes must be specific, not generic)


        **Verification method**


        Review RoPA purpose entries for specificity and completeness'
      typical_evidence: • Purpose entries in RoPA • Purpose-activity and legal baes mapping
    - urn: urn:intuitem:risk:req_node:ia-sat-ml-pdpl:31.3
      assessable: true
      depth: 2
      parent_urn: urn:intuitem:risk:req_node:ia-sat-ml-pdpl:root
      ref_id: '31.3'
      name: Description of the categories of Personal Data Subjects.
      description: 'Description of the categories of Personal Data Subjects.


        **Implementation guide**


        Document all data subject categories in the RoPA with clear classification criteria and scope
        definitions. Categories must be specific (e.g., employees, customers, minors) rather than generic
        and reviewed during each ROPA update cycle.


        **Verification method**


        Review ROPA data subject category entries'
      typical_evidence: • Data subject category documentation • Category classification criteria
    - urn: urn:intuitem:risk:req_node:ia-sat-ml-pdpl:31.4
      assessable: true
      depth: 2
      parent_urn: urn:intuitem:risk:req_node:ia-sat-ml-pdpl:root
      ref_id: '31.4'
      name: Any other entity to which Personal Data has been, or will be, disclosed
      description: 'Any other entity to which Personal Data has been, or will be, disclosed


        **Implementation guide**


        Maintain a comprehensive register of all entities to which personal data has been or will be disclosed
        and document each recipient''s identity, capacity, disclosure purpose, and legal basis. Keep register
        current and reflect it in the RoPA.


        **Verification method**


        Review disclosure recipient register making sure that the register includes purpose and legal
        basis'
      typical_evidence: • Disclosure recipient register • Third-party inventory • Disclosure purpose and
        legal bases documentation
    - urn: urn:intuitem:risk:req_node:ia-sat-ml-pdpl:31.5
      assessable: true
      depth: 2
      parent_urn: urn:intuitem:risk:req_node:ia-sat-ml-pdpl:root
      ref_id: '31.5'
      name: Whether the Personal Data has been or will be transferred outside the Kingdom…
      description: 'Whether the Personal Data has been or will be transferred outside the Kingdom or disclosed
        to an entity outside the Kingdom


        **Implementation guide**


        Document all cross-border transfers and disclosures to entities outside KSA in the RoPA. Record
        transfer destination, recipient identity, transfer purpose, legal basis, and safeguards implemented
        per transfer.


        **Verification method**


        Review cross-border transfer register for completeness. Verify all international transfers are
        captured, safeguards are documented, and the register is updated when new transfer relationships
        are established.'
      typical_evidence: • Cross-border transfer register • Transfer destination, and recipients documentation
        • Transfer safeguard documentation
    - urn: urn:intuitem:risk:req_node:ia-sat-ml-pdpl:31.6
      assessable: true
      depth: 2
      parent_urn: urn:intuitem:risk:req_node:ia-sat-ml-pdpl:root
      ref_id: '31.6'
      name: The expected period for which Personal Data shall be retained.
      description: 'The expected period for which Personal Data shall be retained.


        **Implementation guide**


        Document specific retention periods for each processing activity in the RoPA with clear justification
        referencing the legal basis or business requirement and define a review schedule to reassess retention
        periods for continued necessity.


        **Verification method**


        Review ROPA retention period entries for specificity and justification making sure retention periods
        are not open-ended, are legally grounded, and are reviewed periodically for continued validity.'
      typical_evidence: • Retention period entries per processing activity in RoPA • Retention justification
        per processing activity • Review schedule
    - urn: urn:intuitem:risk:req_node:ia-sat-ml-pdpl:20.1
      assessable: true
      depth: 2
      parent_urn: urn:intuitem:risk:req_node:ia-sat-ml-pdpl:root
      ref_id: '20.1'
      name: The Controller shall notify the Competent Authority upon knowing of any breac…
      description: 'The Controller shall notify the Competent Authority upon knowing of any breach, damage,
        or illegal access to personal data, in accordance with the Regulations.


        **Implementation guide**


        Establish a breach / damage notification procedure with defined detection-to-notification timelines
        aligned with PDPL Regulations. Maintain notification templates and escalation paths to SDAIA .
        Track all notifications with timestamps.


        **Verification method**


        Review breach notification procedure and timeline tracking records. Verify SDAIA notifications
        are issued within required timeframes and documentation is retained per breach event.'
      typical_evidence: • Breach notification procedures • SDAIA notification templates • Notification
        timeline tracking • Competent Authority contact protocols
    - urn: urn:intuitem:risk:req_node:ia-sat-ml-pdpl:20.2
      assessable: true
      depth: 2
      parent_urn: urn:intuitem:risk:req_node:ia-sat-ml-pdpl:root
      ref_id: '20.2'
      name: The Controller shall notify the Data Subject of any breach, damage or illegal…
      description: 'The Controller shall notify the Data Subject of any breach, damage or illegal access
        to their Personal Data that would cause damage to their data or cause prejudice to their rights
        and interests, in accordance with the Regulations.


        **Implementation guide**


        Implement an impact assessment process to determine when a breach warrants data subject notification
        based on risk of damage or prejudice to rights, make sure a breach noftification process in in
        place and maintain notification templates and delivery records for each notified breach


        **Verification method**


        Review the breach notification procedures, impact assessment and notification records, verify
        that a clear assessment criteria is defined and consistently applied, and notifications are issued
        promptly when the threshold is met.'
      typical_evidence: • Data subject breach notification procedures • Impact assessment criteria • Impact
        assessment records per breach • Notification records
    - urn: urn:intuitem:risk:req_node:ia-sat-ml-pdpl:8
      assessable: true
      depth: 2
      parent_urn: urn:intuitem:risk:req_node:ia-sat-ml-pdpl:root
      ref_id: '8'
      name: Subject to the provisions of this Law and the Regulations regarding the Discl…
      description: 'Subject to the provisions of this Law and the Regulations regarding the Disclosure
        of Personal Data, the Controller shall only select Processors providing the necessary guarantees
        to implement the provisions of this Law and the Regulations. The Controller shall also monitor
        the compliance of said Processors with the provisions of this Law and the Regulations. This shall
        not prejudice the Controller’s responsibilities towards the Data Subject or the Competent Authority
        as the case may be. The Regulations shall set out the provisions necessary in this regard, including
        provisions related to any subsequent contracts conducted by the Processor.


        **Implementation guide**


        Define and enforce a formal process to select and approve only those Processors that can provide
        sufficient guarantees of PDPL compliance, by performing documented due diligence, incorporating
        PDPL‑aligned contractual clauses (including sub‑processing), and maintaining a register of Processors
        with assigned oversight owners and monitoring activities.


        **Verification method**


        Review and validate that the Processor management policy, due‑diligence records, contracts, and
        monitoring evidence demonstrate that only adequately assessed Processors are engaged under PDPL‑compliant
        terms, that sub‑processing is controlled per the Regulations, and that the Controller actively
        monitors and documents Processor compliance while retaining overall accountability toward Data
        Subjects and the Competent Authority.'
      typical_evidence: • Processor selection criteria / policy • Processor due diligence records • Executed
        Data Processing Agreements (DPAs) • Processor compliance monitoring reports • Sub-processor approval
        procedures
    - urn: urn:intuitem:risk:req_node:ia-sat-ml-pdpl:29.1
      assessable: true
      depth: 2
      parent_urn: urn:intuitem:risk:req_node:ia-sat-ml-pdpl:root
      ref_id: '29.1'
      name: Subject to the provisions of Paragraph (2) of this Article, a Controller may…
      description: 'Subject to the provisions of Paragraph (2) of this Article, a Controller may Transfer
        Personal Data outside the Kingdom or disclose it to a party outside the Kingdom, in order to achieve
        any of the following purposes: A. If this is relating to performing an obligation under an agreement,
        to which the Kingdom is a party. B. If it is to serve the interests of the Kingdom. C. If this
        is to the performance of an obligation to which the Data Subject is a party D. If this is to fulfill
        other purposes as set out in the Regulations.


        **Implementation guide**


        Define and enforce a cross‑border Transfer/Disclosure process that only allows Personal Data to
        be sent or disclosed outside the Kingdom after confirming and documenting that at least one permitted
        purpose under the Law applies (obligation under an agreement with the Kingdom, serving the Kingdom’s
        interests, performance of a contract with the Data Subject, or another purpose specified in the
        Regulations), with Legal/Compliance review where required.


        **Verification method**


        Review and validate that the cross‑border Transfer/Disclosure policy, registers, and sampled case
        documentation consistently identify and justify one of the permitted purposes for each Transfer/Disclosure,
        supported by underlying agreements or regulatory references, and confirm through approvals or
        interviews that Transfers/Disclosures that do not meet these conditions are not authorized in
        practice.'
      typical_evidence: • Cross‑border data Transfer/Disclosure policy or procedure describing the allowed
        purposes (A–D) and referencing this Article. • Transfer purpose documentation mapped to permitted
        PDPL bases • Cross‑border Transfer/Disclosure register • Legal/compliance reviews or approvals
        confirming that a proposed Transfer/Disclosure meets one of the permitted purposes and the other
        PDPL cross‑border conditions.
    - urn: urn:intuitem:risk:req_node:ia-sat-ml-pdpl:29.2
      assessable: true
      depth: 2
      parent_urn: urn:intuitem:risk:req_node:ia-sat-ml-pdpl:root
      ref_id: '29.2'
      name: The conditions that must be met when there is a Transfer or Disclosure of Per…
      description: 'The conditions that must be met when there is a Transfer or Disclosure of Personal
        Data, according to what is stated in Paragraph (1) of this Article, are as follows: A. The Transfer
        or Disclosure shall not cause any prejudice to national security or the vital interests of the
        Kingdom. B. There is an adequate level of protection for Personal Data outside the Kingdom. Such
        level of protection shall be at least equivalent to the level of protection guaranteed by the
        Law and Regulations, according to the results of an assessment conducted by the Competent Authority
        in coordination with whomever it deems appropriate from the other relevant authorities. C. The
        Transfer or Disclosure shall be limited to the minimum amount of Personal Data needed


        **Implementation guide**


        Define and enforce a cross‑border Transfer/Disclosure approval process that requires a documented
        check for potential prejudice to national security or the Kingdom’s vital interests, verifies
        that the recipient destination offers an adequate and equivalent level of Personal Data protection
        in line with competent‑authority guidance, and designs each Transfer/Disclosure so that only the
        minimum amount of Personal Data necessary for the specific purpose is included.


        **Verification method**


        Review and validate that cross‑border policies, assessment records, and sampled Transfer/Disclosure
        cases demonstrate that all three conditions (national security/vital‑interest protection, adequacy/equivalence
        of the destination, and minimum‑necessary scope) are explicitly evaluated and satisfied before
        approval, and confirm through supporting documentation and stakeholder interviews that Transfers/Disclosures
        not meeting these conditions are either redesigned or not authorized.'
      typical_evidence: • Cross‑border Transfer/Disclosure policy or procedure explicitly incorporating
        the three conditions. • Records of cross‑border Transfer/Disclosure assessments or approvals.
        •Destination adequacy references or register
    - urn: urn:intuitem:risk:req_node:ia-sat-ml-pdpl:29.3
      assessable: true
      depth: 2
      parent_urn: urn:intuitem:risk:req_node:ia-sat-ml-pdpl:root
      ref_id: '29.3'
      name: Paragraph (2) of this Article shall not apply to cases of extreme necessity t…
      description: 'Paragraph (2) of this Article shall not apply to cases of extreme necessity to preserve
        the life or vital interests of the Data Subject or to prevent, examine or treat disease.


        **Implementation guide**


        Establish an emergency transfer procedure for situations involving imminent risk to life or vital
        interests of the data subject, and document each instance with a necessity assessment and confirm
        the transfer was limited to what was required for the emergency.


        **Verification method**


        Review emergency transfer records for necessity justification and scope limitation. Verify the
        exception is not used routinely and each instance is individually assessed and documented.'
      typical_evidence: • Emergency transfer procedures • Vital interest documentation • Medical emergency
        protocols
    - urn: urn:intuitem:risk:req_node:ia-sat-ml-pdpl:29.4
      assessable: true
      depth: 2
      parent_urn: urn:intuitem:risk:req_node:ia-sat-ml-pdpl:root
      ref_id: '29.4'
      name: The Regulations shall set out the provisions, criteria and procedures related…
      description: 'The Regulations shall set out the provisions, criteria and procedures related to the
        implementing this Article, including applicable exceptions for Controllers regarding conditions
        referred to in Subparagraphs (b) and (c) of Paragraph (2) of this Article, as well as controls
        and procedures for such exemptions


        **Implementation guide**


        Define and enforce internal criteria, procedures and approval workflows that align with the detailed
        provisions in the Regulations for applying cross‑border Transfer/Disclosure conditions, including
        clearly documenting when exceptions to adequacy and minimum‑data requirements are permitted, how
        they are evaluated and approved, and which additional safeguards must be implemented by the Controller.


        **Verification method**


        Review and validate that policies, procedures, and sampled cross‑border Transfer/Disclosure cases
        involving exceptions demonstrate consistent alignment with the regulatory provisions, including
        proper justification, risk assessment and approvals for any reliance on exceptions to adequacy
        or minimum‑data conditions, and confirm via interviews or walkthroughs that staff understand and
        correctly apply both the standard conditions and the limited exemptions in practice.'
      typical_evidence: • Cross‑border Transfer/Disclosure policy ( explicitly referencing the relevant
        regulatory provisions) • Internal criteria and procedures describing when and how a Controller
        may rely on regulatory exceptions. • Sample Transfers/Disclosures where an exception to adequacy
        or minimum‑data conditions was used
    - urn: urn:intuitem:risk:req_node:ia-sat-ml-pdpl:dcc-3-1-1-4
      assessable: true
      depth: 2
      parent_urn: urn:intuitem:risk:req_node:ia-sat-ml-pdpl:root
      ref_id: DCC 3-1-1-4
      name: When transferring data outside the kingdom, the capability of the hosting org…
      description: 'When transferring data outside the kingdom, the capability of the hosting organization
        abroad to safeguard data must be verified, approval of the Authorizing Official must be obtained
        and complying with related laws and regulations.


        **Implementation guide**


        Before transferring data to any foreign host, conduct a formal capability assessment covering
        data protection practices, security controls, and regulatory compliance. document these requirements
        in the related policy for enforcement and obtain documented Authorizing Official approval prior
        to transfer commencement.


        **Verification method**


        Review host capability assessments and approval records, make sure that assessments are conducted
        per transfer relationship, Authorizing Official approval is formally documented, and compliance
        with applicable laws is confirmed before transfer proceeds.'
      typical_evidence: • Foreign host capability assessment records • Authorizing Official approval records
        • Regulatory compliance verification documentation
    - urn: urn:intuitem:risk:req_node:ia-sat-ml-pdpl:tr-1
      assessable: true
      depth: 2
      parent_urn: urn:intuitem:risk:req_node:ia-sat-ml-pdpl:root
      ref_id: TR-1
      name: The terms and phrases used in this Regulation shall have the meanings assigne…
      description: 'The terms and phrases used in this Regulation shall have the meanings assigned to
        them in Article (1) of the Personal Data Protection Law issued pursuant to Royal Decree No. (M/19)
        dated 9/2/1443 AH and its amendments. The following terms and phrases- wherever used in this Regulation-
        shall have the meanings assigned to them, unless the context requires otherwise: 1. Regulation:
        The implementing Regulation for Personal Data Transfer outside the Kingdom. 2. Appropriate Safeguards:
        The requirements imposed by the competent authority on controllers, which include adherence to
        the Law and Regulations when transferring or disclosing personal data to entities outside the
        Kingdom. This applies in cases where exemptions are granted from the conditions for providing
        an appropriate or minimum level of personal data protection, to ensure appropriate level of protection
        when transferring personal data outside the Kingdom that meets at least the standards prescribed
        by the Law and Regulations. 3. Operational Processes: A set of procedures related to the operational
        processes essential for the controller''s activities, including human resources operations, billing,
        accounting, and other workflow-related procedures. 4. Standard Contractual Clauses: Mandatory
        provisions governing the transfer of personal data outside the Kingdom that ensure appropriate
        level of protection for such data not less than the standard prescribed by the Law and Regulations.
        These provisions are in accordance with a standard form issued by the competent authority. 5.
        Binding Common Rules: Rules established by the controller, applicable to each controller and processing
        party within a group of multinational entities, ensure appropriate protection for personal data
        transferred outside the Kingdom at a level not less than that prescribed by the Law and Regulations.


        **Implementation guide**


        Define and enforce internal documentation and processes that adopt the Regulation’s terminology
        (including Appropriate Safeguards, Operational Processes, Standard Contractual Clauses, and Binding
        Common Rules), embed them into policies, contracts, and cross‑border workflows, and ensure that
        operational owners and support functions use these definitions consistently when planning or assessing
        Personal Data Transfers outside the Kingdom.


        **Verification method**


        Review and validate that internal policies, procedures, contract templates, and actual cross‑border
        Transfer cases correctly apply the Regulation’s definitions and mechanisms (such as Standard Contractual
        Clauses and Binding Common Rules), and confirm through training records and stakeholder interviews
        that relevant personnel understand and consistently use these terms when implementing and governing
        Personal Data Transfers.'
      typical_evidence: • Internal PDPL / cross‑border data protection guideline or glossary • Cross‑border
        Transfer policy or procedure explicitly referencing “Regulation,” “Appropriate Safeguards,” “Standard
        Contractual Clauses,” and “Binding Common Rules,” and describing when each is applicable. • Records
        showing use of Standard Contractual Clauses (controller–processor or controller–controller templates)
        and/or approved Binding Common Rules in actual cross‑border Transfers.(if any)
    - urn: urn:intuitem:risk:req_node:ia-sat-ml-pdpl:tr-2
      assessable: true
      depth: 2
      parent_urn: urn:intuitem:risk:req_node:ia-sat-ml-pdpl:root
      ref_id: TR-2
      name: Other purposes for transferring or disclosing personal data to a party outsid…
      description: 'Other purposes for transferring or disclosing personal data to a party outside the
        Kingdom shall comply with subparagraph (d) of paragraph (1) of Article (29) of the Law, including:
        1. Performing necessary operations for central processing to enable the controller to conduct
        its activities. 2. To provide a service or benefit to the subject of the personal data. 3. Conducting
        scientific research and studies.


        **Implementation guide**


        Document each transfer under Article 29(1)(d) permitted purposes, including central processing
        operations, data subject service delivery, and research activities, and map each transfer to its
        specific permitted purpose and implement appropriate safeguards proportionate to the transfer
        type.


        **Verification method**


        Review transfer purpose documentation for completeness and legal traceability, and verify each
        transfer under this basis is mapped to a specific permitted purpose, safeguards are implemented,
        and records are maintained per transfer relationship'
      typical_evidence: • Transfer purpose documentation for central processing, service delivery, and
        research activities • Safeguards documentation per transfer purpose
    - urn: urn:intuitem:risk:req_node:ia-sat-ml-pdpl:tr-3
      assessable: true
      depth: 2
      parent_urn: urn:intuitem:risk:req_node:ia-sat-ml-pdpl:root
      ref_id: TR-3
      name: 1. The competent authority shall publish on its official website a list of co…
      description: '1. The competent authority shall publish on its official website a list of countries
        or international organizations that provide an appropriate level of protection for personal data
        not less than that prescribed by the Law and Regulations. The competent authority shall review
        this list every four years, or as necessary, based on the following criteria: A.The existence
        of regulations that ensure the protection of personal data and the rights of data subjects, including
        the right to seek compensation for damages caused by violations of these rights. These regulations
        must meet at least the level of protection prescribed by Law and Regulations. B.The existence
        of a supervisory body responsible for enforcing the provisions related to the protection of personal
        data. C.The supervisory authority is prepared to cooperate with the competent authority in the
        Kingdom on matters related to the protection of personal data. D.The regulatory requirements related
        to the disclosure of personal data under the relevant statutory provisions applicable in the State
        or international organization must not conflict with the provisions for the disclosure of personal
        data set forth in the Law and Regulations, nor with any other statutory provisions in force in
        the Kingdom. E.Obligations arising from international treaties or agreements binding on a State
        or an international organization, as well as those related to its membership in regional or multilateral
        organizations, which may require the transfer of personal data. F.Provisions related to subsequent
        transfers of personal data, as stipulated in Article (5) of the Regulation. 2. The competent authority
        may amend the list of countries or international organizations that ensure an appropriate level
        of protection for personal data transferred outside the Kingdom not less than that prescribed
        by the Law and Regulations in accordance with the statutory procedures. If a review indicates
        that any of these countries or organizations no longer guarantees an appropriate level of protection,
        the competent authority may work with the relevant authorities in the State or the international
        organization to address the reasons for its exclusion from the list. 3. The competent authority
        may suspend the transfer or disclosure of personal data to any of the countries or organizations
        listed in paragraph (1) of this Article, in accordance with the statutory procedures. 4. The standards
        applied to countries and international organizations for evaluating the level of protection of
        personal data outside the Kingdom shall also apply to cities, special economic zones, and global
        trade centers.


        **Implementation guide**


        Define and enforce cross‑border governance processes that require verifying each destination against
        the competent authority’s adequacy list before Transfer/Disclosure, recording that status, monitoring
        the list for updates or suspensions, and taking prompt action (e.g., switching to appropriate
        safeguards or suspending Transfers) if a destination is removed or restricted, while applying
        the same adequacy standards to countries, international organizations, cities, special economic
        zones, and global trade centersmaking sure that the list is reviewed every 4 years.


        **Verification method**


        Review and validate that policies, registers, and sampled cross‑border Transfer/Disclosure cases
        demonstrate that destinations are checked against the adequacy list (including for cities and
        special zones), that changes or suspensions lead to documented decisions and actions, and confirm
        through interviews or communications that legal/compliance actively monitors the competent authority’s
        publications and communicates impacts to relevant business and IT owners.'
      typical_evidence: • Cross‑border Transfer policy/procedure explicitly requiring use of the official
        adequacy list published by the competent authority, and referring to possible suspensions or changes.
        • Internal register or log capturing, for each cross‑border Transfer/Disclosure, the destination
        and its adequacy status
    - urn: urn:intuitem:risk:req_node:ia-sat-ml-pdpl:tr-4
      assessable: true
      depth: 2
      parent_urn: urn:intuitem:risk:req_node:ia-sat-ml-pdpl:root
      ref_id: TR-4
      name: 1. In accordance with the cases of exemption specified in paragraph (2) of th…
      description: '1. In accordance with the cases of exemption specified in paragraph (2) of this Article,
        the controller shall implement the following appropriate safeguards: A.Standard contractual clauses.
        B.Binding common rules. C.Certificate of accreditation. 2. The controller is exempt from the two
        conditions required for transferring or disclosing personal data to a party outside the Kingdom,
        as stipulated in paragraphs (b) and (c) of paragraph (2) of Article (29) of the Law, or either
        of them. However, the transfer or disclosure of personal data to a party outside the Kingdom shall
        still be subject to appropriate safeguards in the following cases: A.If the transfer or disclosure
        of personal data is to be made between public bodies to implement an agreement to which the Kingdom
        is a party or to serve its interests, the controllers must include standard provisions for the
        protection of personal data in the relevant agreements or memoranda of understanding. B.If the
        transfer or disclosure is non-recurring or for a limited period and involves a limited number
        of data subjects, the controller must comply with the standard contractual clauses. Alternatively,
        if the transfer or disclosure is made to a body that has received an approval certificate from
        an entity licensed by the competent authority and the data is not sensitive. C.If the transfer
        or disclosure of personal data is necessary to perform central operations and the controller is
        part of a group of multinational entities, the controller and its affiliates must comply with
        binding common rules or standard contractual clauses that ensure adherence to the requirements
        stipulated by the Law and Regulations. Alternatively, the entity to which the personal data will
        be transferred or disclosed must obtain a certificate of approval issued by a body licensed by
        the competent authority. D.If the transfer or disclosure is made to provide a service or benefit
        directly to the data subject in a manner that does not violate their expectations or conflict
        with their interests, and if the transfer or disclosure is to a party that has received an approval
        certificate from a body licensed by the competent authority, provided that the data must not be
        sensitive. E.If the transfer or disclosure of personal data is necessary for conducting scientific
        research and studies, it must be limited to the minimum amount of data required. The controller
        must either comply with standard contractual clauses or ensure that the transfer or disclosure
        is made to a body that has received an approval certificate from an entity licensed by the competent
        authority, provided that the data must not be sensitive. 3. Appropriate safeguards must ensure
        that controllers comply with the provisions set out in the Law and its Regulations, as well as
        protect the rights of personal data subjects, including the right to file a complaint with the
        competent authority and to seek compensation for any damage caused by violations of these rights.
        4. The competent authority may review the adequacy of the appropriate safeguards specified for
        each exemption case outlined in paragraph (2) of this Article, and may amend them every two years
        or as necessary.


        **Implementation guide**


        Define and enforce cross‑border procedures that, for each applicable exemption scenario (public‑body
        agreements, occasional/limited Transfers, central operations in multinational groups, direct benefit
        to Data Subjects, and scientific research), require the Controller to apply the corresponding
        appropriate safeguards (Standard Contractual Clauses, Binding Common Rules, or accredited‑entity
        certificates), ensure that sensitive‑data limitations are respected, and document how Data Subject
        rights, complaint channels, and compensation rights remain protected.


        **Verification method**


        Review and validate that policies, contract templates, BCR documentation, accreditation records,
        and sampled cross‑border cases show that exemptions from adequacy and/or minimum‑data conditions
        are only used in the scenarios allowed by the Regulation, that the required safeguards are in
        place for each case, and that Data Subject rights and protections are explicitly preserved, confirming
        through interviews and documentation that any updates from the competent authority on safeguards
        are monitored and acted upon.'
      typical_evidence: '• Cross‑border Transfer policy/procedure describing when exemptions from this
        article may be used and prescribing the corresponding safeguards • Standard Contractual Clause
        templates • Case documentation for Transfers/Disclosures under each exemption scenario • Register
        of cross‑border Transfers/Disclosures indicating: exemption type (A–E), safeguard used'
    - urn: urn:intuitem:risk:req_node:ia-sat-ml-pdpl:tr-5
      assessable: true
      depth: 2
      parent_urn: urn:intuitem:risk:req_node:ia-sat-ml-pdpl:root
      ref_id: TR-5
      name: Without prejudice to the provisions of Articles (8) and (15) of the Law and A…
      description: 'Without prejudice to the provisions of Articles (8) and (15) of the Law and Article
        (17) of the Implementing Regulations, the Law and Regulations shall apply to subsequent transfers
        of personal data that has been transferred or disclosed to a party outside the Kingdom.


        **Implementation guide**


        Include explicit subsequent transfer restrictions in all transfer agreements requiring recipients
        to apply PDPL-equivalent protections for any onward transfers and verify recipient compliance
        through contractual audit rights and periodic compliance checks.


        **Verification method**


        Review transfer agreements for subsequent transfer restriction clauses and check if recipient
        compliance verification is conducted periodically and onward transfer controls are contractually
        enforceable.'
      typical_evidence: • Subsequent transfer restriction clauses in transfer agreements • Recipient onward
        transfer compliance verification records
    - urn: urn:intuitem:risk:req_node:ia-sat-ml-pdpl:tr-6
      assessable: true
      depth: 2
      parent_urn: urn:intuitem:risk:req_node:ia-sat-ml-pdpl:root
      ref_id: TR-6
      name: 1. None of the exemptions granted in accordance with the cases stipulated in…
      description: '1. None of the exemptions granted in accordance with the cases stipulated in Article
        (4) of the Regulation shall apply if any of the following situations arise: A.The controller has
        failed to implement the appropriate safeguards. B.If the competent authority determines that the
        appropriate safeguards are inadequate for any specific case. 2. If any of the conditions stipulated
        in subparagraphs (a) and (b) of paragraph (1) of this Article are met, the controller shall halt
        the transfer or disclosure and notify the entities to whom the personal data was transferred or
        disclosed.


        **Implementation guide**


        Implement a monitoring process to track exemption validity, including SDAIA adequacy reviews and
        safeguard assessments, upon identification of failed safeguards or SDAIA revocation, halt affected
        transfers immediately and notify all recipients of previously transferred data.


        **Verification method**


        verify that policies, workflows, and sample cases show exemptions are disapplied when safeguards
        fail or are deemed inadequate, that transfers/disclosures are halted, and that all prior recipients
        are notified'
      typical_evidence: • Policy or procedure (Cross‑border Transfer policy/procedure ) stating that exemptions
        under Article (4) do not apply where appropriate safeguards are not implemented or are deemed
        inadequate by the competent authority, and that transfers/disclosures must then be halted and
        recipients notified. • Exemption revocation monitoring records • Recipient notification records
        upon halt
    - urn: urn:intuitem:risk:req_node:ia-sat-ml-pdpl:tr-7
      assessable: true
      depth: 2
      parent_urn: urn:intuitem:risk:req_node:ia-sat-ml-pdpl:root
      ref_id: TR-7
      name: 1. The controller shall conduct a risk assessment before transferring or disc…
      description: '1. The controller shall conduct a risk assessment before transferring or disclosing
        personal data to a party outside the Kingdom in the following cases: A.Transfer or disclosure
        of personal data to a party outside the Kingdom in accordance with Article (4) of the Regulation.
        B.Transferring or disclosing sensitive data to entities outside the Kingdom on a continuous or
        widespread basis. 2. Risk assessment of transferring or disclosing personal data to a party outside
        the Kingdom should include the following elements: A.The purpose and legal basis for transferring
        or disclosing personal data to a party outside the Kingdom. B.A description of the nature of the
        transfer or disclosure of personal data to a party outside the Kingdom, including the activities
        involved in processing the data and their geographical scope. C.The appropriate safeguards and
        measures implemented for transferring or disclosing personal data to a party outside the Kingdom,
        and their adequacy in ensuring an appropriate level of protection for personal data not less than
        that prescribed by the Law and Regulations. D.The measures used to ensure that the transfer or
        disclosure of personal data to a party outside the Kingdom is limited to the minimum amount of
        data required to achieve the intended purposes, in cases not exempted by subparagraph (c) of paragraph
        (2) of Article (29) of the Law. E.The potential material or moral effects of transferring or disclosing
        personal data to a party outside the Kingdom and the likelihood of their occurrence. F.The measures
        or controls that will be applied to prevent potential risks to personal data subjects or to mitigate
        their effects if they occur.


        **Implementation guide**


        Create a standard cross‑border risk‑assessment template aligned to points A–F and make its completion
        mandatory before: - Any transfer/disclosure relying on Article (4) exemptions, and - Any continuous
        or widespread sensitive data export. The template should force documentation of the legal basis,
        processing description and geography, safeguards and adequacy analysis, minimization techniques,
        potential material/moral impacts, and the measures to prevent or mitigate risks. Embed this assessment
        step in the change/initiative and vendor‑onboarding workflows, with clear ownership (e.g., privacy/compliance),
        and require formal approval before enabling the transfer in production.


        **Verification method**


        Check the procedure and workflow documentation to confirm that cross‑border risk assessments are
        required in the specified cases and that a standard template covering A–F exists and is in use.
        Sample several recent cross‑border transfers to verify that assessments were completed before
        go‑live, all elements A–F are substantively addressed, and decisions (approve with controls, reject,
        or modify) are recorded and traceable'
      typical_evidence: • Cross‑border risk‑assessment procedure covering triggers and all elements (A–F)
        to be covered • Sample ompleted risk assessment reports • Cross‑border approval/decision record
        or register linking each transfer to its risk assessment outcome, management sign‑off, and any
        conditions or additional controls imposed.
    - urn: urn:intuitem:risk:req_node:ia-sat-ml-pdpl:tr-8
      assessable: true
      depth: 2
      parent_urn: urn:intuitem:risk:req_node:ia-sat-ml-pdpl:root
      ref_id: TR-8
      name: The competent authority shall issue guides and guidelines related to the prov…
      description: 'The competent authority shall issue guides and guidelines related to the provisions
        contained in this regulation.


        **Implementation guide**


        Set up a regulatory‑watch process owned by privacy/compliance to monitor publications from the
        competent authority and promptly identify new or updated guides related to this Regulation. For
        each new guide, perform an impact assessment, document any required changes to policies, procedures,
        and controls, and track completion of these changes, including targeted awareness for affected
        teams.


        **Verification method**


        Confirm there is a defined mechanism to monitor and respond to guides from the competent authority,
        and review recent publications to see whether they have been logged, assessed, and reflected in
        internal documentation and practices'
      typical_evidence: •Internal compliance policy / procedure stating that the entity will track, review,
        and implement guides/guidelines issued by the competent authority related to this Regulation.
    - urn: urn:intuitem:risk:req_node:ia-sat-ml-pdpl:tr-9
      assessable: true
      depth: 2
      parent_urn: urn:intuitem:risk:req_node:ia-sat-ml-pdpl:root
      ref_id: TR-9
      name: The Regulation shall enter into force on the date of its publication in the O…
      description: 'The Regulation shall enter into force on the date of its publication in the Official
        Gazette.


        **Implementation guide**


        Define and enforce a regulatory change management process that tracks the publication and entry
        into force of PDPL‑related Regulations in the Official Gazette, records the effective date, and
        triggers timely updates to internal policies, procedures, and communications so that the organization
        applies this Regulation from its effective date onward.


        **Verification method**


        Review and validate that regulatory change records, policy versions, and communications demonstrate
        that the organization identified the Regulation’s publication and effective date, updated its
        internal framework accordingly, and implemented the resulting obligations from that date forward.'
      typical_evidence: • Internal legal/compliance memo or circular noting the date of publication in
        the Official Gazette and confirming the Regulation’s effective date. • Versioned PDPL/cross‑border
        policy or framework documents showing the point in time when requirements from this Regulation
        were incorporated. • Records of awareness/communication to stakeholders
