      parent_urn: urn:intuitem:risk:req_node:ia-sat-ml-emerging-tech:root
      ref_id: 26-1
      name: Vulnerability assessments shall be conducted on IoT devices at planned interv…
      description: 'Vulnerability assessments shall be conducted on IoT devices at planned intervals.
        Assessment frequency: Sensitive devices (telematics): quarterly minimum; Standard devices: semi-annually;
        Low-risk: annually. Assessment shall identify: (1) known CVEs (NVD database matching) (2) weak
        authentication/encryption (3) unnecessary services/ports (4) outdated firmware (5) supply chain
        risks.


        **Implementation guide**


        Establish a formal IoT vulnerability assessment program that schedules scans and security reviews
        for Sensitive, Standard, and Low‑risk devices at the defined frequencies, uses tools and processes
        to detect CVEs, weak authentication/encryption, unnecessary services/ports, outdated firmware,
        and supply chain issues, and feeds all findings into a centralized vulnerability register with
        defined owners, remediation timelines, and verification of fixes.


        **Verification method**


        Review the IoT vulnerability assessment procedure and a sample of recent assessment reports across
        device classes to confirm that required frequencies and all five assessment dimensions are covered.
        Check the vulnerability register and associated tickets to verify that IoT findings are tracked
        with severity, that remediation or compensating controls are implemented within policy timeframes,
        and that follow‑up assessments confirm closure.'
      typical_evidence: • Documented IoT vulnerability assessment procedure defining device classes and
        scope of checks • Sample IoT vulnerability assessment reports for each classification tier • Tracking/remediation
        records
    - urn: urn:intuitem:risk:req_node:ia-sat-ml-emerging-tech:27-1
      assessable: true
      depth: 2
      parent_urn: urn:intuitem:risk:req_node:ia-sat-ml-emerging-tech:root
      ref_id: 27-1
      name: When IoT devices are retired, decommissioned, or replaced, data shall be secu…
      description: 'When IoT devices are retired, decommissioned, or replaced, data shall be securely
        erased and credentials revoked. Decommissioning process shall include: (1) data wipe (factory
        reset or secure erase per NIST SP 800-88) (2) credential revocation (API keys, certificates, passwords)
        (3) inventory removal; (4) physical destruction/resale (if applicable, per data classification)
        (5) documentation of decommissioning date and method.


        **Implementation guide**


        Implement a standardized IoT decommissioning workflow that, for every retired or replaced device,
        enforces secure data wiping, revokes all associated credentials and access, updates and removes
        the device from the inventory, applies appropriate physical destruction or controlled resale based
        on security classification, and records the decommissioning date, method, and approvals in a central
        log.


        **Verification method**


        Review the decommissioning procedure and a sample of recent IoT decommissioning cases to confirm
        all five required steps were followed, and compare inventory/CMDB data against decommissioning
        logs to verify that retired devices are no longer active, credentials are revoked, and destruction/resale
        actions and dates are properly documented.'
      typical_evidence: • Approved IoT decommissioning procedure describing mandatory secure data wipe,
        revocation of all device identities/credentials, inventory/CMDB update, physical destruction or
        controlled resale per classification, and documentation of decommissioning details. • Sample decommissioning
        records for IoT devices • Credential revocation records
