      Define, approve and implement clear network security requirements (e.g., segmentation, firewalls,
      remote access) and apply them to all relevant network devices and services. Ensure new changes follow
      these requirements through the normal change process.


      **Verification method**


      Confirm the approved requirements exist and cover key network security aspects. Check a small sample
      of network devices and diagrams to see if actual configurations follow those requirements and note
      any mismatches as gaps.'
    typical_evidence: • Approved network/security policy or standard • Network diagrams showing zones/segmentation
      • Recent configuration/rule-set review report •Recent configuration/rule-set review report
