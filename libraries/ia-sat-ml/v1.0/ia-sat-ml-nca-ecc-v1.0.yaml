    parent_urn: urn:intuitem:risk:req_node:ia-sat-ml-nca-ecc:domain-1-3
    ref_id: 1-3-1
    name: The Entity shall define, document, and approve a cybersecurity risk managemen…
    description: 'The Entity shall define, document, and approve a cybersecurity risk management methodology
      and its associated procedures.


      **Implementation guide**


      Develop risk management methodology aligned with ISO 27005 or NIST RMF including risk identification,
      analysis, evaluation, treatment, and monitoring procedures. Define risk appetite and tolerance levels.


      **Verification method**


      Review methodology documentation, verify alignment with standards, review dates and approvals'
    typical_evidence: • The approved risk assessment methodology
  - urn: urn:intuitem:risk:req_node:ia-sat-ml-nca-ecc:1-3-2
    assessable: true
    depth: 3
    parent_urn: urn:intuitem:risk:req_node:ia-sat-ml-nca-ecc:domain-1-3
    ref_id: 1-3-2
    name: The Entity shall implement the cybersecurity risk management methodology and…
    description: 'The Entity shall implement the cybersecurity risk management methodology and its associated
      procedures.


      **Implementation guide**


      Conduct regular risk assessments covering all critical assets, maintain updated risk register, implement
      treatment plans, and track risk metrics. Integrate risk management into project and change management
      processes.


      **Verification method**


      Review risk register, verify assessment completion, check treatment plan status'
    typical_evidence: • Risk register • Risk assessment reports • Risk treatment plans • Risk acceptance
      records • Risk monitoring dashboards
  - urn: urn:intuitem:risk:req_node:ia-sat-ml-nca-ecc:1-3-3
    assessable: true
    depth: 3
    parent_urn: urn:intuitem:risk:req_node:ia-sat-ml-nca-ecc:domain-1-3
    ref_id: 1-3-3
    name: The Entity shall periodically review the cybersecurity risk management method…
    description: 'The Entity shall periodically review the cybersecurity risk management methodology and
      its associated procedures.


      **Implementation guide**


      Conduct annual review of risk methodology effectiveness, incorporate lessons learned from incidents
      and industry developments, and update the methodology as needed.


      **Verification method**


      Verify review completion'
    typical_evidence: •Risk Methodology review schedule and changes record
  - urn: urn:intuitem:risk:req_node:ia-sat-ml-nca-ecc:domain-1-4
