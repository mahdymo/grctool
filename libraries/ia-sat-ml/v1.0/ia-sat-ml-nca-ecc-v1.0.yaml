    name: Procedures for communication and coordination shall be defined for cases wher…
    description: 'Procedures for communication and coordination shall be defined for cases where a cybersecurity
      incident occurs at a third party that may impact the Entity or the services provided to it.


      **Implementation guide**


      Define a specific third‑party incident communication procedure covering notification triggers, required
      information, channels, timelines, responsibilities, and escalation to management/regulators. Integrate
      it with the Entity’s incident response process and ensure third‑party contracts/SLAs require timely
      notification and cooperation. Communicate the procedure to internal stakeholders (e.g., vendor management,
      SOC, legal) and maintain an up‑to‑date contact list for critical suppliers.


      **Verification method**


      Verify that a documented, approved procedure exists for communication and coordination with third
      parties during cybersecurity incidents and that it is aligned with the Entity’s overall incident
      response process. Review a sample of relevant contracts/SLAs and incident records or drills to confirm
      that notification and coordination steps are defined and followed.'
    typical_evidence: • Third-party incident notification procedures • Contact matrix • Escalation procedures
      • Response coordination plan
  - urn: urn:intuitem:risk:req_node:ia-sat-ml-nca-ecc:3-1-2
    assessable: true
