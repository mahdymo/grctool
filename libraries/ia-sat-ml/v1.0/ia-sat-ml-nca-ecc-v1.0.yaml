    ref_id: 2-5-1-5
    name: Restricting and managing network ports, protocols, and services.
    description: 'Restricting and managing network ports, protocols, and services.


      **Implementation guide**


      All network ports, protocols, and services must be inventoried and restricted to only those required
      for legitimate business operations, with all unnecessary or unused ports and services disabled by
      default. A formal ports, protocols, and services (PPS) register must be maintained and reviewed
      periodically. Firewall and network device configurations must enforce these restrictions at both
      perimeter and internal network levels. Any exceptions must be formally approved, documented, and
      subject to compensating controls.


      **Verification method**


      Review the PPS register to confirm it is current, approved, and covers all network boundaries. Cross-reference
      approved ports against firewall rules and ACLs to confirm alignment and absence of unauthorized
      open ports. Verify that a recent port scan was conducted and that findings were remediated'
    typical_evidence: • Ports, protocols & services (PPS) register, all approved ports, protocols, and
      services with business justification and owner. • Firewall/ACL configuration evidence, Screenshots
      or configuration exports confirming that only approved ports and services are permitted at network
      boundaries • Network Vulnerability/Port scan report, results of periodic scanning (e.g., Nmap) confirming
      no unauthorized open ports exist across in-scope systems.
  - urn: urn:intuitem:risk:req_node:ia-sat-ml-nca-ecc:2-5-1-6
    assessable: true
    depth: 4
    parent_urn: urn:intuitem:risk:req_node:ia-sat-ml-nca-ecc:2-5-1
    ref_id: 2-5-1-6
    name: Advanced protection systems shall be implemented to detect and prevent intrus…
    description: 'Advanced protection systems shall be implemented to detect and prevent intrusions, including
      Intrusion Detection Systems (IDS) and Intrusion Prevention Systems (IPS).


      **Implementation guide**


      IDS/IPS solutions must be deployed at critical network segments, including perimeter, DMZ, and internal
      network boundaries, to monitor and actively block malicious traffic. Signatures and detection rules
      must be kept up to date to ensure coverage against current threats. IDS/IPS alerts must be integrated
      with the entitie''s SIEM or security monitoring capability to ensure timely detection and response.
      The solution''s effectiveness must be reviewed periodically, including tuning of false positives
      and validation of detection coverage.


      **Verification method**


      Confirm that IDS/IPS is deployed at all critical network boundaries and review the architecture
      diagram to assess coverage adequacy. Verify that signatures are current and that automatic update
      mechanisms are enabled. Check integration with SIEM or monitoring platforms and confirm that alerts
      are being triaged and actioned. Flag any gaps in network coverage, outdated signatures, disabled
      prevention mode (IPS running in detection-only without justification), or absence of SIEM integration
      as non-compliance indicators.'
    typical_evidence: • IDS/IPS Deployment Architecture/Diagram, Evidence showing placement of IDS/IPS
      sensors across network segments with coverage scope. • Signature update logs • Alert monitoring
      • IDS/IPS Alert & Incident Logs, Sample logs or SIEM integration evidence demonstrating active monitoring
      and alert handling.
  - urn: urn:intuitem:risk:req_node:ia-sat-ml-nca-ecc:2-5-1-7
    assessable: true
    depth: 4
    parent_urn: urn:intuitem:risk:req_node:ia-sat-ml-nca-ecc:2-5-1
    ref_id: 2-5-1-7
    name: Protection mechanisms shall be implemented to protect networks against Distri…
    description: 'Protection mechanisms shall be implemented to protect networks against Distributed Denial
      of Service (DDoS) attacks, in order to reduce cybersecurity risks resulting from network service
      disruption.


      **Implementation guide**


      DDoS protection mechanisms must be implemented at the network perimeter, covering both volumetric
      and application-layer attack vectors. This may include on-premise mitigation appliances, upstream
      ISP-level scrubbing, or cloud-based DDoS protection services (e.g., Cloudflare, Akamai, AWS Shield).
      Traffic thresholds and rate-limiting rules must be defined and configured to trigger automatic mitigation
      upon detection of anomalous traffic patterns. DDoS response procedures must be documented within
      the entity''s incident response or business continuity plan, and tested periodically.


      **Verification method**


      Confirm that a DDoS protection solution is in place and covers both network and application layers.
      Review threshold and rate-limiting configurations to verify they are defined, active, and aligned
      with the organization''s risk tolerance. Verify that DDoS response procedures exist within the incident
      response or BCP documentation and that testing has been conducted. Flag the absence of any mitigation
      solution, untested response procedures, or lack of coverage for application-layer attacks (Layer
      7) as non-compliance indicators.'
    typical_evidence: • DDoS protection solution • CDN/Cloud protection services • Traffic threshold &
      rate-limiting configuration, Records showing defined thresholds and auto-mitigation rules are in
      place and active. • Incident response procedures
  - urn: urn:intuitem:risk:req_node:ia-sat-ml-nca-ecc:2-5-2
    assessable: true
