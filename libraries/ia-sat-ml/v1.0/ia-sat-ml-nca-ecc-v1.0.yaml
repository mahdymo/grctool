    name: The Entity’s environment, including virtual servers, shall be logically and s…
    description: 'The Entity’s environment, including virtual servers, shall be logically and securely
      segregated from the data and environments of other tenants when using cloud computing and hosting
      services.


      **Implementation guide**


      Verify cloud provider tenant isolation controls, implement additional network segmentation, and
      document shared responsibility model. Use dedicated resources for sensitive workloads.


      **Verification method**


      Verify isolation controls, review provider documentation and implementtion of proper logical segregation'
    typical_evidence: • Tenant isolation requirements • Provider segregation documentation • Network isolation
      evidence • Shared responsibility matrix
  - urn: urn:intuitem:risk:req_node:ia-sat-ml-nca-ecc:3-2-2
