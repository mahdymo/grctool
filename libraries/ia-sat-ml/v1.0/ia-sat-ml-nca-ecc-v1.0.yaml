    description: 'Internet browsing and connectivity shall be secured, including strict restrictions on
      access to suspicious websites, file-sharing websites, file storage platforms, and remote access
      websites.


      **Implementation guide**


      Deploy Secure Web Gateway with URL filtering, SSL inspection, malware scanning, and content filtering.
      Block high-risk categories including file sharing, remote access, and known malicious sites.


      **Verification method**


      Review web filtering configuration, test category blocks'
    typical_evidence: • Web proxy/SWG implementation • URL filtering categories • Block lists and allow
      lists • SSL inspection configuration
