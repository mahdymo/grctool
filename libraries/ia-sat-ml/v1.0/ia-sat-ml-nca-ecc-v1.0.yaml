    ref_id: 2-1-1
    name: Cybersecurity requirements for managing information and technology assets mus…
    description: 'Cybersecurity requirements for managing information and technology assets must be defined,
      documented and approved.


      **Implementation guide**


      Develop asset management policy covering asset identification, classification, ownership, lifecycle
      management, and disposal. Define classification levels aligned with data sensitivity.


      **Verification method**


      Review policy documentation, make sure sure its well defined, documented, approved by the related
      personnel and published to employees'
    typical_evidence: • Approved asset management policy
  - urn: urn:intuitem:risk:req_node:ia-sat-ml-nca-ecc:2-1-2
    assessable: true
    depth: 3
    parent_urn: urn:intuitem:risk:req_node:ia-sat-ml-nca-ecc:domain-2-1
    ref_id: 2-1-2
    name: The cybersecurity requirements for managing information and technology assets…
    description: 'The cybersecurity requirements for managing information and technology assets must be
      implemented.


      **Implementation guide**


      Maintain comprehensive asset inventory including hardware, software, data, and cloud resources.
      Assign owners, classify assets, and track throughout lifecycle. Implement automated discovery tools.


      **Verification method**


      Review asset inventory, verify classification and ownership making sure all changes to asesst and
      owners are reflected to the inventory'
    typical_evidence: • Asset inventory/register • Asset classification records • Ownership assignments
      • Disposal records • CMDB/Asset management system
  - urn: urn:intuitem:risk:req_node:ia-sat-ml-nca-ecc:2-1-3
    assessable: true
    depth: 3
    parent_urn: urn:intuitem:risk:req_node:ia-sat-ml-nca-ecc:domain-2-1
    ref_id: 2-1-3
    name: The Entity shall periodically review the cybersecurity requirements for manag…
    description: 'The Entity shall periodically review the cybersecurity requirements for managing information
      and technology assets.


      **Implementation guide**


      Conduct semi-annual asset inventory reviews and annual policy reviews. Reconcile discovered assets
      with inventory and address discrepancies.


      **Verification method**


      Verify review completion, check inventory accuracy, Sample asset inventory for completeness and
      accuracy of cybersecurity requirements , Interview process owners on execution, trace changes to
      assets, and confirm management oversight through sign-offs'
    typical_evidence: • Inventory review records • Policy review documentation • Asset reconciliation
      reports • Update recommendations
  - urn: urn:intuitem:risk:req_node:ia-sat-ml-nca-ecc:domain-2-2
    assessable: false
