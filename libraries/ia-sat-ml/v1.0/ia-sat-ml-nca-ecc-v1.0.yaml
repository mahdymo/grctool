    name: Requirements for maintaining the confidentiality of the Entity’s information…
    description: 'Requirements for maintaining the confidentiality of the Entity’s information shall be
      included in contracts and agreements with third parties.


      **Implementation guide**


      Define clear contractual confidentiality requirements covering protection, permitted use, sharing
      restrictions, and return/secure destruction of the Entity’s information, including handling of sensitive
      and personal data. Embed these as mandatory clauses in standard contract templates and ensure legal/procurement
      verify they are included and not unduly weakened for all relevant third‑party agreements


      **Verification method**


      Confirm that documented, approved confidentiality clause language exists and is designated as mandatory
      for third‑party contracts. Review a sample of executed contracts to verify that appropriate confidentiality
      requirements are included and aligned with the standard / standard'
    typical_evidence: • Confidentiality clauses in contracts - with sample contracts • NDA templates •
      Data handling requirements • Breach notification clauses
  - urn: urn:intuitem:risk:req_node:ia-sat-ml-nca-ecc:3-1-1-2
