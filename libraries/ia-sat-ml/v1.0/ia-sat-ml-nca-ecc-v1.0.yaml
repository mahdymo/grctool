    name: The Entity shall define, document, and approve cybersecurity requirements rel…
    description: 'The Entity shall define, document, and approve cybersecurity requirements related to
      the use of cloud computing and hosting services. These requirements shall ensure compliance with
      applicable legislative and regulatory requirements in addition to the applicable main cybersecurity
      controls, including Domain 1 (Governance) and Domain 2 (Asset Management) and sub control (3-1)
      that are mandated to protect Entitie''s data and services provided. At a minimum, the cybersecurity
      requirements for cloud computing and hosting services shall include the following:


      **Implementation guide**


      Develop cloud security policy covering provider selection, data classification, access controls,
      and monitoring requirements aligned with NCA Cloud Cybersecurity Controls.


      **Verification method**


      Review policy documentation and approval verify sub-control coverage'
    typical_evidence: • Approved Cloud security policy • Cloud provider requirements
  - urn: urn:intuitem:risk:req_node:ia-sat-ml-nca-ecc:3-2-1-1
    assessable: true
    depth: 4
    parent_urn: urn:intuitem:risk:req_node:ia-sat-ml-nca-ecc:3-2-1
    ref_id: 3-2-1-1
    name: Data shall be classified prior to its use in cloud computing and hosting serv…
    description: 'Data shall be classified prior to its use in cloud computing and hosting services, and
      the Entity shall ensure the ability to retrieve and regain its data in a usable format upon termination
      of the service.


      **Implementation guide**


      Mandate that data must be classified (using the Entity’s classification levels) before approval
      or onboarding of any cloud or hosting service, and record classifications in the cloud/asset register.
      Require contracts and technical designs to ensure data export in standard, interoperable formats
      and to define responsibilities, timelines, and methods for secure data return and deletion at termination.
      Where feasible, test or simulate data retrieval prior to or during the contract to confirm that
      data can actually be recovered in a usable format.


      **Verification method**


      Confirm that documented requirements exist for classifying data before use of cloud/hosting services
      and that they are applied for a sample of in‑scope services. Review selected contracts/SLAs and
      exit/termination procedures to verify they include clear data portability, retrieval, and deletion
      provisions ensuring data can be regained in a usable format. Check for any evidence of data export
      or migration (tests or actual exits) to validate that retrieval works as specified'
    typical_evidence: • Data classification procedure / standard for cloud data • Samples showing application
      of this requirement for selected cloud/hosting services (e.g., cloud assessment forms, data classification
      records, design documents). • Exit strategy documentation • Contractual clauses or exit procedures
      demonstrating the Entity’s right and technical ability to retrieve its data in a usable, non‑proprietary
      format upon termination (e.g., sample contract, exit plan, test or migration record).
  - urn: urn:intuitem:risk:req_node:ia-sat-ml-nca-ecc:3-2-1-2
