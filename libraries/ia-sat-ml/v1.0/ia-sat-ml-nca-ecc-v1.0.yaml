    name: The Entity shall define, document, and approve cybersecurity requirements wit…
    description: 'The Entity shall define, document, and approve cybersecurity requirements within contracts
      and agreements with third parties (including Service Level Agreements – SLAs). These requirements
      shall include, at a minimum, the following:


      **Implementation guide**


      Define minimum cybersecurity requirements that must appear in all relevant third‑party contracts
      and SLAs, such as confidentiality, data protection and secure deletion, incident notification and
      cooperation, compliance with laws and the Entity’s policies, and rights to audit/assess security.
      Document these as standard clauses or templates and ensure procurement, legal, and business owners
      use them when drafting and renewing contracts.


      **Verification method**


      Confirm that documented, approved cybersecurity requirements for third‑party contracts/SLAs exist
      and are available to those negotiating agreements. Review a sample of contracts and SLAs to verify
      these clauses are present and materially aligned with the standard / policy'
    typical_evidence: • Approved Third-party security policy • Sample signed contract/SLA showing included
      cybersecurity clauses (e.g., confidentiality, incident notification, compliance, data handling)
      • SLA templates
  - urn: urn:intuitem:risk:req_node:ia-sat-ml-nca-ecc:3-1-1-1
