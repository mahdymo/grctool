  - urn: urn:intuitem:risk:req_node:ia-sat-ml-nca-ecc:2-2-1
    assessable: true
    depth: 3
    parent_urn: urn:intuitem:risk:req_node:ia-sat-ml-nca-ecc:domain-2-2
    ref_id: 2-2-1
    name: Cybersecurity requirements for identity and access management must be defined…
    description: 'Cybersecurity requirements for identity and access management must be defined, documented,
      approved and must include at least the following:


      **Implementation guide**


      Define IAM requirements covering authentication, authorization, privileged access, and access review
      requirements aligned with industry standards, document these requirements into a well defined identity
      and access management policy obtaining the approval of required personnel - board or senior management-.


      **Verification method**


      Review IAM documentation, verify approvals and reviw records . Interview IAM administrators on enforcement
      and check logs for compliance with the authorization matrix specially for privilaged users'
    typical_evidence: • IAM policy and procedures • Access control standards - if any - • Authentication
      requirements • Authorization matrix • Approval records
  - urn: urn:intuitem:risk:req_node:ia-sat-ml-nca-ecc:2-2-1-1
    assessable: true
    depth: 4
    parent_urn: urn:intuitem:risk:req_node:ia-sat-ml-nca-ecc:2-2-1
    ref_id: 2-2-1-1
    name: User authentication based on username and strong password.
    description: 'User authentication based on username and strong password.


      **Implementation guide**


      Implement password policy requiring minimum 12 characters, complexity (upper, lower, numbers, symbols),
      90-day expiration, history of 12 passwords, and account lockout after 5 failed attempts.


      **Verification method**


      Test password policy enforcement, review configurations'
    typical_evidence: • Password policy • Password complexity requirements • System configuration screenshots
      • Policy enforcement evidence
  - urn: urn:intuitem:risk:req_node:ia-sat-ml-nca-ecc:2-2-1-2
    assessable: true
    depth: 4
    parent_urn: urn:intuitem:risk:req_node:ia-sat-ml-nca-ecc:2-2-1
    ref_id: 2-2-1-2
    name: Multi-factor authentication for remote access including email and external ap…
    description: 'Multi-factor authentication for remote access including email and external applications.


      **Implementation guide**


      Implement MFA for all remote access (VPN, RDP), cloud applications, privileged accounts, and external-facing
      systems. Use authenticator apps, hardware tokens, or biometrics. Make sure these requirements are
      clearly defined in the related policy


      **Verification method**


      Test MFA enforcement, verify coverage and ensure these requirements are documented and approved'
    typical_evidence: • MFA policy • MFA implementation evidence • System configuration for VPN/remote
      access • External application MFA settings
  - urn: urn:intuitem:risk:req_node:ia-sat-ml-nca-ecc:2-2-1-3
    assessable: true
    depth: 4
    parent_urn: urn:intuitem:risk:req_node:ia-sat-ml-nca-ecc:2-2-1
    ref_id: 2-2-1-3
    name: 'User authorization based on identity and access control principles: Need-to-K…'
    description: 'User authorization based on identity and access control principles: Need-to-Know, Need-to-Use,
      Least Privilege and Segregation of Duties.


      **Implementation guide**


      Implement RBAC with documented role definitions, enforce approval workflows for access requests,
      maintain SoD matrix for critical functions, and minimize default permissions.


      **Verification method**


      Review access matrices, test authorization controls. Ensure these requiremnts are well defined and
      approved in the identity and access management policy'
    typical_evidence: • Role-based access control matrix • Access request/approval workflow • Segregation
      of duties matrix • Least privilege implementation evidence
  - urn: urn:intuitem:risk:req_node:ia-sat-ml-nca-ecc:2-2-1-4
    assessable: true
    depth: 4
    parent_urn: urn:intuitem:risk:req_node:ia-sat-ml-nca-ecc:2-2-1
    ref_id: 2-2-1-4
    name: Privileged Access Management
    description: 'Privileged Access Management


      **Implementation guide**


      Implement Privileged Access Management (PAM) solution with credential vaulting, session recording,
      just-in-time access, and privileged account lifecycle management.


      **Verification method**


      Review PAM implementation and session monitoring, verify account inventory and reviw'
    typical_evidence: • PAM solution implementation • Privileged account inventory • Session recording
      evidence • Privileged and Sensitive users review schedule
  - urn: urn:intuitem:risk:req_node:ia-sat-ml-nca-ecc:2-2-1-5
    assessable: true
    depth: 4
    parent_urn: urn:intuitem:risk:req_node:ia-sat-ml-nca-ecc:2-2-1
    ref_id: 2-2-1-5
    name: Periodic review of users' identities and access rights.
    description: 'Periodic review of users'' identities and access rights.


      **Implementation guide**


      Conduct quarterly access reviews for privileged accounts and semi-annual reviews for standard accounts.
      Document and action all findings within 30 days.


      **Verification method**


      verify access rights reviews on time and issues remediation, schedule meetings with access rights
      responsible personnel to check for samples such as the revocation of resigned employees rights.'
    typical_evidence: • Access review schedule • Review completion records • Access modification/revocation
      evidence
  - urn: urn:intuitem:risk:req_node:ia-sat-ml-nca-ecc:2-2-2
    assessable: true
    depth: 3
    parent_urn: urn:intuitem:risk:req_node:ia-sat-ml-nca-ecc:domain-2-2
    ref_id: 2-2-2
    name: The cybersecurity requirements for identity and access management must be imp…
    description: 'The cybersecurity requirements for identity and access management must be implemented.


      **Implementation guide**


      Deploy technical solutions like Active Directory, Okta, or Azure AD integrated with endpoint agents
      for real-time enforcement, automating provisioning/deprovisioning via workflows tied to HR systems
      for lifecycle management. Monitor via SIEM for violations, conduct quarterly access certifications,
      and test via simulations to ensure resilience against common pitfalls like over-privileging or orphaned
      accounts


      **Verification method**


      Sample IAM tool configs and user accounts to confirm requirement enforcement (e.g., MFA on remote
      access, no standing privileges); trace 3-5 recent provisioning events end-to-end. Review sampled
      access certification reports for completeness and management sign-off; validate via joiner/leaver
      testing. Analyze SIEM logs for IAM violations and response evidence. Interview admins on exception
      handling and simulate access revocation to test effectiveness'
    typical_evidence: •Configuration screenshots/policies from IAM tools showing MFA, RBAC, SoD enforcement,
      and PAM sessions • Access provisioning/deprovisioning logs (e.g., joiner/mover/resigned workflows)
      with timestamps and approvals • Quarterly access review reports with certification matrices and
      remediation evidence.
