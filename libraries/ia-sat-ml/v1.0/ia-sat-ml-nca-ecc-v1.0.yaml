    name: The Entity shall implement the approved cybersecurity requirements related to…
    description: 'The Entity shall implement the approved cybersecurity requirements related to cloud
      computing and hosting services.


      **Implementation guide**


      Translate the approved cloud and hosting cybersecurity requirements into concrete design, configuration,
      and contractual controls for all in‑scope services, covering areas such as data classification,
      tenant segregation, identity and access management, logging and monitoring, encryption, backup,
      and exit/portability. Embed these requirements in procurement, solution design, and change management
      so that new and existing cloud/hosting services are assessed and remediated against them


      **Verification method**


      Confirm that approved, documented cybersecurity requirements for cloud and hosting services exist
      and are referenced in relevant policies, standards, and procedures. Review a sample of cloud/hosting
      services (documents, configurations, and contracts) to verify that these requirements are implemented
      in practice and that any deviations are supported by approved exceptions or remediation plans. Examine
      recent assessments or monitoring results to ensure that implementation remains effective and is
      periodically revalidated.'
    typical_evidence: • Sample of cloud/hosting solutions (e.g., major SaaS, IaaS, hosting providers)
      with design/configuration or onboarding documentation showing that the approved requirements have
      been applied (e.g., data classification, segregation, logging, IAM, encryption, exit strategy).
      • Provider compliance verification • Security configuration documentation
  - urn: urn:intuitem:risk:req_node:ia-sat-ml-nca-ecc:3-2-3
