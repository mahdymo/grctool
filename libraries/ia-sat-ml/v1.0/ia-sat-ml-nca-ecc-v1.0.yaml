    ref_id: 1-1-1
    name: A cybersecurity administrative unit shall be established within the organizat…
    description: 'A cybersecurity administrative unit shall be established within the organization. This
      unit shall report to the Head of the Entity or an authorized delegate and shall be independent from
      the Information Technology function.


      **Implementation guide**


      ensure that there is a dedicated cybersecurity unit with clear reporting lines to executive leadership.
      Ensure Cybersecurity is independent from IT operations to maintain objectivity in security oversight.


      **Verification method**


      Review organizational chart meking sure its approved and the cyberseucirty department is established,
      verify reporting lines, confirm cybersecurity independence form IT'
    typical_evidence: • Approved organizational chart showing cybersecurity unit • Reporting structure
      documentation • Independence verification from IT function • Unit establishment approval from Board/CEO
  - urn: urn:intuitem:risk:req_node:ia-sat-ml-nca-ecc:1-1-2
    assessable: true
    depth: 3
    parent_urn: urn:intuitem:risk:req_node:ia-sat-ml-nca-ecc:domain-1-1
    ref_id: 1-1-2
    name: The head of the cybersecurity function and the relevant supervisory roles sha…
    description: 'The head of the cybersecurity function and the relevant supervisory roles shall be staffed
      with Saudi, qualified, competent, and appropriately experienced personnel in the field of cybersecurity.


      **Implementation guide**


      Appoint Saudi nationals with relevant cybersecurity certifications (CISSP, CISM, CEH, etc.), Maintain
      competency records and development plans.


      **Verification method**


      Verify nationality, review certifications, assess experience documentation'
    typical_evidence: • Employment contracts • Saudi nationality verification (National ID) • Professional
      certifications • CV/Resume with cybersecurity experience • Job descriptions • Background check records
      • Training and development plans
  - urn: urn:intuitem:risk:req_node:ia-sat-ml-nca-ecc:1-1-3
    assessable: true
    depth: 3
    parent_urn: urn:intuitem:risk:req_node:ia-sat-ml-nca-ecc:domain-1-1
    ref_id: 1-1-3
    name: The authorized owner shall define, document, and approve the governance frame…
    description: 'The authorized owner shall define, document, and approve the governance framework, organizational
      structure, roles, and responsibilities related to cybersecurity within the organization, assign
      the relevant personnel, and provide the necessary support for enforcement, taking conflicts of interest
      into consideration.


      **Implementation guide**


      Develop comprehensive governance framework defining cybersecurity roles (CISO, Security Analysts,
      etc.), responsibilities, and decision-making authority. Make sure qualified personnel hold related
      positions and Include conflict of interest declarations and segregation of duties.


      **Verification method**


      Review governance documentation make sure its current and approved, verify role assignments, check
      conflict declarations'
    typical_evidence: '• Approved Cybersecurity governance framework document • Organizational structure
      : cybersecurity org chart, reporting lines (including escalation path to top management/board where
      applicable) • Roles & responsibilities documentation: RACI matrix for cybersecurity • Conflict-of-interest
      / segregation-of-duties rules and application (SoD matrix or documented rule)'
  - urn: urn:intuitem:risk:req_node:ia-sat-ml-nca-ecc:domain-1-2
    assessable: false
    depth: 2
    parent_urn: urn:intuitem:risk:req_node:ia-sat-ml-nca-ecc:root
    ref_id: 1-2
    name: Cybersecurity Policies and Procedures
  - urn: urn:intuitem:risk:req_node:ia-sat-ml-nca-ecc:1-2-1
    assessable: true
    depth: 3
    parent_urn: urn:intuitem:risk:req_node:ia-sat-ml-nca-ecc:domain-1-2
    ref_id: 1-2-1
    name: Cybersecurity policies must be defined, documented, approved, disseminated to…
    description: 'Cybersecurity policies must be defined, documented, approved, disseminated to employees
      (e.g., cybersecurity policy).


      **Implementation guide**


      Develop comprehensive cybersecurity policies covering acceptable use, data handling, incident reporting,
      access control, and remote work. Ensure policies are approved by senior management and distributed
      to all employees with acknowledgment tracking.


      **Verification method**


      Review policy documents, verify approval signatures and review cycles, check dissemination records'
    typical_evidence: • Cybersecurity policies • Policy approval records • Policy dissemination evidence
      • Employee acknowledgment records • Policy version control
  - urn: urn:intuitem:risk:req_node:ia-sat-ml-nca-ecc:1-2-2
    assessable: true
    depth: 3
    parent_urn: urn:intuitem:risk:req_node:ia-sat-ml-nca-ecc:domain-1-2
    ref_id: 1-2-2
    name: The cybersecurity function/role must ensure that the cybersecurity policies a…
    description: 'The cybersecurity function/role must ensure that the cybersecurity policies are implemented.


      **Implementation guide**


      Establish mechanisms to monitor and enforce policy compliance including automated controls, periodic
      assessments, and exception management processes.


      **Verification method**


      Review compliance monitoring reports, verify enforcement mechanisms'
    typical_evidence: • Compliance monitoring reports & KPI's • Non-compliance tracking and remediation
      • Exceptions register (formal log of deviations with approvals and compensating controls) • sample
      execution proof (e.g., logs/reports tied to a key policy like access management)
  - urn: urn:intuitem:risk:req_node:ia-sat-ml-nca-ecc:1-2-3
    assessable: true
    depth: 3
    parent_urn: urn:intuitem:risk:req_node:ia-sat-ml-nca-ecc:domain-1-2
    ref_id: 1-2-3
    name: The cybersecurity administrative unit shall periodically review the cybersecu…
    description: 'The cybersecurity administrative unit shall periodically review the cybersecurity policies
      of the organization.


      **Implementation guide**


      Establish annual (minimum) policy review cycle with documented review process, stakeholder input,
      and update approval workflow. Track all policy changes and maintain version history.


      **Verification method**


      Verify review schedule adherence making sure policies are reviewed on time by the relevent stakeholders.'
    typical_evidence: • Policy review schedule • Policy change logs • Annual review completion records
  - urn: urn:intuitem:risk:req_node:ia-sat-ml-nca-ecc:domain-1-3
    assessable: false
    depth: 2
    parent_urn: urn:intuitem:risk:req_node:ia-sat-ml-nca-ecc:root
    ref_id: 1-3
