    name: Wireless networks shall be protected using secure mechanisms, including stron…
    description: 'Wireless networks shall be protected using secure mechanisms, including strong authentication
      and encryption techniques, to ensure secure access.


      **Implementation guide**


      Implement WPA3 or WPA2-Enterprise with 802.1X authentication. Isolate guest networks, disable WPS,
      hide SSIDs for sensitive networks, and conduct regular wireless security assessments.


      **Verification method**


      Review wireless configurations to confirm WPA3 or WPA2-Enterprise is enforced and that no open or
      WEP/WPA(TKIP) networks exist. Verify that corporate and guest networks are logically segregated
      and that default credentials have been changed on all access points. Confirm that periodic rogue
      access point scans are conducted and documented. Flag any use of weak encryption protocols, missing
      network segmentation, or absence of authentication controls as non-compliance indicators.'
    typical_evidence: • Wireless security policy • WPA3/WPA2-Enterprise configuration • RADIUS/802.1X
      implementation • Guest network isolation
