    ref_id: 1-4-1
    name: Cybersecurity controls shall be reviewed and audited by a party independent f…
    description: 'Cybersecurity controls shall be reviewed and audited by a party independent from the
      cybersecurity administrative unit within the Entity, in accordance with what is determined by the
      Authority, to assess the Entity’s compliance with the cybersecurity controls applicable to non-critical
      private sector entities.


      **Implementation guide**


      Engage internal audit or qualified third-party auditor (independent from cybersecurity function)
      to conduct annual compliance assessment against NCA NCNICC requirements. Track and remediate findings.


      **Verification method**


      Review audit reports ensuring they are being conducted on planned intervals, verify auditor independence.'
    typical_evidence: • Independent audit reports • Auditor independence declaration • NCA compliance
      assessment
  - urn: urn:intuitem:risk:req_node:ia-sat-ml-nca-ecc:1-4-2
    assessable: true
    depth: 3
    parent_urn: urn:intuitem:risk:req_node:ia-sat-ml-nca-ecc:domain-1-4
    ref_id: 1-4-2
    name: The cybersecurity administrative unit within the Entity shall periodically re…
    description: 'The cybersecurity administrative unit within the Entity shall periodically review the
      implementation of cybersecurity controls.


      **Implementation guide**


      Conduct annual self-assessments of cybersecurity control implementation with documented testing
      methodology and improvement tracking.


      **Verification method**


      Review self-assessment documentation, verify testing evidence and Interview unit staff on process
      execution, validate via control owner confirmations or system logs. Assess frequency adherence and
      coverage of all applicable NCNICC controls'
    typical_evidence: • Control effectiveness reviews, reports with scope, observations, recommendations,
      remediation plans, and status updates.
  - urn: urn:intuitem:risk:req_node:ia-sat-ml-nca-ecc:domain-1-5
