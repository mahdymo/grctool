    name: Network firewalls and secure access gateways shall be implemented to protect…
    description: 'Network firewalls and secure access gateways shall be implemented to protect the Entity’s
      networks and control network traffic.


      **Implementation guide**


      Deploy next-generation firewalls at network perimeter and internal segmentation points. Implement
      secure access gateways at all external-facing entry points and harden all configurations against
      a recognized baseline (e.g., CIS Benchmarks). Firewall rules must be formally documented, business-justified,
      and reviewed at least annually. All traffic events should be logged and forwarded to a monitoring
      or SIEM solution.


      **Verification method**


      Confirm that firewalls and gateways are deployed at all network boundaries and review the ruleset
      for a default-deny posture and absence of overly permissive rules (e.g., ANY/ANY). Flag any ANY/ANY
      rules, unreviewed rulesets older than 12 months, or missing logging as non-compliance indicators.'
    typical_evidence: • Firewall deployment , List of deployed firewalls and gateways with placement details
      (perimeter, DMZ, internal). • Firewall rule sets, approved ruleset confirming default-deny posture,
      rule justifications, and last review date. • Gateway configuration • Rule review records
