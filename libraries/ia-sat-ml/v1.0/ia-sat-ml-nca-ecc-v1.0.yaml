      **Implementation guide**


      Develop comprehensive data protection policy covering classification, handling, storage, transmission,
      and disposal aligned with PDPL and sector regulations.


      **Verification method**


      Confirm that documented, approved data protection and handling requirements exist and clearly reference
      applicable legal/regulatory obligations. Check that classification and handling rules are defined
      and used in practice (e.g., in procedures/templates)'
    typical_evidence: • Data protection policy • Data classification policy • Data handling procedures
      • Regulatory compliance mapping
  - urn: urn:intuitem:risk:req_node:ia-sat-ml-nca-ecc:2-7-1-1
    assessable: true
    depth: 4
    parent_urn: urn:intuitem:risk:req_node:ia-sat-ml-nca-ecc:2-7-1
    ref_id: 2-7-1-1
    name: Data leakage prevention (DLP) and rights management technologies must be used.
    description: 'Data leakage prevention (DLP) and rights management technologies must be used.


      **Implementation guide**


      Deploy DLP solution covering endpoints, network, and cloud with content inspection rules. Implement
      Information Rights Management for sensitive documents. Monitor and respond to DLP incidents.


      **Verification method**


      Confirm that DLP and rights management tools are implemented and enabled on relevant channels. Review
      a sample of policies and incident/activity reports to verify they cover sensitive data types and
      are actively detecting or blocking leakage attempts'
    typical_evidence: • DLP solution implementation • DLP policy rules • Rights Management (IRM) configuration
      • Incident reports
  - urn: urn:intuitem:risk:req_node:ia-sat-ml-nca-ecc:2-7-1-2
    assessable: true
    depth: 4
    parent_urn: urn:intuitem:risk:req_node:ia-sat-ml-nca-ecc:2-7-1
    ref_id: 2-7-1-2
    name: Brand protection services shall be used to protect the Entity’s identity from…
    description: 'Brand protection services shall be used to protect the Entity’s identity from impersonation
      and misuse.


      **Implementation guide**


      Subscribe to brand protection services for domain monitoring, phishing site detection, and social
      media impersonation monitoring. Establish takedown procedures for identified abuse.


      **Verification method**


      Verify service subscription, review monitoring reports'
    typical_evidence: • Brand protection service subscription • Domain monitoring reports • Social media
      monitoring
  - urn: urn:intuitem:risk:req_node:ia-sat-ml-nca-ecc:2-7-1-3
    assessable: true
    depth: 4
    parent_urn: urn:intuitem:risk:req_node:ia-sat-ml-nca-ecc:2-7-1
    ref_id: 2-7-1-3
    name: The secure use of printers, scanners, cameras, and imaging devices.
    description: 'The secure use of printers, scanners, cameras, and imaging devices.


      **Implementation guide**


      Implement secure print (badge release), disable USB on public printers, restrict access to high-volume
      scanners, and log all print/scan activities for sensitive areas.


      **Verification method**


      Confirm that requirements governing these devices and their use with sensitive data are documented
      and approved. Check a sample of device configurations and physical setups'
    typical_evidence: • Policy/standard for use of printers, scanners, cameras, and imaging devices •Configuration
      or access control settings for shared printers/scanners (sample)
  - urn: urn:intuitem:risk:req_node:ia-sat-ml-nca-ecc:2-7-1-4
    assessable: true
    depth: 4
    parent_urn: urn:intuitem:risk:req_node:ia-sat-ml-nca-ecc:2-7-1
    ref_id: 2-7-1-4
    name: Secure re-usage and disposal of original documents and copies, including pape…
    description: 'Secure re-usage and disposal of original documents and copies, including paper records
      and physical storage media


      **Implementation guide**


      Implement secure document storage (locked cabinets, restricted areas), clean desk policy, secure
      shredding for disposal, and tracked destruction for storage media.


      **Verification method**


      Confirm documented procedures exist for handling physical records and media and that secure storage
      is in place. Review a sample of locations and logs (or equivalent records) to verify controlled
      access and proper disposal'
    typical_evidence: • Physical records/media protection and handling policy/procedure • Evidence of
      secure storage (e.g., access-controlled rooms/cabinets) • Media/records tracking or log (e.g., issuance/return/destruction)
  - urn: urn:intuitem:risk:req_node:ia-sat-ml-nca-ecc:2-7-2
    assessable: true
    depth: 3
    parent_urn: urn:intuitem:risk:req_node:ia-sat-ml-nca-ecc:domain-2-7
    ref_id: 2-7-2
    name: The Entity shall implement the cybersecurity requirements for protecting data…
    description: 'The Entity shall implement the cybersecurity requirements for protecting data and information.


      **Implementation guide**


      Implement tiered controls based on classification: public (minimal), internal (standard), confidential
      (enhanced), restricted (maximum). Verify implementation through regular assessments.


      **Verification method**


      Confirm that classification and corresponding protection requirements are documented and approved.
      Review a sample of systems/documents from different classification levels to verify that the required
      controls are applied in practice'
    typical_evidence: • Approved data classification policy/standard • Data classification scheme with
      handling requirements per level • Sample evidence of applied protections (e.g., labels, encryption,
      access controls)
  - urn: urn:intuitem:risk:req_node:ia-sat-ml-nca-ecc:2-7-3
    assessable: true
    depth: 3
    parent_urn: urn:intuitem:risk:req_node:ia-sat-ml-nca-ecc:domain-2-7
    ref_id: 2-7-3
    name: The Entity shall periodically review the cybersecurity requirements for prote…
    description: 'The Entity shall periodically review the cybersecurity requirements for protecting data
      and information.


      **Implementation guide**


      Conduct annual data protection policy review and control assessments. Update requirements based
      on regulatory changes and incidents.'
    typical_evidence: • Policy review documentation
  - urn: urn:intuitem:risk:req_node:ia-sat-ml-nca-ecc:domain-2-8
    assessable: false
    depth: 2
    parent_urn: urn:intuitem:risk:req_node:ia-sat-ml-nca-ecc:root
    ref_id: 2-8
    name: Cryptography
  - urn: urn:intuitem:risk:req_node:ia-sat-ml-nca-ecc:2-8-1
    assessable: true
    depth: 3
    parent_urn: urn:intuitem:risk:req_node:ia-sat-ml-nca-ecc:domain-2-8
    ref_id: 2-8-1
    name: The Entity shall define, document, and approve cybersecurity requirements for…
    description: 'The Entity shall define, document, and approve cybersecurity requirements for cryptography.
      These requirements shall include, at a minimum, the following:


      **Implementation guide**


      Develop cryptography policy aligned with NCA National Cryptographic Standards covering algorithm
      selection, key management, and implementation requirements.


      **Verification method**


      Confirm a documented, approved cryptography policy exists and explicitly references NCS-1 and approved
      algorithms/key strengths and key management practices. Check a sample of systems or solutions using
      cryptography to see if they follow these requirements, and treat any use of non-approved algorithms,
      key sizes, or ad-hoc crypto as gaps.'
    typical_evidence: • Cryptography policy • Key management procedures • Reference to NCA National Cryptographic
      Standards (NCS-1:2020)
  - urn: urn:intuitem:risk:req_node:ia-sat-ml-nca-ecc:2-8-1-1
    assessable: true
    depth: 4
    parent_urn: urn:intuitem:risk:req_node:ia-sat-ml-nca-ecc:2-8-1
    ref_id: 2-8-1-1
    name: Encryption shall be used to protect data during storage and transmission.
    description: 'Encryption shall be used to protect data during storage and transmission.


      **Implementation guide**


      Implement AES-256 for data at rest (full disk encryption, database encryption), TLS 1.2+ for data
      in transit, and certificate management. Encrypt all sensitive data stores.


      **Verification method**


      Confirm documented requirements mandate encryption for stored and transmitted sensitive data. Review
      a sample of systems and network connections to verify encryption is actually enabled (e.g., disk/database
      encryption, TLS/VPN in use) and record any unencrypted sensitive data or plaintext channels as gaps.'
    typical_evidence: • Encryption policy/standard (covering data at rest and in transit) •Sample system
      configurations or design docs showing encryption enabled • Sample evidence of encrypted channels
      (e.g., TLS certificates, connection settings)
  - urn: urn:intuitem:risk:req_node:ia-sat-ml-nca-ecc:2-8-1-2
    assessable: true
    depth: 4
    parent_urn: urn:intuitem:risk:req_node:ia-sat-ml-nca-ecc:2-8-1
    ref_id: 2-8-1-2
    name: Secure and up-to-date cryptographic methods and algorithms shall be used when…
    description: 'Secure and up-to-date cryptographic methods and algorithms shall be used when creating,
      storing, processing, and transmitting data, and for securing all network communications, in accordance
      with the requirements of the National Cryptographic Standards issued by the Authority (baseline
      level).


      **Implementation guide**


      Define approved algorithms, key sizes, and protocols based on the NCA National Cryptographic Standards
      (baseline level) and prohibit weak or deprecated methods. Apply these approved methods across applications,
      databases, storage, and network communications, and update configurations when standards are revised.


      **Verification method**


      Confirm a documented cryptography standard exists that aligns with NCA baseline requirements and
      lists approved algorithms/protocols. Review a sample of systems and network services to verify only
      approved methods are used, flagging any deprecated or non-approved algorithms, key sizes, or protocols
      as gaps.'
    typical_evidence: • Approved cryptography policy/standard referencing NCA National Cryptographic Standards
      (baseline level) • List or register of approved algorithms, key lengths, and protocols in use •
      Sample system/network configs showing use of approved algorithms and protocols
  - urn: urn:intuitem:risk:req_node:ia-sat-ml-nca-ecc:2-8-2
    assessable: true
    depth: 3
    parent_urn: urn:intuitem:risk:req_node:ia-sat-ml-nca-ecc:domain-2-8
    ref_id: 2-8-2
    name: The Entity shall implement the approved cybersecurity requirements for crypto…
    description: 'The Entity shall implement the approved cybersecurity requirements for cryptography.


      **Implementation guide**


      Convert the approved cryptography requirements (algorithms, key sizes, key management, and use cases)
      into practical configuration baselines for applications, databases, storage, and network services,
      and enforce them through design and change processes.


      **Verification method**


      Check that approved cryptography requirements exist and are shared with implementation teams, review
      a sample of systems and services to verify configurations follow these requirements'
    typical_evidence: • Sample system/network configurations applying those cryptography requirements.
      • Evidence of periodic crypto/configuration review (e.g., checklist or report). • Key management
      records.
  - urn: urn:intuitem:risk:req_node:ia-sat-ml-nca-ecc:2-8-3
    assessable: true
    depth: 3
    parent_urn: urn:intuitem:risk:req_node:ia-sat-ml-nca-ecc:domain-2-8
    ref_id: 2-8-3
    name: The Entity shall periodically review the cybersecurity requirements for crypt…
    description: 'The Entity shall periodically review the cybersecurity requirements for cryptography.


      **Implementation guide**


      Conduct annual cryptography policy review and algorithm strength assessment. Update standards based
      on cryptographic developments and NCA guidance.


      **Verification method**


      Verify review completion, assess algorithm currency'
    typical_evidence: • Policy review documentation • Algorithm strength assessment • Key rotation records
  - urn: urn:intuitem:risk:req_node:ia-sat-ml-nca-ecc:domain-2-9
    assessable: false
    depth: 2
    parent_urn: urn:intuitem:risk:req_node:ia-sat-ml-nca-ecc:root
    ref_id: 2-9
    name: Backup and Recovery Management
  - urn: urn:intuitem:risk:req_node:ia-sat-ml-nca-ecc:2-9-1
    assessable: true
    depth: 3
    parent_urn: urn:intuitem:risk:req_node:ia-sat-ml-nca-ecc:domain-2-9
    ref_id: 2-9-1
    name: The Entity shall define, document, and approve cybersecurity requirements for…
    description: 'The Entity shall define, document, and approve cybersecurity requirements for backup
      management. These requirements shall include, at a minimum, the following:


      **Implementation guide**


      Define what must be backed up, backup frequency, retention, storage locations (including offsite),
      encryption, and access control, plus recovery time/point objectives. Document these as a formal,
      approved backup management policy/standard and ensure they align with business and regulatory requirements.


      **Verification method**


      Confirm a documented, approved backup management policy exists, clearly specifying scope, frequency,
      retention, and storage requirements. Check that backup procedures and configurations are consistent
      with this policy and flag any missing coverage'
    typical_evidence: • Approved backup and recovery policy/standard and procedure • Documented backup
      schedule and retention rules • Approval records
  - urn: urn:intuitem:risk:req_node:ia-sat-ml-nca-ecc:2-9-1-1
    assessable: true
    depth: 4
    parent_urn: urn:intuitem:risk:req_node:ia-sat-ml-nca-ecc:2-9-1
    ref_id: 2-9-1-1
    name: Backups shall be performed regularly for business-critical systems
    description: 'Backups shall be performed regularly for business-critical systems


      **Implementation guide**


      Implement automated daily backups for critical systems and sensitive information , weekly full backups,
      and encrypted offsite/cloud copies. Follow 3-2-1 rule (3 copies, 2 media types, 1 offsite).


      **Verification method**


      Confirm that backups are configured and running for identified critical systems and sensitive data
      by reviewing schedules and recent backup reports. Check evidence of at least one successful restore
      test'
    typical_evidence: • Backup job configurations or schedules for critical systems • Recent backup job/status
      reports (showing success/failures) • Evidence of at least one recent restore test for a critical
      system or data set
  - urn: urn:intuitem:risk:req_node:ia-sat-ml-nca-ecc:2-9-1-2
    assessable: true
    depth: 4
    parent_urn: urn:intuitem:risk:req_node:ia-sat-ml-nca-ecc:2-9-1
    ref_id: 2-9-1-2
    name: Periodic testing shall be conducted to verify the effectiveness and reliabili…
    description: 'Periodic testing shall be conducted to verify the effectiveness and reliability of backup
      restoration processes.


      **Implementation guide**


      Define a schedule and process for performing backup restore tests for critical systems and data,
      including success criteria and responsibilities. Perform test restores (full and/or partial) periodically
      and after major changes, and address any issues identified.


      **Verification method**


      Confirm documented procedures exist for periodic restore testing and that tests are planned for
      critical systems. Review evidence of recent restore tests and corresponding results'
    typical_evidence: • Backup restore test procedures or plan • Evidence of recent restore tests (logs/reports)
      • Documented results and actions on issues found
  - urn: urn:intuitem:risk:req_node:ia-sat-ml-nca-ecc:2-9-2
    assessable: true
    depth: 3
    parent_urn: urn:intuitem:risk:req_node:ia-sat-ml-nca-ecc:domain-2-9
    ref_id: 2-9-2
    name: The Entity shall implement the approved cybersecurity requirements for backup…
    description: 'The Entity shall implement the approved cybersecurity requirements for backup management.


      **Implementation guide**


      Apply the approved backup requirements (scope, frequency, retention, storage, security) to all in-scope
      systems and data, especially business-critical and sensitive information. Ensure backup jobs are
      configured accordingly, monitored regularly, and updated when systems or requirements change.


      **Verification method**


      Confirm the approved backup requirements exist and clearly apply to the systems reviewed. Check
      a sample of backup configurations and reports to verify they follow these requirement'
    typical_evidence: • Backup solution implementation • Sample backup configurations/schedules for critical
      systems • Recent backup monitoring/report showing status of jobs
  - urn: urn:intuitem:risk:req_node:ia-sat-ml-nca-ecc:2-9-3
    assessable: true
    depth: 3
    parent_urn: urn:intuitem:risk:req_node:ia-sat-ml-nca-ecc:domain-2-9
    ref_id: 2-9-3
    name: The Entity shall periodically review the cybersecurity requirements for backu…
    description: 'The Entity shall periodically review the cybersecurity requirements for backup management.


      **Implementation guide**


      Define a review frequency (e.g., annually or after major changes) for backup management requirements
      and assign clear ownership. During each review, validate that backup scope, frequency, retention,
      storage, and security still meet business, regulatory, and technical needs, and update and re-approve
      the document as required.


      **Verification method**


      Confirm that the backup management requirements specify a periodic review and responsible owner.
      Check evidence of recent reviews (dates, decisions, updates) and ensure the current approved version
      reflects those changes'
    typical_evidence: • Policy review documentation • Coverage assessment • Technology evaluation
  - urn: urn:intuitem:risk:req_node:ia-sat-ml-nca-ecc:domain-2-10
    assessable: false
    depth: 2
    parent_urn: urn:intuitem:risk:req_node:ia-sat-ml-nca-ecc:root
    ref_id: 2-10
    name: Vulnerabilities Management
  - urn: urn:intuitem:risk:req_node:ia-sat-ml-nca-ecc:2-10-1
    assessable: true
    depth: 3
    parent_urn: urn:intuitem:risk:req_node:ia-sat-ml-nca-ecc:domain-2-10
    ref_id: 2-10-1
    name: The Entity shall define, document, and approve cybersecurity requirements for…
    description: 'The Entity shall define, document, and approve cybersecurity requirements for managing
      technical vulnerabilities. These requirements shall include, at a minimum, the following:


      **Implementation guide**


      Develop vulnerability management policy covering scanning, prioritization, patching, remediation
      timelines, and exception management aligned with industry standards.


      **Verification method**


      Confirm a documented, approved vulnerability management policy and process exist, clearly covering
      discovery, assessment, and remediation timelines. Check that these requirements are applied in practice
      (e.g., referenced in procedures or tools)'
    typical_evidence: • Approved vulnerability management policy/standard • Documented process/procedure
      for scanning, assessment, patching and remediation
  - urn: urn:intuitem:risk:req_node:ia-sat-ml-nca-ecc:2-10-1-1
    assessable: true
    depth: 4
    parent_urn: urn:intuitem:risk:req_node:ia-sat-ml-nca-ecc:2-10-1
    ref_id: 2-10-1-1
    name: Systems, software, and devices shall be updated and patched regularly in a ti…
    description: 'Systems, software, and devices shall be updated and patched regularly in a timely manner
      (Patch Management) to address identified vulnerabilities.


      **Implementation guide**


      Establish a structured patch management process with defined timelines based on vulnerability/patch
      criticality and asset importance. Use centralized tools where possible to deploy patches, monitor
      status, and ensure all in-scope systems are regularly updated.


      **Verification method**


      Confirm a documented patch management standard exists with clear timelines and scope. Review recent
      patch reports and a sample of systems to verify patches are applied in line with requirements'
    typical_evidence: • Patch management process • Patching schedule • Patch deployment records • Exception
      documentation
  - urn: urn:intuitem:risk:req_node:ia-sat-ml-nca-ecc:2-10-1-2
    assessable: true
    depth: 4
    parent_urn: urn:intuitem:risk:req_node:ia-sat-ml-nca-ecc:2-10-1
    ref_id: 2-10-1-2
    name: Technical vulnerabilities shall be periodically scanned and identified across…
    description: 'Technical vulnerabilities shall be periodically scanned and identified across all of
      the Entity’s assets.


      **Implementation guide**


      Define how often different asset types are scanned (e.g., servers, endpoints, network devices, applications)
      and ensure all in-scope assets are included using an updated asset inventory. Use approved tools
      to run regular authenticated scans and ensure results feed into the vulnerability management process.


      **Verification method**


      Confirm documented scanning requirements exist and cover all relevant asset categories. Review recent
      scan reports and asset lists to verify that scans are performed at the defined frequency and that
      coverage is complete'
    typical_evidence: •Vulnerability scanning procedure/plan (including frequency and scope) •Recent vulnerability
      scan reports covering key asset groups •Evidence of asset coverage (e.g., CMDB extract or asset
      list mapped to scans)
  - urn: urn:intuitem:risk:req_node:ia-sat-ml-nca-ecc:2-10-1-3
    assessable: true
    depth: 4
    parent_urn: urn:intuitem:risk:req_node:ia-sat-ml-nca-ecc:2-10-1
    ref_id: 2-10-1-3
    name: External applications shall be periodically scanned to identify technical vul…
    description: 'External applications shall be periodically scanned to identify technical vulnerabilities.


      **Implementation guide**


      Identify all internet-facing applications and define how often they must be scanned using approved
      tools or services. Schedule and perform regular scans (and after major changes) and feed findings
      into the vulnerability management and remediation process.


      **Verification method**


      Confirm that documented requirements exist for periodic scanning of external applications and that
      an inventory with a scan schedule is maintained. Review recent scan reports to ensure they cover
      the identified external apps at the defined frequency'
    typical_evidence: •Documented procedure/plan for external application vulnerability scanning •Recent
      external application scan reports (e.g., web app or external IPs) •List of in-scope external applications/URLs
      with scan schedule • Remediation evidence
  - urn: urn:intuitem:risk:req_node:ia-sat-ml-nca-ecc:2-10-1-4
    assessable: true
    depth: 4
    parent_urn: urn:intuitem:risk:req_node:ia-sat-ml-nca-ecc:2-10-1
    ref_id: 2-10-1-4
    name: Identified vulnerabilities shall be managed and remediated based on their cla…
    description: 'Identified vulnerabilities shall be managed and remediated based on their classification
      and risk level, including testing vulnerability fixes prior to deployment.


      **Implementation guide**


      Classify vulnerabilities by severity and business risk, set remediation targets per level, and track
      them through a formal process or tool. Test patches or fixes in a controlled environment before
      deployment to production, then apply them within defined timelines and update records accordingly.


      **Verification method**


      Confirm documented procedures require risk-based remediation and pre-deployment testing of fixes.
      Review a sample of vulnerabilities and associated changes to verify they are classified, tested,
      and closed within required timelines'
    typical_evidence: •Vulnerability management/patching procedure defining risk-based remediation timelines
      and testing •Sample vulnerability tracking log or tickets showing classification and status •Evidence
      of testing for fixes/patches before production deployment (e.g., UAT/change records)
  - urn: urn:intuitem:risk:req_node:ia-sat-ml-nca-ecc:2-10-2
    assessable: true
    depth: 3
    parent_urn: urn:intuitem:risk:req_node:ia-sat-ml-nca-ecc:domain-2-10
    ref_id: 2-10-2
    name: The Entity shall implement the approved cybersecurity requirements for managi…
    description: 'The Entity shall implement the approved cybersecurity requirements for managing technical
      vulnerabilities.


      **Implementation guide**


      Apply the approved vulnerability management requirements across in-scope assets, ensuring regular
      scanning, risk-based analysis, and remediation within defined timelines. Integrate the process with
      change management so fixes are properly tested, deployed, and documented.


      **Verification method**


      Confirm the approved vulnerability management requirements exist and are communicated to relevant
      teams. Review scan results, tracking records, and related changes for a sample of vulnerabilities
      to verify that identification, prioritization, and remediation follow the defined requirements'
    typical_evidence: •Approved vulnerability management policy/standard •Sample vulnerability scan and
      tracking records showing remediation progress •Evidence of applied remediation actions (e.g., changes/patch
      records for selected vulnerabilities)
  - urn: urn:intuitem:risk:req_node:ia-sat-ml-nca-ecc:2-10-3
    assessable: true
    depth: 3
    parent_urn: urn:intuitem:risk:req_node:ia-sat-ml-nca-ecc:domain-2-10
    ref_id: 2-10-3
    name: The Entity shall periodically review the cybersecurity requirements for manag…
    description: 'The Entity shall periodically review the cybersecurity requirements for managing technical
      vulnerabilities.


      **Implementation guide**


      Conduct annual vulnerability management policy review and process effectiveness assessments. Update
      based on threat landscape changes.


      **Verification method**


      Confirm the vulnerability management requirements specify periodic review and a responsible owner.
      Check evidence of recent reviews and updates (dates, decisions, document versions)'
    typical_evidence: • Vulnerability management policy/standard showing defined review frequency and
      owner
  - urn: urn:intuitem:risk:req_node:ia-sat-ml-nca-ecc:domain-2-11
    assessable: false
    depth: 2
    parent_urn: urn:intuitem:risk:req_node:ia-sat-ml-nca-ecc:root
    ref_id: 2-11
    name: Penetration Testing
  - urn: urn:intuitem:risk:req_node:ia-sat-ml-nca-ecc:2-11-1
    assessable: true
    depth: 3
    parent_urn: urn:intuitem:risk:req_node:ia-sat-ml-nca-ecc:domain-2-11
    ref_id: 2-11-1
    name: The entity must define, document and approve the cybersecurity requirements f…
    description: 'The entity must define, document and approve the cybersecurity requirements for penetration
      testing. The scope must cover at least all externally provided services (via internet) and their
      technical components including: -Technical infrastructure components -Websites -Web applications
      -Mobile applications -Email services -Remote access services


      **Implementation guide**


      Define that periodic penetration testing must cover all internet-facing services at minimum: technical
      infrastructure (external IPs, firewalls, gateways), websites, web and mobile applications, email,
      and remote access services. Maintain an up-to-date inventory of these services and ensure each round
      of testing explicitly includes and reports on all of them.


      **Verification method**


      Check that the penetration testing standard clearly states this minimum scope and that an inventory
      of external services exists. Compare the inventory to recent test reports to verify all required
      components are included'
    typical_evidence: • Penetration testing policy/standard defining mandatory scope for external services
      • Latest external penetration test report covering listed components • Inventory/list of internet-facing
      services mapped to penetration testing scope
  - urn: urn:intuitem:risk:req_node:ia-sat-ml-nca-ecc:2-11-2
    assessable: true
    depth: 3
    parent_urn: urn:intuitem:risk:req_node:ia-sat-ml-nca-ecc:domain-2-11
    ref_id: 2-11-2
    name: The Entity shall implement the approved cybersecurity requirements for penetr…
    description: 'The Entity shall implement the approved cybersecurity requirements for penetration testing
      activities.


      **Implementation guide**


      Engage qualified penetration testing firm for annual testing. Document findings, prioritize remediation,
      and verify fixes through retesting.


      **Verification method**


      Confirm the approved penetration testing requirements exist and are communicated to relevant teams.
      Review recent test plans, reports, and remediation records to verify that testing is performed as
      required and that findings are addressed'
    typical_evidence: • Penetration test reports • Vendor qualifications • Finding remediation evidence
      • Retest results
  - urn: urn:intuitem:risk:req_node:ia-sat-ml-nca-ecc:2-11-3
    assessable: true
    depth: 3
    parent_urn: urn:intuitem:risk:req_node:ia-sat-ml-nca-ecc:domain-2-11
    ref_id: 2-11-3
    name: The Entity shall periodically review the cybersecurity requirements for penet…
    description: 'The Entity shall periodically review the cybersecurity requirements for penetration
      testing activities.


      **Implementation guide**


      Conduct annual penetration testing policy review and assess scope against infrastructure changes.


      **Verification method**


      Verify review completion, assess scope adequacy'
    typical_evidence: • Policy / Standard review documentation • Scope assessment
  - urn: urn:intuitem:risk:req_node:ia-sat-ml-nca-ecc:domain-2-12
    assessable: false
    depth: 2
    parent_urn: urn:intuitem:risk:req_node:ia-sat-ml-nca-ecc:root
    ref_id: 2-12
    name: Cybersecurity Event Logs and Monitoring Management
  - urn: urn:intuitem:risk:req_node:ia-sat-ml-nca-ecc:2-12-1
    assessable: true
    depth: 3
    parent_urn: urn:intuitem:risk:req_node:ia-sat-ml-nca-ecc:domain-2-12
    ref_id: 2-12-1
    name: The Entity shall define, document, and approve cybersecurity requirements for…
    description: 'The Entity shall define, document, and approve cybersecurity requirements for managing
      and monitoring cybersecurity event logs. These requirements shall include, at a minimum, the following:


      **Implementation guide**


      Define what events must be logged (e.g., auth, admin actions, security events), which systems must
      send logs to a central platform/SIEM, log retention, protection, and review/alerting requirements,
      aligned with NCA’s event logs and monitoring standard and general good practice. Document these
      requirements in a formal policy/standard, assign clear ownership, and obtain management approval
      and communication


      **Verification method**


      Confirm that a documented, approved logging and monitoring standard exists specifying log sources,
      required events, retention, and review/alert rules. Check that it is current (reviewed as scheduled)
      and used as the reference for actual logging configurations'
    typical_evidence: • Approved logging and monitoring policy/standard (covering event logs and monitoring)
      • Monitoring requirements • Retention standards
  - urn: urn:intuitem:risk:req_node:ia-sat-ml-nca-ecc:2-12-1-1
    assessable: true
    depth: 4
    parent_urn: urn:intuitem:risk:req_node:ia-sat-ml-nca-ecc:2-12-1
    ref_id: 2-12-1-1
    name: Cybersecurity event logs shall be enabled and collected for critical informat…
    description: 'Cybersecurity event logs shall be enabled and collected for critical information and
      technology assets of the Entity.


      **Implementation guide**


      Identify critical assets (e.g., core applications, databases, AD, security devices) and mandate
      that security-relevant logs are enabled and forwarded to a central log platform. Configure logging
      on these assets according to the approved standard (event types, level, forwarding) and ensure connectivity
      and storage are functioning.


      **Verification method**


      Confirm critical assets are formally identified and required to generate and send logs. Check a
      sample of critical systems and the central log platform to verify that logging is enabled and events
      are actually received'
    typical_evidence: •List of critical information/technology assets with logging requirement noted •Configuration
      evidence showing logging enabled on sampled critical assets (e.g., system/security log settings,
      agent/SIEM config) •Central log repository/SIEM view showing events received from these assets
  - urn: urn:intuitem:risk:req_node:ia-sat-ml-nca-ecc:2-12-1-2
    assessable: true
    depth: 4
    parent_urn: urn:intuitem:risk:req_node:ia-sat-ml-nca-ecc:2-12-1
    ref_id: 2-12-1-2
    name: The Entity shall subscribe to the services of a Managed Security Operations C…
    description: 'The Entity shall subscribe to the services of a Managed Security Operations Center (MSOC)
      service provider licensed or authorized by the Authority.


      **Implementation guide**


      Select an MSOC provider that is formally licensed/authorized by the NCA and sign a contract/SoW
      covering 24/7 monitoring, alerting, and incident response for the defined scope. Ensure the Entity’s
      logs and security telemetry are integrated with the MSOC, and that roles, SLAs, and communication/incident
      handling procedures are clearly defined.


      **Verification method**


      Confirm that the Entity has an active agreement with an NCA‑licensed/authorized MSOC and that the
      contracted scope matches regulatory expectations. Verify that log/alert data is actually being sent
      and used (e.g., sample alerts, reports, incident tickets)'
    typical_evidence: •Executed contract or service agreement with an MSOC provider showing NCA license/authorization
      reference •Service description or SoW listing monitoring, incident handling, and in-scope systems
      •Onboarding/connection evidence (e.g., SIEM integration, log forwarding or MSOC portal access)
  - urn: urn:intuitem:risk:req_node:ia-sat-ml-nca-ecc:2-12-2
    assessable: true
    depth: 3
    parent_urn: urn:intuitem:risk:req_node:ia-sat-ml-nca-ecc:domain-2-12
    ref_id: 2-12-2
    name: The Entity shall implement the approved cybersecurity requirements for managi…
    description: 'The Entity shall implement the approved cybersecurity requirements for managing and
      monitoring cybersecurity event logs.


      **Implementation guide**


      Enable logging on critical systems and security devices and forward events to the central monitoring
      platform operated by the Entity and/or its licensed MSOC. Apply the approved requirements for log
      content, retention, correlation, and alerting, and ensure the MSOC/SOC actively monitors, triages,
      and escalates relevant events.


      **Verification method**


      Confirm that logging and monitoring requirements, including MSOC involvement, are documented and
      approved. Check configurations and MSOC/SOC evidence (e.g., received logs, alerts, and reports)
      for a sample of critical systems to verify that logs are being collected and monitored as required'
    typical_evidence: •Evidence of log forwarding and integration with the licensed/authorized MSOC/SOC
      platform • Monitoring outputs such as alerts, dashboards, or periodic event/log review reports
  - urn: urn:intuitem:risk:req_node:ia-sat-ml-nca-ecc:2-12-3
    assessable: true
    depth: 3
    parent_urn: urn:intuitem:risk:req_node:ia-sat-ml-nca-ecc:domain-2-12
    ref_id: 2-12-3
    name: The Entity shall periodically review the cybersecurity requirements for manag…
    description: 'The Entity shall periodically review the cybersecurity requirements for managing and
      monitoring cybersecurity event logs.


      **Implementation guide**


      Conduct annual logging policy review and coverage assessments. Evaluate MSOC performance against
      SLAs.


      **Verification method**


      Verify review completion, assess coverage'
    typical_evidence: • Policy review documentation • Coverage assessment • MSOC performance review
  - urn: urn:intuitem:risk:req_node:ia-sat-ml-nca-ecc:domain-2-13
    assessable: false
    depth: 2
    parent_urn: urn:intuitem:risk:req_node:ia-sat-ml-nca-ecc:root
    ref_id: 2-13
    name: Cybersecurity Incident and Threat Management
  - urn: urn:intuitem:risk:req_node:ia-sat-ml-nca-ecc:2-13-1
    assessable: true
    depth: 3
    parent_urn: urn:intuitem:risk:req_node:ia-sat-ml-nca-ecc:domain-2-13
    ref_id: 2-13-1
    name: The Entity shall define, document, and approve cybersecurity requirements for…
    description: 'The Entity shall define, document, and approve cybersecurity requirements for managing
      cybersecurity incidents and threats. These requirements shall include, at a minimum, the following:


      **Implementation guide**


      Define requirements for detecting, classifying, responding to, and reporting cybersecurity incidents
      and threats, including roles and timelinesin addition to communication/notification rules. Document
      them as formal policies/procedures, ensure alignment with regulatory obligations, and obtain management
      approval and communication to all relevant teams.


      **Verification method**


      Confirm that documented, approved incident and threat management requirements exist and clearly
      describe processes, responsibilities. Review a sample of incident records or threat cases to see
      if they follow these requirements (classification, response steps, timelines, escalation)'
    typical_evidence: • Approved Incident and threat management policy/standard (including classification,
      response, and escalation)
  - urn: urn:intuitem:risk:req_node:ia-sat-ml-nca-ecc:2-13-1-1
    assessable: true
    depth: 4
    parent_urn: urn:intuitem:risk:req_node:ia-sat-ml-nca-ecc:2-13-1
    ref_id: 2-13-1-1
    name: Detailed incident response plans shall be developed for cybersecurity inciden…
    description: 'Detailed incident response plans shall be developed for cybersecurity incidents, including
      but not limited to data breaches and ransomware attacks. These plans shall define response procedures
      and escalation mechanisms.


      **Implementation guide**


      Develop specific playbooks for the main incident types, describing detection, containment, eradication,
      recovery, evidence handling, and communications. Clearly define who does what at each stage and
      when to escalate to higher management, legal, regulators, or other stakeholders. Keep contact details
      and escalation levels current and aligned with the overall incident management policy.


      **Verification method**


      Confirm that detailed, approved plans exist for data breach, malware, and ransomware and that they
      include procedures and escalation mechanisms. Check that roles and contacts are defined and up to
      date, then review a sample of incidents or exercises to see whether the plans were followed'
    typical_evidence: • Documented incident response plans/playbooks for data breaches, malware, and ransomware
      • Escalation matrix with roles, contact paths, and decision levels • Evidence of approval or last
      formal review of these plans
  - urn: urn:intuitem:risk:req_node:ia-sat-ml-nca-ecc:2-13-1-2
    assessable: true
    depth: 4
    parent_urn: urn:intuitem:risk:req_node:ia-sat-ml-nca-ecc:2-13-1
    ref_id: 2-13-1-2
    name: The Entity shall notify the National Cybersecurity Authority (NCA) upon the o…
    description: 'The Entity shall notify the National Cybersecurity Authority (NCA) upon the occurrence
      of a cybersecurity incident, in accordance with the requirements and procedures specified by the
      Authority.


      **Implementation guide**


      Define when and how cybersecurity incidents must be reported to NCA, including thresholds, timelines,
      channels, and required information. Integrate this into the incident response process so that once
      an incident meets NCA criteria, responsible roles trigger and document the notification using the
      approved template.


      **Verification method**


      Confirm that a documented, approved process exists for NCA incident notification and that it references
      current NCA requirements. Review incident records to see whether applicable cases were assessed
      against these criteria and, when required, reported to NCA using the defined procedure'
    typical_evidence: • NCA notification procedures • Notification templates • Incident notification records
      - if any- • Contact information for NCA
  - urn: urn:intuitem:risk:req_node:ia-sat-ml-nca-ecc:2-13-1-3
    assessable: true
    depth: 4
    parent_urn: urn:intuitem:risk:req_node:ia-sat-ml-nca-ecc:2-13-1
    ref_id: 2-13-1-3
    name: The Entity shall participate in sharing cybersecurity information with the Na…
    description: 'The Entity shall participate in sharing cybersecurity information with the National
      Cybersecurity Authority (NCA).


      **Implementation guide**


      Define when and what cybersecurity information (e.g., incident details, indicators of compromise,
      emerging threats) must be shared with NCA, based on their requirements. Assign responsibility, use
      agreed channels/templates, and ensure information is accurate, timely, and appropriately protected.


      **Verification method**


      Confirm a documented, approved procedure exists for cybersecurity information sharing with NCA and
      that roles and channels are defined. Review a sample of records or logs to verify that required
      information has been shared when applicable'
    typical_evidence: • Threat intelligence sharing procedures • Records or logs of shared information
      (e.g., incidents, threat intel submissions), if any
  - urn: urn:intuitem:risk:req_node:ia-sat-ml-nca-ecc:2-13-2
    assessable: true
    depth: 3
    parent_urn: urn:intuitem:risk:req_node:ia-sat-ml-nca-ecc:domain-2-13
    ref_id: 2-13-2
    name: The Entity shall implement the approved cybersecurity requirements for managi…
    description: 'The Entity shall implement the approved cybersecurity requirements for managing cybersecurity
      incidents and threats.


      **Implementation guide**


      Apply the approved requirements by using the defined processes, roles, and classification/response
      rules for all detected incidents and threats. Ensure detection, triage, investigation, response,
      and closure are handled as specified and that lessons learned feed into improvements.


      **Verification method**


      Confirm the approved incident/threat management requirements exist and are known to relevant teams.
      Review a sample of incident and threat cases to verify they follow the defined steps and timelines'
    typical_evidence: • Approved incident and threat management policy/standard •Sample incident and threat
      case records showing application of the process • Evidence of follow-up actions and closure (e.g.,
      tickets, action logs)
  - urn: urn:intuitem:risk:req_node:ia-sat-ml-nca-ecc:2-13-3
    assessable: true
    depth: 3
    parent_urn: urn:intuitem:risk:req_node:ia-sat-ml-nca-ecc:domain-2-13
    ref_id: 2-13-3
    name: The Entity shall periodically review the cybersecurity requirements for manag…
    description: 'The Entity shall periodically review the cybersecurity requirements for managing cybersecurity
      incidents and threats.


      **Implementation guide**


      Conduct annual incident response policy review and update playbooks based on incidents, exercises,
      lessons learned and threat landscape changes.


      **Verification method**


      Verify review completion, assess plan currency'
    typical_evidence: • Policy review documentation • Post-incident reviews • Exercise lessons learned
  - urn: urn:intuitem:risk:req_node:ia-sat-ml-nca-ecc:domain-2-14
    assessable: false
    depth: 2
    parent_urn: urn:intuitem:risk:req_node:ia-sat-ml-nca-ecc:root
    ref_id: 2-14
    name: Physical Security
  - urn: urn:intuitem:risk:req_node:ia-sat-ml-nca-ecc:2-14-1
    assessable: true
    depth: 3
    parent_urn: urn:intuitem:risk:req_node:ia-sat-ml-nca-ecc:domain-2-14
    ref_id: 2-14-1
    name: The Entity shall define, document, and approve cybersecurity requirements for…
    description: 'The Entity shall define, document, and approve cybersecurity requirements for the physical
      security of information and technology assets. These requirements shall include, at a minimum, the
      following:


      **Implementation guide**


      Define physical security requirements for critical areas and assets (access control, locking, visitor
      handling, surveillance, environmental protection, and equipment handling). Document them as a formal
      policy / standard, clearly assigning responsibilities and aligning with overall information security
      objectives, then obtain management approval and communicate to facilities/IT teams.


      **Verification method**


      Confirm that an approved physical security policy / standard exists and explicitly covers information
      and technology assets and locations. Check that requirements are specific and in use (e.g., referenced
      in procedures or site rules)'
    typical_evidence: • Physical security policy/standard covering information and technology assets •
      Documented requirements for securing areas/equipment (e.g., data centers, server rooms, network
      closets, offices) • Evidence of management approval or latest formal review of these requirements
  - urn: urn:intuitem:risk:req_node:ia-sat-ml-nca-ecc:2-14-1-1
    assessable: true
    depth: 4
    parent_urn: urn:intuitem:risk:req_node:ia-sat-ml-nca-ecc:2-14-1
    ref_id: 2-14-1-1
    name: Physical access to information technology rooms, data centers, and areas hous…
    description: 'Physical access to information technology rooms, data centers, and areas housing sensitive
      electronic devices shall be secured and restricted to authorized personnel only.


      **Implementation guide**


      Ensure IT rooms, data centers, and areas with sensitive devices are locked and protected by controlled
      access mechanisms (e.g., card readers, biometrics, keys) with access granted only to authorized
      roles. Keep access lists up to date and revoke access promptly when no longer needed.


      **Verification method**


      Confirm documented rules exist restricting access to these areas and that access lists reflect current
      authorized staff. Review a sample of access logs and on-site controls to verify that entry is controlled
      and consistent with the physical assess lists'
    typical_evidence: • Physical access matrix defining access permissions • Sample access logs or entry
      records for selected secure areas • Visitor management procedures
  - urn: urn:intuitem:risk:req_node:ia-sat-ml-nca-ecc:2-14-1-2
    assessable: true
    depth: 4
    parent_urn: urn:intuitem:risk:req_node:ia-sat-ml-nca-ecc:2-14-1
    ref_id: 2-14-1-2
    name: Physical access to information and technology assets of the Entity, including…
    description: 'Physical access to information and technology assets of the Entity, including computers,
      servers, storage media, and printed documents, shall be protected using appropriate physical security
      controls.


      **Implementation guide**


      Apply physical safeguards such as locked rooms, cabinets, and device locks to protect computers,
      servers, storage media, and printed documents, with access limited to authorized personnel. Ensure
      sensitive assets are stored in controlled areas when unattended and that issuance/return of media
      and files is managed.


      **Verification method**


      Confirm documented requirements exist for physically securing IT assets, media, and documents. Inspect
      a sample of locations and assets to verify controls (locks, cabinets, secure storage) are in place
      and used'
    typical_evidence: • Physical security procedure/policy covering access to IT equipment, media, and
      paper records • Examples of implemented controls (e.g., locked offices/cabinets, device locks, secure
      storage areas) • Access or issuance records for sensitive assets (e.g., media lockers, archive rooms)
      • Acceptable use policy • Environmental monitoring dashboards (temperature, humidity, water detection)
      • Maintenance schedules and logs for UPS, fire suppression, and HVAC systems
  - urn: urn:intuitem:risk:req_node:ia-sat-ml-nca-ecc:2-14-1-3
    assessable: true
    depth: 4
    parent_urn: urn:intuitem:risk:req_node:ia-sat-ml-nca-ecc:2-14-1
    ref_id: 2-14-1-3
    name: Closed-Circuit Television (CCTV) logs must be protected.
    description: 'Closed-Circuit Television (CCTV) logs must be protected.


      **Implementation guide**


      Install CCTV cameras to cover entrances and key internal areas of critical IT locations (e.g., data
      centers, server rooms), ensuring continuous recording and secure storage of footage for the defined
      retention period, in line with legal/privacy regulations. Clearly assign responsibility for monitoring,
      maintenance, and access to recordings.


      **Verification method**


      Confirm documented requirements exist for CCTV coverage and retention at critical IT locations and
      that installed cameras match this design. Review a sample of recent recordings and logs to verify
      cameras are operational and footage is retained as required'
    typical_evidence: • Approved physical security policy ( clearling enforcing the use of CCTV and records
      retention) • CCTV layout or camera list covering data centers/IT rooms and entry points • Sample
      CCTV logs/exports or screenshots showing recording and retention in operation • CCTV footage retention
      verification (demonstrating minimum 90-day retention as per policy)
  - urn: urn:intuitem:risk:req_node:ia-sat-ml-nca-ecc:2-14-2
    assessable: true
    depth: 3
    parent_urn: urn:intuitem:risk:req_node:ia-sat-ml-nca-ecc:domain-2-14
    ref_id: 2-14-2
    name: The Entity shall implement the approved cybersecurity requirements for the ph…
    description: 'The Entity shall implement the approved cybersecurity requirements for the physical
      security of information and technology assets.


      **Implementation guide**


      Apply the approved physical security requirements to all relevant locations and assets (e.g., data
      centers, IT rooms, offices, storage areas), ensuring controls such as restricted access, secure
      storage, and monitoring are in place and maintained. Integrate these requirements into facilities
      and IT procedures so that new sites/areas and changes automatically follow them.


      **Verification method**


      Confirm the approved physical security requirements exist and clearly apply to the locations and
      assets in scope. Inspect a sample of sites and assets, comparing actual controls to the documented
      requirements'
    typical_evidence: • Sample site/room procedures or checklists showing application of the physical
      security requirements • Evidence of implemented controls at selected locations (e.g., access control,
      locks, CCTV, secure storage)
  - urn: urn:intuitem:risk:req_node:ia-sat-ml-nca-ecc:2-14-3
    assessable: true
    depth: 3
    parent_urn: urn:intuitem:risk:req_node:ia-sat-ml-nca-ecc:domain-2-14
    ref_id: 2-14-3
    name: The Entity shall periodically review the cybersecurity requirements for the p…
    description: 'The Entity shall periodically review the cybersecurity requirements for the physical
      security of information and technology assets.


      **Implementation guide**


      Conduct annual physical security policy review and control assessments. Update requirements based
      on facility changes and incidents.


      **Verification method**


      Verify review completion, assess control effectiveness'
    typical_evidence: • Policy review documentation • Physical security assessment
  - urn: urn:intuitem:risk:req_node:ia-sat-ml-nca-ecc:domain-2-15
    assessable: false
    depth: 2
    parent_urn: urn:intuitem:risk:req_node:ia-sat-ml-nca-ecc:root
    ref_id: 2-15
    name: Web Applications Protection
  - urn: urn:intuitem:risk:req_node:ia-sat-ml-nca-ecc:2-15-1
    assessable: true
    depth: 3
    parent_urn: urn:intuitem:risk:req_node:ia-sat-ml-nca-ecc:domain-2-15
    ref_id: 2-15-1
    name: The Entity shall define, document, and approve cybersecurity requirements for…
    description: 'The Entity shall define, document, and approve cybersecurity requirements for protecting
      external web applications from cybersecurity risks. These requirements shall include, at a minimum,
      the following:


      **Implementation guide**


      Define security requirements for all external web applications, covering at least WAF protection,
      secure multi‑tier architecture, secure communication (HTTPS/TLS), OWASP Top 10 controls, secure
      coding, and security testing before go‑live. Document these as a formal policy/standard, clearly
      identify in‑scope external web applications, and obtain management approval and communication.


      **Verification method**


      Confirm a documented, approved set of cybersecurity requirements exists specifically for external
      web applications. Check that requirements are concrete (e.g., WAF, testing, secure architecture)
      and used in development/operations processes'
    typical_evidence: • Approved web application security policy • Documented security requirements for
      external web apps (e.g., WAF, architecture, secure development, testing)
  - urn: urn:intuitem:risk:req_node:ia-sat-ml-nca-ecc:2-15-1-1
    assessable: true
    depth: 4
    parent_urn: urn:intuitem:risk:req_node:ia-sat-ml-nca-ecc:2-15-1
    ref_id: 2-15-1-1
    name: A Web Application Firewall (WAF) shall be implemented to protect external web…
    description: 'A Web Application Firewall (WAF) shall be implemented to protect external web applications
      against common web-based attacks.


      **Implementation guide**


      Deploy a WAF in front of all external web applications and configure it to filter, detect, and block
      common web attacks (e.g., injection, XSS, OWASP Top 10) while allowing legitimate traffic. Keep
      protection profiles and signatures up to date and ensure new external web apps are onboarded to
      the WAF by default.


      **Verification method**


      Confirm that all external web applications are routed through a WAF and that protection policies
      are active. Review WAF configuration and a sample of logs/reports to verify it is inspecting traffic
      and blocking/alerting on attacks'
    typical_evidence: • Evidence of WAF deployment in front of external web applications (architecture/diagram
      or configuration snapshot) • List of protected external web applications/URLs mapped to the WAF
      • Sample WAF logs or reports showing detected/blocked web attacks
  - urn: urn:intuitem:risk:req_node:ia-sat-ml-nca-ecc:2-15-1-2
    assessable: true
    depth: 4
    parent_urn: urn:intuitem:risk:req_node:ia-sat-ml-nca-ecc:2-15-1
    ref_id: 2-15-1-2
    name: A multi-tier architecture shall be implemented.
    description: 'A multi-tier architecture shall be implemented.


      **Implementation guide**


      Design external and internal applications with distinct presentation, application, and data layers
      placed in separate network segments, with only necessary, controlled communication allowed between
      tiers. Ensure direct access to data layers from the internet or user networks is blocked, and that
      changes to architecture preserve this separation.


      **Verification method**


      Confirm that current architecture diagrams and designs show a clear multi‑tier model for in‑scope
      applications. Validate, via a sample of systems and network controls, that communication paths enforce
      this separation and that no direct access to data layers exists from untrusted zones'
    typical_evidence: •High-level architecture/network diagrams showing separate presentation, application,
      and data tiers •Documentation describing network/segmentation rules between tiers (e.g., firewall/ACL
      rules) •Sample configuration or design document for a key system showing tier separation in practice
  - urn: urn:intuitem:risk:req_node:ia-sat-ml-nca-ecc:2-15-1-3
    assessable: true
    depth: 4
    parent_urn: urn:intuitem:risk:req_node:ia-sat-ml-nca-ecc:2-15-1
    ref_id: 2-15-1-3
    name: Secure communication protocols shall be used for web applications, including…
    description: 'Secure communication protocols shall be used for web applications, including the use
      of HTTPS and other secure protocols as applicable.


      **Implementation guide**


      Configure all external (and relevant internal) web applications to use HTTPS with valid certificates
      and disallow plain HTTP or weak/obsolete protocols and ciphers. Ensure new web services follow the
      same standard by default and that certificates are renewed before expiry.


      **Verification method**


      Confirm documented requirements mandate HTTPS and other secure protocols for web applications. Test
      a sample of web apps to verify that only secure protocols are accepted and that certificates are
      valid and current'
    typical_evidence: • Configuration or screenshots showing HTTPS enabled for external web applications
      •Sample TLS/SSL certificate details for key web applications • Technical design/standard stating
      secure protocols/cipher requirements for web apps
  - urn: urn:intuitem:risk:req_node:ia-sat-ml-nca-ecc:2-15-1-4
    assessable: true
    depth: 4
    parent_urn: urn:intuitem:risk:req_node:ia-sat-ml-nca-ecc:2-15-1
    ref_id: 2-15-1-4
    name: A secure usage policy for web applications shall be defined and communicated…
    description: 'A secure usage policy for web applications shall be defined and communicated to users.


      **Implementation guide**


      Define acceptable and prohibited behaviors when using the Entity’s web applications (e.g., handling
      of credentials, session timeouts, data download/sharing, suspected incident reporting). Approve
      the policy and make it easily accessible and clearly communicated to users through onboarding, awareness,
      and the applications themselves.


      **Verification method**


      Confirm a written, approved secure usage policy exists specifically for web applications and is
      aligned with overall security requirements. Verify that users are actually exposed to it (e.g.,
      via login page, portal, or awareness material)'
    typical_evidence: • Documented secure usage policy or guidelines for using the Entity’s web applications
      • Evidence of communication to users (e.g., email notice, portal banner, or user handbook)
  - urn: urn:intuitem:risk:req_node:ia-sat-ml-nca-ecc:2-15-1-5
    assessable: true
    depth: 4
    parent_urn: urn:intuitem:risk:req_node:ia-sat-ml-nca-ecc:2-15-1
    ref_id: 2-15-1-5
    name: User identity verification mechanisms shall be implemented using appropriate…
    description: 'User identity verification mechanisms shall be implemented using appropriate authentication
      factors and quantities, based on risk assessment and the potential impact of authentication failure,
      to secure user access to web applications.


      **Implementation guide**


      Define risk-based authentication requirements for web applications, specifying when to use single-factor
      vs. multi-factor (and which factors) according to data sensitivity and impact of compromise. Implement
      these mechanisms in the web apps or central IAM, and ensure high‑risk and external-facing applications
      enforce MFA for relevant users.


      **Verification method**


      Confirm documented requirements exist describing risk-based authentication for web applications
      and MFA use. Review a sample of web apps and user profiles to verify that authentication mechanisms
      match the defined risk-based rules'
