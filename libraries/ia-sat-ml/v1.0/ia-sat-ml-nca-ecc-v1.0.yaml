    parent_urn: urn:intuitem:risk:req_node:ia-sat-ml-nca-ecc:domain-1-5
    ref_id: 1-5-1
    name: The cybersecurity awareness programs must cover key relevant topics (e.g., ph…
    description: 'The cybersecurity awareness programs must cover key relevant topics (e.g., phishing,
      ransomware, strong passwords, safe behavior on social media, reporting incidents and suspicious
      behavior) and must be tailored to the roles and needs of employees


      **Implementation guide**


      Develop comprehensive awareness program covering phishing, ransomware, password security, social
      media risks, and incident reporting. Create role-specific modules for IT staff, executives, and
      general users.


      **Verification method**


      Review training curriculum, verify topic coverage'
    typical_evidence: • Awareness program curriculum • Role-based training materials • Topic coverage
      matrix • Training content samples
  - urn: urn:intuitem:risk:req_node:ia-sat-ml-nca-ecc:1-5-2
    assessable: true
    depth: 3
    parent_urn: urn:intuitem:risk:req_node:ia-sat-ml-nca-ecc:domain-1-5
    ref_id: 1-5-2
    name: The cybersecurity awareness program must be implemented.
    description: 'The cybersecurity awareness program must be implemented.


      **Implementation guide**


      Implement mandatory annual awareness training for all employees with completion tracking. Conduct
      periodic phishing simulations and knowledge assessments to measure effectiveness.


      **Verification method**


      Verify training completion rates, review simulation and test results'
    typical_evidence: • Training completion records • Attendance logs • Assessment/quiz results • Phishing
      simulation reports • Training schedule and calendar
  - urn: urn:intuitem:risk:req_node:ia-sat-ml-nca-ecc:1-5-3
    assessable: true
    depth: 3
    parent_urn: urn:intuitem:risk:req_node:ia-sat-ml-nca-ecc:domain-1-5
    ref_id: 1-5-3
    name: The Entity shall periodically review the approved cybersecurity awareness pro…
    description: 'The Entity shall periodically review the approved cybersecurity awareness programs.


      **Implementation guide**


      Review awareness program annually for content relevance, delivery effectiveness, and alignment with
      emerging threats. Update materials based on incident trends and employee feedback.


      **Verification method**


      Review program update records, verify content currency'
    typical_evidence: • Program review documentation • Content update records
  - urn: urn:intuitem:risk:req_node:ia-sat-ml-nca-ecc:domain-2-1
