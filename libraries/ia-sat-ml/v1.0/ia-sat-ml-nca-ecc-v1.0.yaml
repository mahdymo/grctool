    ref_id: 3-1-2
    name: The Entity shall implement the approved cybersecurity requirements within con…
    description: 'The Entity shall implement the approved cybersecurity requirements within contracts
      and agreements with third parties.


      **Implementation guide**


      Translate the approved third‑party cybersecurity requirements into mandatory contract/SLA clauses
      and standard templates, covering security controls, confidentiality, data protection, incident notification,
      compliance, and audit rights. Ensure legal and procurement processes enforce these templates for
      all in‑scope third parties, with exception handling and approvals for any deviations. Periodically
      review a sample of existing contracts and update them upon renewal to close any gaps.


      **Verification method**


      Confirm that the Entity has approved cybersecurity requirements for third‑party contracts and that
      these are integrated into standard templates and review checklists. Review a sample of executed
      contracts/SLAs with key third parties to verify that the approved clauses are present and materially
      consistent'
    typical_evidence: • Approved third‑party/outsourcing security requirements or contract clause templates
      (including cybersecurity, confidentiality, data protection, incident notification, audit rights).
      • Sample signed contracts/SLAs with critical third parties showing that the approved cybersecurity
      clauses are actually included. • Contract review/checklist or workflow evidence showing that legal/procurement
      verify inclusion of the approved cybersecurity requirements before signing/renewal.
  - urn: urn:intuitem:risk:req_node:ia-sat-ml-nca-ecc:3-1-3
    assessable: true
    depth: 3
    parent_urn: urn:intuitem:risk:req_node:ia-sat-ml-nca-ecc:domain-3-1
    ref_id: 3-1-3
    name: The Entity shall periodically review the cybersecurity requirements included…
    description: 'The Entity shall periodically review the cybersecurity requirements included in contracts
      and agreements with third parties.


      **Implementation guide**


      Define a formal review cycle (e.g., annually or aligned with contract renewal) to assess whether
      contractual cybersecurity requirements remain adequate and aligned with current policies, regulations,
      and risk posture. Assign responsibility (e.g., vendor management, legal, information security) and
      maintain an inventory of in‑scope third‑party agreements with due dates. Document review outcomes
      and ensure necessary updates are negotiated and tracked to closure.


      **Verification method**


      Confirm that a documented process exists for periodic review of cybersecurity requirements in third‑party
      contracts, including defined frequency and roles. Examine review records and a sample of contracts
      before and after review to verify that assessments are performed and that required updates to cybersecurity
      clauses are implemented or formally tracked.'
    typical_evidence: •Third party policy review •Samples of updated contracts/SLAs or documented remediation
      actions showing that identified gaps in cybersecurity requirements were addressed. • Requirement
      update records • Vendor reassessment documentation
