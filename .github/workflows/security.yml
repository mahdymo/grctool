name: security-gates

# Spec §6.1 — mandatory CI security gates: secrets, dependencies, SAST, containers/IaC.
# Deploy is blocked on any critical finding.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  secrets-scan:
    name: Secrets scan (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITLEAKS_ENABLE_COMMENTS: "false"

  dependency-scan:
    name: Dependency scan (pip-audit)
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [converter, migration, control-plane, email-worker]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Audit ${{ matrix.service }}
        run: |
          pip install pip-audit
          pip-audit -r ${{ matrix.service }}/requirements.txt --strict

  sast:
    name: SAST (Semgrep)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: |
          pip install semgrep
          semgrep scan --config p/python --config p/security-audit --error --metrics off

  container-iac-scan:
    name: Container & IaC scan (Trivy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Scan filesystem (IaC + deps)
        uses: aquasecurity/trivy-action@0.28.0
        with:
          scan-type: fs
          scan-ref: .
          severity: CRITICAL,HIGH
          exit-code: "1"
          skip-dirs: migration/source-data
