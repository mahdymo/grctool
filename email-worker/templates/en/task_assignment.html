{% extends base_template %}
{% block content %}
<p>Hello {{ recipient_name }},</p>
<p>A task has been assigned to you:</p>
<p style="background:#f4f6f8;padding:12px;border-radius:4px;">
  <strong>{{ item_id }}</strong> — {{ title }}<br>
  {% if due_date %}Target date: <strong>{{ due_date }}</strong>{% endif %}
</p>
<p><a href="{{ item_url }}" style="background:#0f4c81;color:#fff;padding:10px 20px;text-decoration:none;border-radius:4px;">View task</a></p>
{% endblock %}
